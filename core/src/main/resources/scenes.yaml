# «🏠 Дом»: канцелярия совета — Юнона Кинтслев продаёт дома — и сам дом героя.
home:
  office:
    intro: |
      Свой угол в Кинэте не купишь у первого встречного: на дверях не пишут «продаётся», а спрашивать прохожих — верный способ купить чужой сарай. Подсказка находится на доске у ратуши. Между объявлением о пропавшей козе и набором в ночную стражу висит лист плотной бумаги с печатью городского совета:

      «Городской недвижимостью Кинэта распоряжается совет через своего представителя — Юнону Кинтслев. Покупка, обустройство, продажа и расширение имущества — только через неё. Канцелярия совета, второй этаж».

      На втором этаже — узкий кабинет, до потолка заставленный папками. За столом пишет женщина. Сидит спиной к стене, лицом к двери — так садятся те, кто привык, что беда приходит из-за спины. Рукава закатаны. На правой руке от запястья к локтю тянется старый белый рубец, а пальцы, что держат перо, в мозолях — такие набивает не перо, а рукоять. У стола рядом с зонтом стоит короткий меч в потёртых ножнах. Зонт, кажется, для вида.

      Она дописывает строку, ставит точку и только тогда поднимает глаза. Смотрит быстро, снизу вверх: сапоги, пряжки, руки.

      «Юнона Кинтслев, совет. А ты из искателей. Не спорь: стоишь вполоборота к двери, грязь на сапогах лабиринтная, а не уличная, и левую руку держишь так, будто в ней должен быть щит. Я сама восемь лет так ходила — пока колено не решило за меня.

      Значит, тебе нужна крыша над головой. Правильно: сторожка с дырой в потолке — не место, где искатель спит спокойно. Особенно когда эту дыру он сам и пробил — с неба, вместе с соломой.»

      Она подмигивает. Вам становится не по себе: как вы свалились на ту крышу, видеть было некому — так вам казалось до этой минуты.

      «Садись. Покажу, что есть у совета.»
    greeting: "Юнона поднимает глаза от папки: «А, искатель. Живой — уже хорошо. Что смотрим?»"
    owner: "Юнона кивает на стул: «Как дом? Не течёт? Если стало тесно — подберём просторнее.»"
    top: "Юнона кивает на стул: «Выше острова у совета ничего нет. Разве что звёзды — но ими распоряжается не совет. Неужели тебе всё ещё чего-то не хватает? Ну и ну. Не думала, что среди {race} бывают такие ненасытные.»"
    offer: "🏠 {name}"
    furnish: "🛠 Обустройство"
    furnishText: "Юнона достаёт папку с надписью «Обустройство». «Мастера, мебель, всё для уюта — это для тех, у кого есть дом. Сперва дом, искатель, потом обстановка.»"
    silver: "{price} 🪙"
    doubloons: "{price} 🟡"
    priceOr: "{first} или {second}"
    confirm: "Подписываем? «{name}» за {price}."
    confirmTrade: "Твой «{old}» уходит в управление совета."
    sign: "✍ Подписать за {price}"
    lack: "Юнона сверяется с книгой и качает головой: «Не хватает {lack}. Приходи, когда будет.»"
    home: "🏠 Домой"
    leave: "Уйти"
  houses:
    cottage:
      name: "Домик в две комнаты"
      pitch: |
        «Домик на тихой улице за ремесленным кварталом. Две комнаты, печь, стол, кровать, сундук — всё, что нужно для жизни, и ничего сверх. Уютно, только пыльно: прежний хозяин съехал второпях, так что придётся засучить рукава и навести порядок. Не морщись: у многих в Кинэте нет и такого.

        И ещё. Там остался рунический алтарь. Вообще-то в продажу он не входит, его положено снимать до сделки. Я не стала. Тебе, искателю, он ещё пригодится.»
      bought: "Юнона ставит печать, отрывает корешок и протягивает ключ. «Поздравляю, искатель. Теперь тебе есть куда возвращаться.»"
      inside: "Ваш домик: две комнаты, печь, стол и кровать. Пыль вы выгребли, хотя в углах ещё есть над чем потрудиться. В дальней комнате тускло светится рунический алтарь."
      bed: "Узкая кровать с продавленным матрасом. Скрипит, но держит. После лабиринта и такая — роскошь."
      armory: "Оружейная — громко сказано: это чулан за печью, где пахнет дымом и старым деревом. Пара стоек встанет здесь вплотную — больше не втиснуть."
    townhouse:
      name: "Добротный дом"
      pitch: |
        «Это уже добротный дом: каменный низ, крепкая дверь, свой двор. Внутри — личный алтарь Азата: его магия питает весь дом. Верстак травника с полками и котелком. И маленькая библиотека — пока пустая, но полки ждут. А во дворе уже есть место, чтобы расшириться, когда станет тесно.»
      tradeFrom:
        cottage: "«Твой домик можешь сдать обратно в управление совета — его зачтут в цену. Выйдет {price}. Вещи перевезут, всё личное тоже. Я прослежу.»"
      bought: "Юнона ставит печать, отрывает корешок и протягивает ключ. «Поздравляю, искатель. Теперь тебе есть куда возвращаться.»"
      inside: "Ваш дом: крепкие стены, свой двор. В зале — алтарь Азата, его магия питает весь дом. У окна — верстак травника с полками и котелком, за дверью — маленькая библиотека. Во дворе ещё есть место для пристройки."
      bed: "Широкая кровать с чистым бельём и тяжёлым одеялом. Здесь спится крепко."
      library: "Маленькая библиотека: три полки, кресло у окна, лампа с треснувшим стеклом. Полки пока пусты — книги ещё предстоит собрать."
