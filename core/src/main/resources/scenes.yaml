  # «Большое дело» (задание 11-го уровня): дом с синей дверью на Торговой площади.
  house:
    pitch: |
      Синюю дверь на Торговой площади видно издалека: её явно красили недавно и от души. Я стучу три раза.

      — Делец! — Барти втаскивает меня внутрь, будто за мной гонятся. — Не смотри на беспорядок. Это не беспорядок, это склад.

      Ящики, тюки, пустые бутыли вдоль стены и карта на столе, придавленная чайником. На карте углём обведена Западная дорога.

      «Слушай внимательно, — Барти понижает голос, хотя в доме, кроме нас, только мыши. — Большое дело. Контрабанда. Каджитский караван идёт через изгородь с материка. У них в песках за флягу живой воды отдают коня, а за бутылку шнапса — двух. И платят каджиты не серебром. Золотом!

      Нужно двадцать бутылок шнапса и двадцать склянок живой воды. Неси хоть по одной — я всё сложу здесь, у меня надёжно. Ты варишь — я договариваюсь. Прибыль пополам. Ну, почти пополам.»

      Каджиты. Про их караваны говорят всякое. Ра'Шидд с Западной дороги, говорят, раздевал гостей в кости до рубахи — а кто выигрывал, тот до утра не доживал. Барти об этом, конечно, не слышал. Барти вообще слышит только то, что звенит.
    stock: "У Барти уже сложено: шнапса — {schnapps} из {goal}, живой воды — {water} из {goal}."
