  cleared: "★ Последний мертвец рассыпается в прах, и в пещере становится по-настоящему тихо. Такой тишины здесь не было давно: +{exp} опыта."
  allClear: "Некроманта больше нет, и поднимать мертвецов здесь некому. Дело сделано — можно возвращаться к доске."
  upperClear: "Этот ярус упокоен. Но снизу всё ещё тянет холодом, и оттуда доносится шёпот — ровный, как молитва."
  supply:
    dope: "💤 {name} идёт в ход у самого входа. Мертвецы не дышат, но дурь оседает на них, как иней на камне: атака и энергия обитателей пещеры просели на {pct}%."
    already: "{name} тут уже не поможет: пещера своё получила."
    wasted: "Вы истратили «{name}». Мёртвым до этого нет никакого дела."
    map: "🗺 Надо же. Карта вела сюда же — значит, среди этих костей что-то зарыто…"
    mapAlready: "Клад здесь уже отмечен — второй карте делать нечего. Вы убираете её обратно."
    mapHalf: "На половинке карты не видно, где копать. Рвать её у входа в пещеру точно не стоит."
  altar:
    swapped: "{old} отходит в сторону и растворяется в темноте пещеры. На его место встаёт {name}."
  room:
    stairs: "В полу — провал, а в нём вырублены ступени. Снизу тянет таким холодом, что пар от дыхания застывает в воздухе. Нижний ярус."
  descended: "Вы спускаетесь на нижний ярус. Кости здесь уже не валяются — они сложены вдоль стен ровными рядами. Хозяин где-то близко."

# Городские воры: засада в подворотне и то, чем она аукнется.
thieves:
  alley: "Вы отправились выжидать воров в одной из подворотен."
  ambush: "⚔ Из темноты выходят {count} — это они. Шайка {race}, и говорить им не о чем."
  won: "Последний оседает в лужу. С каждого вы срезаете по кошельку — {count} штук. Те, кто успел уйти, запомнили ваше лицо: это была банда «{gang}»."
  lost: "Ночь прошла впустую: в подворотне так никто и не появился. Вы возвращаетесь в город."

  # Названия банд по расам. Их узнают после дела — и под ними же банда приходит
  # за своим в лабиринт.
  gang:
    Человек:   "Серые плащи"
    Эльф:     "Тихая стрела"
    Орк:     "Разбитые зубы"
    Гоблин:  "Пустые карманы"
    Мурлок:  "Мокрые руки"
    Демон:   "Чёрные свечи"
    Гном:   "Отмычки"
    Каджит: "Девять теней"

  # Засада в лабиринте: удар уже нанесён, и уйти некуда. По одному тексту на
  # расу — бьёт каждая по-своему.
  ambushScene:
    Человек: "Из бокового хода вас окликают по имени — и вы оборачиваетесь. Зря. Нож входит под рёбра раньше, чем вы успеваете поднять руку. Вы получили {damage} урона!\n\n«Серые плащи» помнят всё. {name} вытирает лезвие о рукав и ждёт, пока вы встанете."
    Эльф: "Тетива щёлкает где-то над головой, и стрела входит в плечо прежде, чем вы слышите выстрел. Вы получили {damage} урона!\n\n{name} спускается с уступа, не торопясь. «Тихая стрела» бьёт один раз — и всегда первой."
    Орк: "Свод обрушивается вам на спину — нет, это кулак. Вас вбивает в стену так, что в глазах темнеет. Вы получили {damage} урона!\n\n{name} разминает пальцы. «Разбитые зубы» не любят объяснять дважды."
    Гоблин: "Что-то дёргает вас за щиколотку, и пол уходит из-под ног. Падение выбивает дух, а чьи-то руки успевают пройтись по карманам. Вы получили {damage} урона!\n\n{name} ухмыляется сверху. «Пустые карманы» своё забирают."
    Мурлок: "Вода в луже вскипает, и оттуда бьёт гарпун — наискось, через бедро. Вы получили {damage} урона!\n\n{name} выбирается следом, не спеша. «Мокрые руки» ждали вас именно здесь."
    Демон: "Тень у стены оказывается не тенью. Когти проходят вдоль спины, и воздух пахнет палёным. Вы получили {damage} урона!\n\n{name} смотрит на вас с интересом. «Чёрные свечи» горят до конца."
    Гном: "Щелчок, короткий свист — и в бок входит болт из арбалета, собранного кем-то умелым. Вы получили {damage} урона!\n\n{name} неторопливо взводит второй. «Отмычки» вскрывают всё, в том числе и вас."
    Каджит: "Вы не слышите ничего. Просто вдруг оказывается, что по вашей руке течёт кровь. Вы получили {damage} урона!\n\n{name} стоит там, где секунду назад было пусто. «Девять теней» приходят девять раз."

