  leaveLabel:
    label: "Уйти"
    color: "negative"
  fightStart: "Гоблины бросаются на вас всем скопом, размахивая шилами."
  gone: "Склад пуст: ни гоблинов, ни ваших вещей."
  death: "Вы приходите в себя у причала, в пустых карманах — ветер. Гоблины не добили: им было некогда. Ваши вещи всё ещё у них на складе — по следу можно идти снова."
  # Банда разбита: своё — обратно в бочку.
  back: "Последний гоблин удирает в щель под причалом — без ваших вещей. Вы собираете своё с мешковины до последнего гвоздя, несёте обратно к бочке и сами прибиваете новую крышку."
  backKin: "«Свой своему…» — бормочет последний гоблин и удирает в щель под причалом — без ваших вещей. Вы собираете своё с мешковины до последнего гвоздя, несёте обратно к бочке и сами прибиваете новую крышку."
