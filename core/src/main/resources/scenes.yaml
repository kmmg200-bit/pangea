      color: "positive"
    told: "Ришелье берёт лоскут двумя пальцами, будто тот заразный.\n\n«Гоблинская работа. Видишь каракули? Они не продают вещь как есть — сперва перешивают под себя: шипы, ремешки, лишние карманы. За такую потом и половины не дают. Это «{gang}» — беглые рабы, ошейники так и не сняли. Сидят на старом складе у причала, за рыбными рядами. Иди, пока они не перешили всё.»"
  # Карточка улики, когда место известно.
  card:
    onTrail: "Ришелье назвал банду — «{gang}», старый склад у причала. Идти по следу можно из города."
  trailLabel:
    label: "Идти по следу"
    color: "positive"
  onlyInCity: "По следу можно пойти только из города."
  # Склад у причала.
  lair: "Ришелье не соврал: старый склад у причала, дверь подпёрта бочкой из-под селёдки. Внутри — верстак из перевёрнутой лодки, обрезки ремней, гвозди в банке и ваши вещи, разложенные на мешковине. Над ними колдуют четверо гоблинов в рабских ошейниках с обрывками цепей — «{gang}». Один как раз пришивает к вашему наплечнику второй карман.\n\nЗаметив вас, они хватаются за шила и молотки."
  lairKin: "Ришелье не соврал: старый склад у причала, дверь подпёрта бочкой из-под селёдки. Внутри — верстак из перевёрнутой лодки, обрезки ремней, гвозди в банке и ваши вещи, разложенные на мешковине. Над ними колдуют четверо гоблинов в рабских ошейниках с обрывками цепей — «{gang}». Один как раз пришивает к вашему наплечнику второй карман.\n\nСтарший щурится на вас: «Свой? Свой у своих не берёт… Только мы-то не знали, чья бочка. А раз узнали — отдавать уже жалко.» Они хватаются за шила и молотки."
  fightLabel:
    label: "⚔ Напасть"
