  ratKingLoreLabel: "Что ты знаешь о Крысином короле?"
  ratKingLoreOffer: "Знания в этом мире стоят многое. Заплатишь {price} серебра, и я расскажу тебе и легенду и как с такими бороться."
  ratKingLorePay:
    label: "Заплатить"
    color: "positive"
