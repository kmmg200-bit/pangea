    enterKin: "Три камня, тростник — и вот она. Хижины на сваях, крытые чешуёй какой-то очень большой рыбы, между ними мостки из вёсел. На верёвках сушится рыба, на кольях — черепа тех, кто приходил из-за холмов. Из тростника на вас глядит сорок глаз — и не пропадает: на вас смотрят, как на вернувшегося. Чей-то молодой голос орёт на всю заводь: «Старейшина-а! Наш пришёл! Тот, который сотню!» Мрачноглаз шлёпает навстречу, звеня колокольчиками.\n\n«Мрргл. Дома. Ну — почти. Значит, „наверное“ сбылось.»"
