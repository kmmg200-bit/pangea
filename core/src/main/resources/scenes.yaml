# «Пропавшая дружина»: с пятисотого убитого — фонарь старшины гномьей дружины
# «Двенадцать фонарей». Брамбл за столом наёмников знает, чей он; штольня — под
# серебряной жилой; у завала — вывести дружину или забрать груз. Ключи с хвостом
# Kin — реплики для героя-гнома (см. LostSquadQuest.key).
lostSquad:
  questDone: "📜 Квест «Пропавшая дружина» завершён."
  lanternFound: "Среди добычи блеснула латунь: гномий фонарь, стекло треснуло. На ободе выбито «Двенадцать фонарей · Двенадцатый». Масло в нём свежее — его зажигали совсем недавно. На внутренней стороне крышки нацарапано: «Нижний горизонт. Семеро живы. Вода прибывает»."
  tavernHint: "Вы вспоминаете гнома-наёмника за дальним столом в таверне: у него на поясе висит точно такой же фонарь. Может, он знает больше?"
  bramblInSquad: "Брамбл выхватывает фонарь у вас из рук и долго смотрит на обод. «Это фонарь нашего старшины. „Двенадцать фонарей“ — моя дружина, я был седьмым. Нас нанял Гуннар Отвес со Стройки: камень и руда для города. Пошли в старую штольню предков под Серебряной жилой — и свод сел. Выбрался я один, неделю копал наверх. Думал, все…» Он переворачивает крышку и читает нацарапанное. «Семеро живы. И масло свежее. Найдём серебряную жилу — копай: штольня под ней.»"
  # Брамбл за столом наёмников, пока задание идёт: всегда на месте и идёт даром.
  brambl:
    story: "Гном за дальним столом поднимает глаза — и замирает, увидев фонарь у вас на поясе. «Откуда?.. Это фонарь нашего старшины. „Двенадцать фонарей“ — моя дружина, я был седьмым. Нас нанял Гуннар Отвес со Стройки: камень и руда для города. Пошли в старую штольню предков под Серебряной жилой — и свод сел. Выбрался я один, неделю копал наверх. Думал, все…» Он переворачивает крышку и читает нацарапанное. «Семеро живы. И масло свежее — значит, кто-то там ещё жжёт фонари. Найди серебряную жилу и копай: штольня под ней. Я пойду с тобой.»"
    storyKin: "Гном за дальним столом поднимает глаза — и замирает, увидев фонарь у вас на поясе. «Свой, да с нашим фонарём… Это фонарь старшины. „Двенадцать фонарей“ — моя дружина, я был седьмым. Нас нанял Гуннар Отвес со Стройки: камень и руда для города. Пошли в старую штольню предков под Серебряной жилой — и свод сел. Выбрался я один, неделю копал наверх. Думал, все…» Он переворачивает крышку и читает нацарапанное. «Семеро живы. Своих под землёй не бросают — ты это знаешь не хуже меня. Найди серебряную жилу и копай: штольня под ней. Я пойду с тобой.»"
    again: "Брамбл уже ждёт, кирка на коленях. «Ну? Жила, штольня, семеро. Идём.»"
    free: "«Денег не надо. За своих не берут.»"
    # Цена после задания: вывел дружину — бутылка всегда, бросил — вдвое.
    priceFriend: "«Тебе — за одну бутылку шнапса из красавки, и так будет всегда: за дружину я в долгу. За это я с тобой на двенадцать часов.»"
    priceGrudge: "«Шнапс из красавки, бутылок: {n}. Вдвое — за штольню. За это я с тобой на двенадцать часов, и не проси скидки.»"
    takeLabel:
      label: "Взять с собой (даром)"
      color: "positive"
    joined: "{name} встаёт из-за стола и закидывает кирку на плечо: «Пошли.»"
  # Штольня под серебряной жилой: провал, зал у завала, развилка, развязки.
  mine:
    fall: "Кирка уходит в пустоту, и жила проседает вместе с ней. Под ней — старая гномья штольня: крепь, ржавые рельсы, меловые стрелки на стенах, и все указывают вниз. Вы спускаетесь по стрелкам."
    again: "Вы снова спускаетесь под жилу — по тем же меловым стрелкам, к нижнему горизонту."
    hall: "Нижний горизонт. Зал предков, вода по колено. У дальней стены — свежий завал, перед ним костёр и с десяток гоблинов: спят вповалку на гномьих мешках, обняв гномьи кирки. Из-за завала доносится тихий стук: три удара, пауза, ещё три.\n\nВы пробираетесь к завалу. Из щели между камнями хрипит чей-то голос: «Кто там?.. Мы — „Двенадцать фонарей“. Семеро нас. Гоблины ждут, пока мы сами помрём. Груз наш у тебя под ногами — мы просунули ящик в щель, пока были силы. Разбери завал и выведи нас. А нет — бери ящик и иди. Мы поймём.»"
    hallKin: "Нижний горизонт. Зал предков, вода по колено. У дальней стены — свежий завал, перед ним костёр и с десяток гоблинов: спят вповалку на гномьих мешках, обняв гномьи кирки. Из-за завала доносится тихий стук: три удара, пауза, ещё три — гномий счёт, вы узнаёте его с детства.\n\nВы отстукиваете в ответ. Из щели между камнями хрипит чей-то голос: «Свой! Предки услышали… Мы — „Двенадцать фонарей“. Семеро нас. Гоблины ждут, пока мы сами помрём. Груз наш у тебя под ногами — мы просунули ящик в щель, пока были силы. Разбери завал, брат, выведи нас. А нет — бери ящик и иди. Мы поймём. Наверное.»"
    bramblAtRubble: "Брамбл прижимается к щели: «Старшина! Это я, Брамбл, седьмой фонарь!» — «Брамбл?! Живой… Ну, раз ты привёл — значит, выйдем.»"
    digLabel:
      label: "⛏ Разобрать завал"
      color: "positive"
    crateLabel:
      label: "📦 Забрать ящик"
      color: "negative"
    leaveLabel: "↩ Уйти"
    empty: "В штольне тихо и пусто: здесь больше никто не ждёт."
    thanks: "Последний гоблин падает в воду. Из-за завала выходят семеро — исхудавшие, в изодранной коже, с горящими фонарями. Наверх вы поднимаетесь вместе.\n\nУ выхода из штольни старшина снимает с пояса последний фонарь, прикручивает его к шлему и протягивает вам: «Двенадцатый фонарь. Теперь твой.» А потом старшина наклоняется ближе и понижает голос: «Гоблины выгребли всё, что лежало на виду. Но самое ценное мы припрятали — думали, уже не пригодится никому. За то, что вытащил нас, — бери.» И достаёт из-за пазухи свёрток: в нём четыре куска. Гуннару на Стройку уже побежали сказать, что поминальный колокол можно не заказывать."
    thanksKin: "Последний гоблин падает в воду. Из-за завала выходят семеро — исхудавшие, в изодранной коже, с горящими фонарями. Наверх вы поднимаетесь вместе.\n\nУ выхода из штольни старшина снимает с пояса последний фонарь, прикручивает его к шлему и протягивает вам: «Двенадцатый фонарь. Свой вывел своих — предки это видели.» А потом старшина наклоняется ближе и понижает голос: «Гоблины выгребли всё, что лежало на виду. Но самое ценное мы припрятали — думали, уже не пригодится никому. За то, что вытащил своих, — бери, брат.» И достаёт из-за пазухи свёрток: в нём четыре куска. Гуннару на Стройку уже побежали сказать, что поминальный колокол можно не заказывать."
    bramblThanks: "Брамбл стоит рядом со старшиной и долго молчит. Потом говорит: «Семеро. Из двенадцати — семеро. Я теперь не один вышел.»"
    giftsLabel:
      label: "Принять дары"
      color: "positive"
    giftsHeader: "Дары дружины «Двенадцать фонарей»:"
    # Бой позади, дары не приняты: герой ушёл или вернулся через жилу.
    giftsWaiting: "Семеро из «Двенадцати фонарей» ждут вас у выхода из штольни: без вас они не уходят — дары ещё не отданы."
    crateTaken: "Вы взваливаете ящик на плечо. Из-за завала больше не стучат. Гоблины спят — вы уходите той же дорогой, по меловым стрелкам, наверх."
    bramblLeaves: "📜 Брамбл снимает кирку с пояса: «Я неделю копал наверх, чтобы жить, а не чтобы смотреть, как ты им могилу закрываешь.» — и исчезает во вспышке свитка."
  # Бой у завала: гоблины проснулись от грохота камней.
  escort:
    start: "Камни грохочут, и гоблины вскакивают, хватаясь за гномьи кирки. Позади всех, на гномьих мешках, поднимается их вожак — Хруст Собиратель: «Моё! Всё моё — и гномы тоже!»\n\nИз-за завала, едва вы растащили камни, выходят трое, кто ещё держит кирку, — старшина Ульфрик, Ингрид Крепь и Торвальд Кайло — и встают рядом с вами."
    death: "Вы очнулись наверху, у серебряной жилы: гоблины не добили — бросили в воду, и течение вынесло вас в старый штрек. До Кинэта вы добрели сами. Дружина всё ещё за завалом: в штольню можно спуститься через любую серебряную жилу."
  # Прораб Гуннар Отвес на Стройке: ему несут ящик, если дружину бросили. Что он
  # говорит по ходу задания — LostSquadQuest.foremanLine.
  foreman:
    waiting: "Гуннар то и дело поглядывает на пустые носилки у ворот. «„Двенадцать фонарей“ — моя лучшая дружина. Я сам отправил их за рудой в старую штольню предков под Серебряной жилой. Говорят, свод там сел… Каждое утро говорю себе: заказывать поминальный колокол рано.»"
    crateSeen: "Гуннар замечает ящик у вас на плече и медленно откладывает чертежи. На крышке выжжено: «Двенадцать фонарей»."
    grateful: "«Семеро вернулись живыми — а я ведь уже приценивался к поминальному колоколу. Ребята отлёживаются, но к весне снова будут таскать камень. Спасибо тебе. Здесь тебе всегда рады.»"
    cold: "Гуннар не поднимает глаз от чертежей. «Работа есть. Разговоров нет.» Над воротами стройки висит новый колокол — тот самый, поминальный."
    crateLabel:
      label: "📦 Отдать ящик Гуннару"
      color: "positive"
    crate: "Прораб Гуннар Отвес поднимает крышку ящика и долго молчит. «Это наша руда. „Двенадцать фонарей“… А они?» Вы молчите. Он кивает, будто знал. «Материала тут всего на {silver} серебра — держи. И вот, отдельно: кусок вечно огненного железа, он сверху лежал.» Вечером над Стройкой звонит поминальный колокол."
    ironHeader: "Отдельно — от Гуннара:"

# «Бродячий ларец»: редкая встреча в лабиринте (с 5-го уровня, полпроцента на
# осмотр, см. RareQuests). Чужой голодный ларец увязывается за героем; его кормят
# камнями с карточки в сумке, каждые два — воспоминание прежнего хозяина. Сытый
# ведёт к хозяину — Ансельму Вейлу, поднятому мертвецу; развязка — у Фета. См.
# StrayCasketQuest и StrayCasketState.
strayCasket:
  questDone: "📜 Квест «Бродячий ларец» завершён."
  meet: "Между стенами изгороди что-то звякает и мелькает. К вам подлетает Ларец Азата — чужой, весь в царапинах, гравировка на крышке затёрта. Он кружит рядом и щёлкает зубами, чуя камни у вас при себе, но в руки не даётся.\n\nГолодный и без хозяина: такие летают вокруг того, кто их кормит, а этот кружит вокруг пустого места."
  offerLabel:
    label: "Протянуть камень"
    color: "positive"
  shooLabel:
    label: "Уйти"
    color: "negative"
  offerFed: "Вы протягиваете «{gem}». Ларец выхватывает камень прямо из пальцев, довольно клацает крышкой — и пристраивается у вас за плечом. Теперь он не отстанет."
  offerEmpty: "Камня при вас не нашлось. Ларец обиженно щёлкает зубами вхолостую, но не улетает: пристраивается у вас за плечом и ждёт, когда его покормят."
  feedHint: "Он ещё голоден — скормите ему камней: {left}. Кормят его с карточки в сумке."
  shooed: "Вы отмахиваетесь. Ларец обиженно клацает крышкой и скрывается за поворотом изгороди."
  # Карточка ларца в сумке: что с ним сейчас.
  card:
    hungry: "Скормлено камней: {fed}/{goal}. Чем покормим?"
    noGems: "Камней при вас нет — ни в сумке, ни в ларце. Ларец подождёт."
    leads: "Ларец сыт и рвётся вглубь изгороди: он помнит дорогу. Отпустите его, когда будете в лабиринте, — он приведёт к хозяину."
    onlyInLabyrinth: "Ларец рвётся в изгородь: отпустить его можно только в лабиринте."
    toFet: "Хозяин ларца упокоен. Ларцы Азата в Кинэте собирает Фет — отнесите ларец ему, в Торговый дом."
  feed:
    # Кнопки кормления — по качеству камня, по порядку качеств; {n} — сколько
    # таких камней при вас.
    grades:
      - "Надколотый ({n})"
      - "Повреждённый ({n})"
      - "Целый ({n})"
      - "Безупречный ({n})"
      - "Идеальный ({n})"
    eaten: "Ларец выхватывает «{gem}» и довольно щёлкает зубами. Скормлено: {fed}/{goal}."
  # Каждые два камня — воспоминание прежнего хозяина, по порядку.
  memories:
    - "Камень в крышке вспыхивает, и на миг вы видите чужими глазами: костёр у изгороди и двое искателей. Тот, что с руками в масле, протягивает ларец второму: «Держи, Ансельм. Не потеряй». Второй смеётся: «Его? Он сам кого хочешь потеряет»."
    - "Снова вспышка. Тот же костёр, но у огня один Ансельм. Он пересчитывает камни и говорит ларцу, будто тот может ответить: «Торговать он решил. Чудеса, говорит, продавать выгоднее, чем добывать. Ну и пусть. Нам с тобой и вдвоём неплохо»."
    - "Вспышка: изгородь, тёмная, как сажа, — так далеко к тьме ларец ещё не залетал. Ансельм идёт впереди и не оборачивается: «Ещё один поворот — и назад. Обещаю»."
    - "Вспышка — и крик. Из-за поворота выходит что-то большое и быстрое. Ансельм падает. Ларец мечется над ним, но помочь нечем: он умеет только глотать камни."
    - "Последняя вспышка. Ансельм встаёт — медленно, неправильно. Ларец радостно кидается к нему, а тот не оборачивается: мёртвым камни ни к чему. Ларец кружил над ним, пока не оголодал совсем."
  sated: "Ларец сыт. Он вырывается из рук и тянет вас вглубь изгороди: он помнит дорогу. Отпустите его с карточки, когда будете в лабиринте, — он приведёт к хозяину."
  goLabel:
    label: "Идти за ларцом"
    color: "positive"
  # Сытый ларец привёл к хозяину: бой или назад в лабиринт.
  owner: "Ларец срывается с плеча и уводит вас за собой — поворот, ещё поворот. У корней изгороди стоит мертвец в истлевшей гильдейской куртке и смотрит в никуда. Ларец радостно кидается к нему, кружит у самого лица. Мертвец не оборачивается. Потом медленно поднимает меч — на вас.\n\nЭто Ансельм. Мёртвым камни ни к чему, а ларец этого так и не понял."
  fightLabel:
    label: "⚔ Достать оружие"
    color: "negative"
  leaveLabel:
    label: "Уйти"
    color: "negative"
  toDungeonLabel: "В лабиринт"
  fightStart: "Ансельм идёт на вас молча — так же, как ходил при жизни: не оглядываясь."
  rest: "Ансельм оседает в траву у корней изгороди и больше не поднимается. Ларец долго кружит над ним, потом садится ему на грудь — и снова взлетает, уже к вам.\n\nГравировку на крышке теперь можно прочесть: «Ансельму — от Ф.». Ларцы Азата в Кинэте собирает Фет — может, он знает, чей это был ларец."
  gone: "Здесь тихо: изгородь шелестит, и больше никого."
  death: "Вы приходите в себя у изгороди. Бродячий ларец кружит над вами и тихо клацает крышкой: Ансельм всё ещё бродит где-то рядом. Когда будете готовы, отпустите ларец с карточки — он снова поведёт к нему."
  # Развязка у Фета: ларец он оставляет себе, герою — новый или ступень к своему.
  fet:
    showLabel:
      label: "Показать бродячий ларец"
      color: "positive"
    outro: |
      Фет замирает, едва ларец выглядывает у вас из-за плеча. Он берёт его в ладони — осторожно, как берут птицу, — и долго смотрит на гравировку.

      «Первый, что я собрал. Отдал его Ансельму в тот вечер, когда решил, что торговать чудесами выгоднее, чем добывать их. Он смеялся: мол, без меня и ларец не прокормишь. А он вот прокормил. До последнего.»

      Фет ставит ларец на верхнюю полку, подальше от покупателей.

      «Этот я оставлю себе — на память о друге. А тебе — взамен.»
    newCasket: "Фет выкладывает на прилавок новый {title}: ступень {tier}/{maxTier}, мест внутри: {capacity}."
    casketGrown: "Фет колдует над вашим ларцом добрую минуту. {title}: ступень {tier}/{maxTier}, мест внутри: {capacity}."
    gems: "«И камни свои забери: он ел их у тебя, а не у Ансельма.» Фет вытряхивает их из бродячего ларца и пересыпает в ваш: {gems}."
    gemsToBag: "Что не влезло в ларец, Фет ссыпает вам в сумку: {gems}."

# «Тот, кто уговаривает деревья»: редкая встреча в лабиринте (с 5-го уровня,
# полпроцента на осмотр, см. RareQuests). Эльф Элиар поёт изгороди, прося у неё
# ветвь; герой стоит на страже — три волны орков-лесорубов, каждая своим боем.
# Ветвь — Фету, герою — шкаф. Ключи с хвостом Kin — реплики Элиара для
# героя-эльфа (см. HedgeSongQuest.key). См. HedgeSongState.
hedgeSong:
  questDone: "📜 Квест «Тот, кто уговаривает деревья» завершён."
  meet: "Из-за поворота доносится тихая песня на чужом языке, и стены изгороди покачиваются ей в такт. У живой стены стоит эльф, прижав ладони к ветвям: глаза закрыты, губы едва шевелятся. Не открывая глаз, он говорит:\n\n«Не подходи ближе — спугнёшь. Я Элиар. Прошу у изгороди ветвь: деревья не рубят, их уговаривают. Третий день пою, и она почти согласна. Только песню слышит не она одна: сюда идут орки-лесорубы — им изгородь нужна на дрова, и уговаривать они не станут. Постой за моей спиной, пока я не допою.»"
  meetKin: "Из-за поворота доносится тихая песня — на языке, который вы понимаете с полуслова, — и стены изгороди покачиваются ей в такт. У живой стены стоит эльф, прижав ладони к ветвям. Не открывая глаз, он улыбается:\n\n«Свой. Я по шагам понял. Я Элиар. Прошу у изгороди ветвь — ты знаешь, как это делается: деревья не рубят, их уговаривают. Третий день пою, и она почти согласна. Только песню слышит не она одна: сюда идут орки-лесорубы, и уговаривать они не станут. Постой за моей спиной, родич, пока я не допою.»"
  guardLabel:
    label: "🛡 Встать на стражу"
    color: "positive"
  notNowLabel:
    label: "Не сейчас"
    color: "negative"
  notNow: "Элиар не открывает глаз: «Как знаешь. Изгородь велика — может, ещё свидимся.» Песня за спиной стихает за поворотом."
  # Волны: каждая — свой бой; между ними — что идёт следом.
  wave1: "Из-за поворота выходят орки-лесорубы: топоры на плечах, пилы за поясами. Первый сплёвывает: «Вот кто нам изгородь путает!» Элиар не прерывает песни — только становится рядом с вами, так и не открыв глаз. Первая волна: четверо."
  between1: "Последний из первой волны падает в траву. Песня звучит дальше, стены изгороди качаются ей в такт. А из-за поворота уже слышен топот: идёт вторая волна, и ведут её командиры отряда."
  wave2: "Вторая волна выбегает из-за поворота — четверо, и командиры гонят остальных вперёд."
  between2: "Вторая волна разбита. Элиар поёт громче, и изгородь вокруг шелестит, будто отвечает. Из-за поворота выходит тот, кого он ждал: огромный орк с топором на длинной рукояти, а с ним трое командиров.\n\n«Бокк Последний у Костра, — шепчет Элиар между строк. — Его костёр горит третью зиму, и всё — ветвями изгороди.»"
  wave3: "Бокк поднимает топор: «Допоёшь, когда я дров нарублю.» Последняя волна: вожак и трое командиров."
  nextLabel:
    label: "⚔ К бою"
    color: "negative"
  characterLabel: "Персонаж"
  leaveLabel:
    label: "Уйти"
    color: "negative"
  left: "Вы отступаете за поворот. Песня за спиной обрывается на полуслове."
  # Третья волна отбита: изгородь отдаёт ветвь.
  thanks: "Последний орк падает, и песня Элиара кончается — не оборвавшись, а закончившись. Изгородь вздыхает всей стеной, и из неё, прямо в руки эльфу, выходит ветвь — живая, тёплая, с листьями.\n\nЭлиар впервые открывает глаза и протягивает её вам: «Отнеси её Фету в Торговый дом. Я много лет ношу ему дерево — он поймёт. Скажи, что от Элиара.» Он кланяется изгороди — не вам — и уходит туда, откуда пришёл."
  thanksKin: "Последний орк падает, и песня Элиара кончается — не оборвавшись, а закончившись. Изгородь вздыхает всей стеной, и из неё, прямо в руки эльфу, выходит ветвь — живая, тёплая, с листьями.\n\nЭлиар впервые открывает глаза и протягивает её вам: «Свой отстоял — своему и ветвь. Отнеси её Фету в Торговый дом: я много лет ношу ему дерево, он поймёт. Скажи, что от Элиара.» Он кланяется изгороди — и вам, как родичу, — и уходит туда, откуда пришёл."
  branchHint: "Ветвь живой изгороди — у вас в сумке. Отнесите её Фету в Торговый дом."
  toDungeonLabel: "В лабиринт"
  gone: "Здесь тихо: изгородь шелестит, и песни больше не слышно."
  death: "Вы приходите в себя у изгороди. Песни больше не слышно, и Элиара нигде нет — то ли ушёл, то ли изгородь спрятала его. Может, ещё встретитесь."
  # Фаэлин Тихострел — младший брат Элиара (см. HedgeSongQuest.faelin). Он при
  # герое — свои слова абзацем под текстом сцены: meet, notNow, between1,
  # between2, thanks; на «Уйти» между волнами остаётся с братом — stays вместо
  # left. В таверне: ветвь в сумке — branch (его там не было) или branchAgain
  # (был); задание позади — price или priceThere, цена прежняя.
  faelin:
    meet: "Фаэлин замирает на полушаге и опускает лук. «Это Элиар, — говорит он едва слышно. — Мой старший брат. Так поёт только он.» Элиар не открывает глаз, только чуть улыбается: «Фаэлин. Ты всегда ступал громче, чем стрелял. Хорошо, что ты с луком: песня у меня есть, а стрел нет.»"
    notNow: "Фаэлин уходит последним и у поворота долго оглядывается: «Он допоёт и без нас. Он всегда допевал.»"
    between1: "Фаэлин выдёргивает из ствола изгороди стрелу, ушедшую мимо, и на миг прижимает ладонь к коре — будто просит прощения. «Брат не собьётся, — говорит он, не оборачиваясь. — Сбивался всегда я.»"
    between2: "Фаэлин накладывает на тетиву стрелу с самым тёмным наконечником. «Третью зиму в роду спорят, какой песней погасить его костёр, — тихо говорит он. — Песней его не погасишь.»"
    thanks: "Уже у поворота Элиар оборачивается — к брату: «Петь ты так и не выучился. Зато сегодня я допел, ни разу не оглянувшись.» Фаэлин ничего не отвечает. Он смотрит брату вслед, пока изгородь не смыкается за его спиной, и только тогда опускает лук."
    stays: "Вы отступаете за поворот — и только там замечаете, что Фаэлина рядом нет. Он остался у изгороди, за спиной брата, и уже накладывает на тетиву новую стрелу. «Иди, — доносится из-за поворота. — Я его одного не оставлю.» Песня за спиной не обрывается."
    branch: "У окна сидит эльф и правит оперение стрелы. Вдруг он откладывает её и смотрит не на вас, а на вашу сумку — будто оттуда его окликнули. «Покажи.»\nОн долго держит ветвь на открытой ладони, не сжимая пальцев. «Её не срубили — её отдали. Так просить изгородь умеет один эльф — Элиар, мой старший брат. Значит, он жив и допел.» Ветвь он возвращает бережно, обеими руками. «Неси её туда, куда он просил. Я в роду тот, кто так и не выучился петь: мне такие ветви в руки не дают.»"
    branchAgain: "Фаэлин кивает на вашу сумку: «Ветвь всё ещё у тебя? Брат просил отнести её Фету. Я бы отнёс и сам — да изгородь отдала её не мне.»"
    price: "«Фет рассказал, кто принёс ему ветвь от Элиара. Я это запомнил. А цена та же — «Ядовитая смазка», флаконов: {n}, и {cost} дублонов: за брата в нашем роду не торгуются, ни в одну сторону. За это я с тобой на двенадцать часов.»"
    priceThere: "«У изгороди мы стояли за спиной Элиара вдвоём — я это запомнил. А цена та же — «Ядовитая смазка», флаконов: {n}, и {cost} дублонов: за брата в нашем роду не торгуются, ни в одну сторону. За это я с тобой на двенадцать часов.»"
  # Развязка у Фета: ветвь — ему, герою — новый шкаф или ступень к своему.
  fet:
    showLabel:
      label: "Показать ветвь"
      color: "positive"
    outro: |
      Фет берёт ветвь бережно, обеими руками, и листья на ней шевелятся, будто дышат.

      «Элиар жив? Я уж думал, изгородь его не отпустит… Это не срубленное — это отданное. Из срубленного шкаф собирают, а из такого он растёт сам.»
    newWardrobe: "Фет берёт с прилавка пустой брелок на серебряной цепочке, и ветвь сама обвивает его, как плющ — забор. Новый {title} — ваш: ступень {tier}/{maxTier}, мест внутри: {capacity}."
    wardrobeGrown: "Фет подносит ветвь к вашему брелоку — она обвивает цепочку, как плющ — забор, и врастает в него. {title}: ступень {tier}/{maxTier}, мест внутри: {capacity}."

