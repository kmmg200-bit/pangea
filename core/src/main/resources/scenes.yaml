temple:
  enter:
    text: "Вы вошли в Храм Азата. Внутри царит лишь мягкое свечение алтаря, а к высокому потолку парят магические кубы…"
    choices:
      Priest: "Жрец"
      Hall: "Зал Азата"
      LeaveTemple: "Уйти"
  priest:
    text: "Приветствую тебя в храме Азата. О чём вы хотели поговорить?"
    choices:
      WhoIsAzat: "Кто такой Азат?"
      AskBlessing: "Могу ли я получить благословение?"
      BackToTemple: "Назад"
  whoIsAzat: "Азат — бог ремёсел, кузнечного мастерства и алхимии. Он — Повелитель всех кузнецов, меняющий мир своими изобретениями. Вечно в поисках новых идей, он принимает множество форм и имён, каждый раз раздвигая границы возможного. Его страсть к созданию — как вдохновение, так и опасность, ведь некоторые его идеи могут перевернуть мир с ног на голову."
  back: "Назад"
  necroLoreLabel: "Что ты знаешь о некромантах?"
  necroLore: |
    Жрец долго молчит, прежде чем ответить.
    — Азат учит творить: брать то, что есть, и делать из него то, чего не было. Некроманты берут то же ремесло и выворачивают его наизнанку. Им мало сотворить новое — они заставляют служить то, что уже отжило своё.
    Начинается всегда одинаково: с жажды не умирать. Человек — или эльф, или орк, тьме всё равно — ищет, как пережить свой срок, и находит. Только платит за это собой. К концу пути в нём не остаётся ничего живого: он сам становится мертвецом, который просто ещё не лёг.
    Один некромант не ходит никогда. Вокруг него всегда стоят те, кого он поднял, — и прячется он за их спинами. Павших он поднимает снова, целыми, а когда своих не хватает — творит новых, крепче прежних. Поэтому не трать силы на свиту, пока он стоит на ногах: кого ты убьёшь, того он поднимет. Ищи его самого.
    Вокруг него стелются миазмы — тьма, от которой мёртвые крепнут, а живые гниют заживо. Яд и кровь мёртвых не берут: в них нечему отравиться и нечему истечь. Зато огонь берёт их охотно — сухие кости горят жарко.
    И вот что ещё. Возьми у меня святую воду. Где окропишь ею, тьма теряет силу: миазмы и святость гасят друг друга. А там, где тьмы нет, святая вода жжёт мёртвых — всех, кто стоит на поле, и своих, и чужих. Помни об этом, если сам водишься с мёртвыми.
    После него останутся кости. Мастера и скупщики дают за них хорошую цену.
  holyWater:
    label: "Святая вода"
    offer: "Святая вода из купели храма — {price} серебра за склянку. Где окропишь ею, там тьма теряет силу.\n\nУ вас: 🪙 {silver}."
    buy: "Купить за {price} 🪙"
    bought: "Жрец наполняет склянку из купели и протягивает вам. — Да хранит тебя Азат."
    noSilver: "На святую воду нужно {price} серебра."
    refused: "Жрец смотрит на ваши доспехи и отступает на шаг. — Тьма уже пустила в тебе корни. Святой воды я тебе не дам."
  blessing:
    offer: "Пожертвование в {cost} дублонов позволит Храму обеспечивать себя дальше, а так же поощрять местное ремесло, за это с позволения своего бога я благословлю тебя на неделю.\n\nВы получите следующие бонусы на неделю:\n+10% к опыту и репутации\n+10% к серебру с монстров\n+10% к редкости добычи\n5% шанс доп. добычи после боя\nОтдых после смерти вдвое короче\n250 мгновенных отдыхов"
    active: "Благословение уже действует ещё {remaining}."
    donate: "Пожертвовать {cost} дублонов"
    granted: "Жрец возносит молитву — тёплый свет окутывает вас. Благословение Азата с вами на неделю!"
    notEnough: "У вас нет {cost} дублонов для пожертвования."

