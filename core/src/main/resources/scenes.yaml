    collectorName: "Коллектор"
    fightStart: "Мужчина выхватывает клинок."
    debtPaid: "Ну, теперь долг Кельвина уплачен, Мариса может спать спокойно."
    collectorDown: "Ну, теперь он никому не повредит."
    collectorDownWithMarisa: "Ну, теперь он никому не повредит. Однако Мариса недовольна и просит вас передать ей сумму долга, чтобы она могла заплатить Ришелье и продолжить спокойно жить."
