mercenaries:
  title: "За дальним столом сидят те, кто за плату пойдёт с вами в лабиринт — на двенадцать часов."
  empty: "За дальним столом сегодня пусто."
  # Под заголовком — кто в отлучке (по свитку или отдыхает после найма), по строке.
  away: "🕓 {name} вернётся через {left}."
  back:
    label: "↩ Назад"
    color: "negative"
  toList: "К наёмникам"
  hireLabel:
    label: "Нанять"
    color: "positive"
  # Личное задание наёмника (см. MercQuests): разговор до найма.
  talkLabel: "💬 Поговорить"
  squadFull: "Ни в строю, ни в резерве нет свободного места. Кого-то придётся выгнать."
  hired: "{name} встаёт из-за стола и кивает: в отряде прибыло."
  notEnoughDoubloons: "Не хватает дублонов: нужно {cost}, у вас {have}."
  notEnoughBrews: "Не хватает: нужно {n} — «{brew}», у вас {have}."
  # Поднять отдыхающего раньше срока: серебро сверх обычной платы, каждый раз дороже.
  rushButton: "🕓 Убедить: {name}"
  rushIntro: "Дальний стол. Тот, за кем вы пришли, ещё не отдохнул, — но, услышав про серебро, поднимает голову."
  rushLabel: "🪙 Убедить за {silver}"
  rushed: "{name} встаёт из-за стола, так и не отдохнув, — и идёт с вами."
  notEnoughSilver: "Не хватает серебра: нужно {cost}, у вас вместе с ячейкой {have}."
  returned: "{name} снова в таверне.\n{line}"
  human:
    rush: "«Только сел, а ты опять за мной. Ладно. {silver} серебра сверху — и как обычно, {cost} дублонов. Отсыпаться буду потом.»"
    story: "У дальнего стола, спиной к стене, сидит человек в кольчуге с чужим гербом. Обломок меча лежит перед ним, как ложка перед миской. Он поднимает глаза и говорит:\n«Йорген Кремень. Имя не моё — так меня записали в гильдии, когда я не смог назваться. Кто я и откуда, не помню: вышел из портала в этой кольчуге, с этим обломком, и всё. Зато тело помнит строй — куда ставить щит, когда бить, как держать ряд, пока остальные отходят. Значит, где-то там я это делал, и делал долго.\nИскатели брали меня прикрывать спину, и я прикрывал. Из логова огненного элементаля вернулся один — зато с клинком, который с тех пор не остывает: мои удары жгут. Дороги домой я не ищу, там меня наверняка уже похоронили. Со мной у тебя будет стена за плечом.»"
    price: "«{cost} дублонов — и я твой на двенадцать часов. Цена одна, кем бы ты ни был: дешёвые телохранители умирают первыми, а я не собираюсь.»"
    returned: "«Отработал найм сполна. Чуть не помер — свиток вынес. Раны зашил, могу снова.»"
  murloc:
    rush: "«Плюх устал. Плюх сохнет… Но за {silver} серебра и Живую воду, флаконов: {n}, — Плюх встанет. Плюх всегда встаёт.»"
    story: "Из-под стола выглядывает мурлок с грозовым багром, обмотанным тряпкой. Под ним растекается лужа — он подливает в неё из бурдюка всякий раз, когда думает, что никто не смотрит. Он булькает:\n«Плюх. Плюх — береговик. Это которого племя шлёт смотреть чужие тропы: береговик без воды терпит дольше всех и по суше бегает быстрее всех. Плюх посмотрел тропы, и Плюху понравилось. В тростник обратно не хочет — там все молчат и всю жизнь ловят одну и ту же рыбу.\nПлюх тут кружки мыл, долг отрабатывал, Трактирщик помнит. Теперь Плюх свободен. Плюх быстрый: враг бьёт — Плюха там уже нет. Плюх бьёт — багор трещит молнией, и броня у врага сыплется. Багор Плюх одолжил у Сноходцев, они не заметили. Сеть у Плюха своя.\nМать Глубин учит просто: за сильным иди, слабого ешь. Плюх смотрел, как ты дерёшься. Ты — первое. Бери Плюха!»"
    price: "«Кожа сохнет — кожа трескается, а треснувший Плюх не воин. Живой воды Плюху надо много, флаконов: {n}. И Плюх твой на двенадцать часов.»"
    returned: "«Плюх чуть-чуть не умер! Свиток — пшик — и Плюх в луже. Раны зажили, жабры мокрые. Нанимай!»"
  gnome:
    rush: "«Отдых — дело святое. Но {silver} серебра и шнапс из красавки, бутылок: {n}, — святее. Поднимай, пока не передумал.»"
    story: "Гном в доспехе, побитом камнями, негромко поёт себе под нос. Заметив вас, он песню не прерывает — только кивает на лавку рядом, а допев, говорит:\n«Брамбл Медноус. Род мой ковал замки, которые чужим ключом не открыть, а я пошёл в проходку, за камнем, как дед. Из штольни под Серебряной жилой нас вышел один — я. Неделю копал наверх в темноте, и с тех пор тишины не терплю: в бою пою, кому не нравится, пусть заткнёт уши.\nДоспех оттуда же, с нижнего горизонта: держит и камень, и клинок. Секира промёрзла в глубине так, что до сих пор дышит стужей — кого ударю, того сковывает. А на жиле рядом со мной не стой: сам всё выкопаю, и быстрее.»"
    price: "«Плата — шнапс из красавки, бутылок: {n}. За это я с тобой на двенадцать часов. Меньше не пью, больше не прошу.»"
    returned: "«Едва ноги унёс, дружище. Свиток сработал, а раны ещё ноют. Но петь могу — значит, и драться могу.»"
  elf:
    rush: "«Я только сел. Но {silver} серебра сверху — и как обычно: «Ядовитая смазка», флаконов: {n}, и {cost} дублонов — и колчан снова на плече.»"
    story: "У окна, где светлее, сидит эльф и, не поднимая головы, правит оперение стрелы. Колчан у его ног пахнет красавкой. Он откладывает стрелу и говорит:\n«Фаэлин Тихострел. Тихострел — потому что никто так и не успевает услышать мой выстрел до удара. Я вырос у изгороди за городом: мой род поёт живой стене, чтобы она не смыкалась на тропах. Петь я так и не выучился — зато стрелял лучше всех в роду.\nДоспех у меня лёгкий: в первых рядах я не стою. Лучше всего я стреляю из-за твоей спины, а в ближнем бою мне труднее. Наконечники я мажу сам: через раз у врага в крови остаётся яд. А на цветочной поляне держись меня: я знаю, где смотреть, — соберём больше.»"
    price: "«Мне нужна «Ядовитая смазка», флаконов: {n}, — на наконечники, и {cost} дублонов — мне. За это я с тобой на двенадцать часов.»"
    returned: "«Свиток вынес меня вовремя: стрелы кончились раньше врагов. Колчан снова полон. Нанимай.»"

# «Жетоны из пепла» — личное задание Йоргена Кремня (см. JorgenQuest,
# MercQuests): разговор за столом наёмников, логово огненных в лабиринте — их
# там двое, — жетоны павших Мастеру Горну. Выполнено — Йорген растёт дальше.
jorgen:
  questDone: "📜 Квест «Жетоны из пепла» завершён."
  talk:
    text: |
      Йорген долго молчит, вертя в руках обломок меча. Потом кладёт его на стол, клинком к себе.

      «Знаешь, почему я беру дублоны, а не серебро? Не себе беру.

      Когда я вышел из портала, меня подобрал отряд Хальварда Лиса. Четверо искателей — и я, пятый, который ничего не помнил. Три года назад гильдия отправила нас в логово огненного элементаля. Мы шли на одного. Их было двое: второй стоял в огне за первым, и мы увидели его, когда было уже поздно.

      Вынес я одного себя — и вот этот обломок: в том огне он раскалился и с тех пор не остывает. А жетоны четверых остались там, в пепле. Без жетона гильдия пишет искателя пропавшим, а семье пропавшего доля не положена. Вот они её и получают — моими дублонами.

      Пойдёшь со мной? Один я туда уже ходил.»
    acceptLabel:
      label: "Помочь"
      color: "positive"
    declineLabel:
      label: "Не сейчас"
      color: "negative"
    accepted: "Йорген кивает и на обороте гильдейского бланка выводит четыре имени. «Логово — не ближе седьмого поворота. Я пойду с тобой, даже если не наймёшь: долг мой, а не твой.»"
  # Карточка у стола, пока задание идёт, и цена, когда долг закрыт.
  card:
    toLair: "Йорген точит обломок о край стола и не поднимает глаз. «Список у тебя — значит, логово ждёт. Их там двое. Не забывай.»"
    toHorn: "Йорген смотрит на вашу сумку — туда, где лежат жетоны. «Неси их Горну. Сам я не пойду: смотреть, как он вписывает их имена, — это без меня.»"
    price: "«Меч у меня теперь целый: Горн своё дело знает. {cost} дублонов — и я твой на двенадцать часов. Цена та же, только дублоны теперь мои.»"
    goLabel:
      label: "🔥 Идти к логову"
      color: "positive"
    lairHint: "Логово огненных — в лабиринте, не ближе {level}-го поворота. Идти к нему можно с этой карточки."
    onlyInLabyrinth: "К логову огненных идут из лабиринта."
    tooShallow: "Логова элементалей начинаются с {level}-го поворота лабиринта — спуститесь глубже."
  # Логово: вход, бой с обоими огненными, жетоны в пепле.
  lair:
    intro: |
      Чем дальше, тем жарче: листья на изгороди скручиваются, под ногами хрустит пепел. Йорген останавливается у почерневшего прохода.

      «Здесь. И запомни: их двое. Один на виду, второй — в огне за ним.»

      Он отстёгивает свой раскалённый обломок и достаёт из-за спины другой меч — в синеватом инее, от клинка тянет холодом.

      «Огонь я всегда любил. Но огонь огнём не бьют — сегодня беру холод.»
    fightLabel:
      label: "⚔ В бой"
      color: "negative"
    characterLabel: "Персонаж"
    leaveLabel:
      label: "Уйти"
      color: "negative"
    fight: "Из огня поднимаются двое, и логово вспыхивает целиком. Йорген встаёт рядом, меч холода шипит паром. «Держи строй!»"
    victory: |
      Второй огненный оседает грудой тлеющих углей, и в логове впервые за три года становится тихо. Йорген опускается на колено и голыми руками разгребает остывающий пепел. Жетоны находятся один за другим — четыре, закопчённые, ещё тёплые.

      Он читает имена вслух, каждое, и отдаёт жетоны вам. «Неси Горну. Пусть впишет. Я подожду в таверне.»
    tokensHint: "Жетоны отряда — у вас в сумке. Отнесите их Мастеру Горну в гильдию."
    toDungeonLabel: "В лабиринт"
    left: "Вы отступаете от прохода. Йорген оглядывается на пепел и молча идёт следом: «Значит, не сегодня.»"
    gone: "Здесь тихо: остывший пепел и почерневшие стены. Огня больше нет."
    death: "Вы приходите в себя у изгороди, в саже с головы до ног. Логово огненных так и не отдало своих — список отряда при вас, к логову можно вернуться."
  # Горн: жетоны в учёт, задание закрыто.
  horn:
    label: "Показать жетоны"
    text: |
      Горн раскладывает жетоны на наковальне и трёт каждый рукавом, пока не проступят имена.

      «Лис. Две Стрелы. Бочка. Колючка… Три года в пропавших.» Он открывает учётную книгу, вычёркивает четыре строки и напротив каждой пишет одно слово — «пал». «Доля семьям — с завтрашнего дня. Гильдия платит по жетону, а не по совести.»

      Помолчав, он добавляет: «И Кремню передай: пусть несёт сюда свой обломок. Сколько можно бить врага половиной меча — перекую.»
    grown: "⚔ {name} теперь растёт вместе с вами до {lvl}-го уровня."

# «Замок для предков» — личное задание Брамбла Медноуса (см. BramblQuest,
# MercQuests): разговор за столом наёмников, отец-замочник на Стройке куёт
# замок, Зал предков под серебряной жилой — каменных стражей там двое.
bramblLock:
  questDone: "📜 Квест «Замок для предков» завершён."
  talk:
    text: |
      Брамбл обрывает песню на полуслове и долго смотрит на свой доспех.

      «Доспех этот не мой. Когда свод сел и я неделю копал наверх, в Зале предков камень валился на голову каждый день. Я снял латы с каменного предка — с гробницы Медноусов. Иначе бы не выбрался.

      У нас так: что взял у предков — верни работой рода. Мой род — замочники, а я пошёл в проходку, как дед, и ремеслу не выучился. Отец со мной с тех пор не говорит.

      Слепок со скобы гробницы я тогда снял — на всякий случай. Отнеси его отцу, Оттару Медноусу, на Стройку: пусть скуёт замок. А на гробницу повесим вдвоём.»
    acceptLabel:
      label: "Помочь"
      color: "positive"
    declineLabel:
      label: "Не сейчас"
      color: "negative"
    accepted: "Брамбл достаёт из-под доспеха тряпицу с воском и кладёт перед вами. «Мастерская у отца — за складами Стройки. Обо мне не рассказывай: сам поймёт, чья рука.»"
  # Карточка у стола, пока задание идёт.
  card:
    toFather: "Брамбл не поднимает глаз от кружки. «Слепок у тебя? Отец за складами Стройки. Что он обо мне скажет — можешь не пересказывать.»"
    toHall: "Брамбл узнаёт замок с одного взгляда. «Отцовская работа. Теперь — вниз, к предкам: под любой серебряной жилой та же штольня. Вешать будем вдвоём.»"
  # Мастерская Оттара Медноуса за складами Стройки: цена замка — BramblQuest.LockPrice.
  forge:
    label: "🔐 Мастерская Медноусов"
    text: |
      За складами Стройки, под навесом, стучит молоток. Седой гном в кожаном фартуке берёт у вас слепок, подносит к свету — и узнаёт руку.

      «Брамбл. Значит, жив.» Он долго молчит. «Гробница Медноусов, третий ряд от входа. Я сам на неё когда-то смотрел.

      Замок для предков из чего попало не куют. Кусок вечно огненного железа — на тело и магический камень — на сувальды. Принесёшь — скую.»
    giveLabel: "Отдать железо и камень"
    done: |
      Оттар работает до вечера — молча, не поднимая головы. Потом кладёт перед вами тяжёлый замок без ключа: на боку — медный ус, клеймо рода.

      «Слепок оставлю себе. А ему передай: замок вешает тот, кто снял латы. Сам.»
  # Зал предков: двое каменных стражей у гробницы — герой и Брамбл видят их разом.
  hall:
    intro: |
      Кирка уходит в пустоту, и жила проседает вместе с ней. Вниз — по меловым стрелкам, на нижний горизонт. Зал предков встречает тишиной: вдоль стен — каменные гробницы рода, ряд за рядом. В третьем ряду одна стоит открытой: на каменном предке нет лат, на скобе нет замка.

      Вы замечаете их одновременно с Брамблом: у открытой гробницы шевелится камень — поднимается страж, тяжёлый, как сам свод. А из стены за ним выходит второй.

      «Двое, — выдыхает Брамбл. — Когда я брал латы, они спали. Видно, предки ждали, кто придёт возвращать долг.» Он перехватывает секиру. «Ну, раз пришли — вернём.»
    fightLabel:
      label: "⚔ В бой"
      color: "negative"
    characterLabel: "Персонаж"
    leaveLabel:
      label: "Уйти"
      color: "negative"
    toDungeonLabel: "В лабиринт"
    fight: "Стражи идут на вас разом, и пол Зала предков гудит под их шагами. Брамбл запевает — громко, назло тишине. «За Медноусов!»"
    victory: |
      Второй страж рассыпается грудой щебня, и в зале снова тихо — только Брамбл ещё допевает.

      Он подходит к гробнице, снимает перед предком шлем и вешает замок на скобу. Дужка сходится с сухим щелчком — один раз и навсегда.

      «Вот теперь латы мои», — говорит Брамбл. Он долго стоит у камня, а потом добавляет, не оборачиваясь: «Отцу скажи… нет. Сам скажу.»
    grown: "⚔ {name} теперь растёт вместе с вами до {lvl}-го уровня."
    left: "Вы отступаете к штольне. Брамбл пятится последним, не сводя глаз со стражей: «Подождут. Камень терпеливый.»"
    gone: "В Зале предков тихо: на гробнице Медноусов висит замок, стражи спят в стенах."
    death: "Вы приходите в себя наверху, у серебряной жилы, в каменной пыли с головы до ног. Замок при вас — в Зал предков можно спуститься через любую серебряную жилу."

# «Чужой багор» — личное задание Плюха (см. PlukhQuest, MercQuests): разговор
# за столом наёмников, печать Сноходцев — к Густаво, он переворачивает зов,
# ловчие выходят на героя в лабиринте; кончились ловчие — багор Плюха по праву.
plukhGaff:
  questDone: "📜 Квест «Чужой багор» завершён."
  talk:
    text: |
      Плюх выкладывает на стол грозовой багор и тычет перепончатым пальцем в древко: там, где синел знак, теперь свежий срез.

      «Багор трещит тише. Каждый день — тише. Это Сноходцы зовут его домой. Плюх срезал их печать, а она всё равно зовёт.

      Плюх скажет честно: Плюх не одалживал. Сноходцы этим багром ловили мурлоков — бьют молнией в воду, и мурлок всплывает, как рыба. Плюх-береговик видел. Плюх пошёл за ловчими по тропе, ночью залез к ним и унёс багор. Ловить стало нечем.

      Если багор замолчит, Плюх будет просто мурлок с палкой. Помоги Плюху. Отнеси печать тому, кто знает Сноходцев. Плюх таких не знает — Плюх от них бегает.»
    acceptLabel:
      label: "Помочь"
      color: "positive"
    declineLabel:
      label: "Не сейчас"
      color: "negative"
    accepted: "Плюх кладёт перед вами стружку с синим знаком — осторожно, будто она кусается. «Говорят, алхимик с площади, Густаво, со Сноходцами в ссоре. Плюх к алхимикам не ходит. Ты сходи.»"
  # Карточка печати в сумке (что делать на шаге) и Плюх у стола, пока задание идёт.
  card:
    toGustavo: "Показать печать Густаво на Торговой площади: Сноходцы когда-то забрали у него лабораторию — он знает их знаки."
    toHunt: "Густаво перевернул зов: печать зовёт не багор домой, а ловчих к вам. Позвать их можно с этой карточки — из лабиринта."
    huntLabel:
      label: "⚡ Позвать ловчих"
      color: "positive"
    onlyInLabyrinth: "Ловчих зовут из лабиринта: в город Сноходцы на зов не выйдут."
    tavernGustavo: "Плюх косится на вашу сумку. «Печать у тебя? Неси алхимику. Плюх подождёт здесь, в луже. Плюх не любит колбы.»"
    tavernHunt: "Плюх подпрыгивает на лавке. «Алхимик помог? Плюх не верит алхимикам… Но Плюх пойдёт. Позовёшь ловчих — Плюх будет рядом, даже без найма. Это Плюхов багор.»"
  # Густаво узнаёт знак и переворачивает зов печати.
  gustavo:
    label: "Показать печать Сноходцев"
    text: |
      Густаво берёт стружку двумя пальцами, будто дохлую мышь, и подносит к свету.

      «Глаз в снежинке. Ловчий знак Сноходцев.» Он долго молчит. «Знаешь, почему они забрали у меня лабораторию? Я варил для них, пока не узнал, на ком они пробуют мои составы. На мурлоках — в клетках у реки. Такого опыта я им не простил: одной ночью выпустил всех из плена и ушёл вместе с ними. Так что твоему Плюху я, можно сказать, свой.

      Печать не сломать — её можно перевернуть. Пусть зовёт не багор домой, а ловчих к тебе. Придут — встреть. Кончатся ловчие — кончится и зов.»

      Он капает на стружку из тёмной склянки, и знак из синего становится багровым.
  # Ловчие на зов перевёрнутой печати: каджиты, глава — именной, у всех кинжалы
  # молнии (MonsterSkill.LightningDagger).
  hunt:
    intro: |
      Вы поднимаете печать — и знак на ней вспыхивает багровым. Где-то за изгородью отзывается свист, потом второй. Из-за поворота неслышно выходят ловчие Сноходцев — каджиты в серых плащах, с сетями на плечах. На поясе у каждого — связка узких кинжалов, и по клинкам бегают синие искры. Впереди — глава, седой, с рваным ухом.

      Плюх прижимается к вашей ноге и тут же отлипает, перехватив багор. «Это они. Ловчие. Ко'Ширр — это он бил молнией в воду.» Он скалит мелкие зубы. «Плюх рад. Плюх давно хотел их всех.» И тише, только вам: «Только это не вся гильдия. Сноходцы куда сильнее своих ловчих. Этих Плюх побьёт. Гильдию — нет.»

      «Вещь Сноходцев, — мурлычет Ко'Ширр. — Отдай — и уйдёшь.»
    fightLabel:
      label: "⚔ В бой"
      color: "negative"
    characterLabel: "Персонаж"
    leaveLabel:
      label: "Уйти"
      color: "negative"
    toDungeonLabel: "В лабиринт"
    fight: "Ловчие разворачивают сети, и первый кинжал свистит мимо уха. Багор Плюха трещит в ответ — тихо, но зло. «Плюх не отдаст!»"
    victory: |
      Ко'Ширр падает последним, и печать в вашей руке тускнеет: знак Сноходцев больше не светится и никуда не тянет. Звать багор домой больше некому — и багор Плюха трещит так, что у вас встают дыбом волосы.

      Плюх ходит между павшими и собирает метательные кинжалы — бережно, за рукояти, чтобы не задеть искру. «Злые кинжалы. Попал — и сил как не бывало. Плюх их сбережёт: для тех, кто придёт за багром снова.»

      Он гладит древко. «Теперь не одолженный. Свой.»
    grown: "⚔ {name} теперь растёт вместе с вами до {lvl}-го уровня."
    left: "Вы прячете печать и отступаете. Свист за изгородью стихает — ловчие подождут, пока их позовут снова. Плюх булькает вам вслед: «Плюх не боится. Плюх просто… тоже уходит.»"
    gone: "Здесь тихо. Печать погасла, и звать больше некого."
    death: "Вы приходите в себя у изгороди, в обрывках чужой сети. Печать при вас — позвать ловчих можно снова."

# «Отданный лук» — личное задание Фаэлина Тихострела (см. FaelinQuest,
# MercQuests): разговор за столом наёмников, срубленный лук — вернуть изгороди,
# к старым корням; бой у корней; изгородь отдаёт Фаэлину новый лук взамен.
faelinBow:
  questDone: "📜 Квест «Отданный лук» завершён."
  talk:
    text: |
      Фаэлин кладёт на стол свой лук — и только теперь видно, что по плечу дуги бежит тонкая трещина.

      «Ты видел, как Элиар просит изгородь, — или ещё увидишь. Ему она отдаёт ветви. Мне не отдала ни одной: петь я так и не выучился. Мне было тридцать, и я хотел лук. Я срезал ветвь сам.

      В роду о таком вслух не говорят. Меня никто не прогонял — я ушёл раньше, чем при мне начали молчать.

      Срубленное долго не служит: лук трескается, и я знаю почему. Срубленное возвращают туда, где резали, — к старым корням. Одному мне туда нельзя: изгородь помнит, кто её резал. Пойдёшь со мной?»
    acceptLabel:
      label: "Помочь"
      color: "positive"
    declineLabel:
      label: "Не сейчас"
      color: "negative"
    accepted: "Фаэлин протягивает вам лук обеими руками — так в роду передают отданное. «Неси ты. Корни — в лабиринте, у живой стены, я покажу. Я пойду рядом, даже если не наймёшь: это мой долг.»"
  # Карточка лука в сумке и Фаэлин у стола, пока задание идёт.
  card:
    tavern: "Фаэлин правит оперение стрел; рядом с ним — чужой, гильдейский лук. «Мой у тебя. Как будешь готов — к корням. Я пойду.»"
    goLabel:
      label: "🌿 Вернуть лук изгороди"
      color: "positive"
    hint: "Вернуть его можно с этой карточки — из лабиринта: старые корни у живой стены."
    onlyInLabyrinth: "К старым корням изгороди идут из лабиринта."
  # Старые корни: лесорубы гильдии Чернолом по гильдейскому приказу валят
  # изгородь — бой разом с пятнадцатью гоблинами; потом изгородь забирает
  # срубленный лук и отдаёт Фаэлину новый — готовый, отданный.
  roots:
    intro: |
      Фаэлин ведёт уверенно, не глядя на повороты. У старых корней визжат пилы: гоблины-лесорубы валят живую стену, и щепа летит во все стороны. Их полтора десятка — с топорами и пилами, на куртках чёрная нашивка: расколотый пень.

      Навстречу выходит десятник с бумагой под сургучной печатью. «Гильдия Чернолом, — скрипит он. — Приказ гильдейский, всё по закону: эта часть лабиринта наша, а значит, и изгородь. Добываем. Идите, куда шли.»

      Фаэлин молча накладывает на тетиву стрелу — уже не своим, чужим луком. «Здесь я однажды резал, — говорит он тихо. — Больше здесь резать не будет никто.»
    fightLabel:
      label: "⚔ В бой"
      color: "negative"
    characterLabel: "Персонаж"
    leaveLabel:
      label: "Уйти"
      color: "negative"
    toDungeonLabel: "В лабиринт"
    fight: "Лесорубы Чернолома хватаются за топоры, пилы взвизгивают. Первая стрела Фаэлина выбивает приказ прямо из лап десятника."
    victory: |
      Последний лесоруб Чернолома падает в щепу рядом со своим приказом, и пилы наконец замолкают. Тогда вы кладёте срубленный лук у корней. Изгородь медленно, будто нехотя, втягивает его в себя — дуга уходит в кору, как в воду.

      А потом из стены над Фаэлином выходит лук — живой, тёплый, с тугой тетивой и парой листьев на плечах дуги — и сам ложится ему в руки. Не ветвь, из которой ещё резать, а готовый лук. Отданный.

      Фаэлин натягивает тетиву и отпускает — она звенит, как струна. И Фаэлин смеётся: коротко, будто сам себе не верит. «Она слушает не только песню. — Он гладит дугу. — С таким луком не стыдно и перед Элиаром.»
    grown: "⚔ {name} теперь растёт вместе с вами до {lvl}-го уровня."
    left: "Вы отступаете от корней. За спиной снова визжат пилы. Фаэлин уходит последним и оглядывается на изрубленную стену: «Ещё вернёмся.»"
    gone: "У старых корней тихо. Над ними — молодые ветви, и среди них нет ни одной срезанной."
    death: "Вы приходите в себя у изгороди, в саже и дыму. Срубленный лук при вас — к старым корням можно вернуться."

# «Деревня» (событие лабиринта, 1%, с 20-го уровня): деревня одной из
# смертных рас — разграбить или помочь старосте (см. Villages). Лабиринт
# волшебный: из него выходят по всей Пангее, поэтому деревня — где угодно, и
# о Кинэте её жители могут не знать. Подстановки: {name} — название деревни,
# {race} — чья она («орков»), {city} — соседний город, {leader} — главарь
# разбойников, {silver} — серебро платы старосты, {pay} — вся плата словами
# («500 серебра и 1 дублон»).
village:
  # Плата словами ({pay}): серебро, а с 7-го уровня задания — и дублоны
  # (VillageRates.doubloons). {word} — нужная форма из doubloonWords.
  payLine:
    silver: "{silver} серебра"
    both: "{silver} серебра и {doubloons} {word}"
    # Одни дублоны — столько даёт маг Сноходцев за артефакт.
    doubloons: "{doubloons} {word}"
  doubloonWords: ["дублон", "дублона", "дублонов"]
  # Названия деревень по расам, местность вокруг (по расе) и соседние города.
  # Деревня помнит номер строки — новые дописывать в конец списка, чтобы у
  # встреченных деревень ничего не поменялось.
  names:
    Человек: ["Ольховый Брод", "Кривая Мельница", "Три Овина"]
    Эльф: ["Певчая Роща", "Ясеневый Круг", "Тихий Лист"]
    Мурлок: ["Илистая Заводь", "Мокрые Мостки", "Ракушечник"]
    Орк: ["Чёрный Частокол", "Дымный Лог", "Кострище"]
    Гоблин: ["Ржавый Котёл", "Три Заплаты", "Кривой Карман"]
    Демон: ["Пепельный Круг", "Серный Ключ", "Тлеющие Камни"]
    Гном: ["Медный Порог", "Звонкая Наковальня", "Семь Горнов"]
    Каджит: ["Шафрановые Шатры", "Привал Двух Лун", "Тёплый Песок"]
  cities: ["Ардель", "Велистор", "Каэлис", "Кессар", "Морвен", "Тирмаль", "Ольбрин", "Зарана"]
  lands:
    Человек:
      - "Изгородь обрывается на опушке, и вы выходите под открытое небо. Холмы, поля ржи по пояс, в низине — река с бродом. Вдоль реки тянется наезженная дорога."
      - "Ветви изгороди расходятся, и в лицо бьёт солёный ветер. Серые дюны, редкие сосны, рыбачьи лодки на песке, а по-над берегом бежит дорога."
    Эльф:
      - "Изгородь не кончается, а переходит в лес — те же ветви, только выше: вековые буки, мох, звенящие ручьи. Сквозь лес идёт тропа, широкая, как дорога, — по ней и ездят."
      - "Изгородь выпускает вас в долину, затянутую туманом: внизу озеро, по берегам — ивы и белые камни. Вдоль озера вьётся дорога."
    Мурлок:
      - "Изгородь уходит корнями в болото, и дальше приходится идти по кочкам: камыш выше головы, чёрная вода, туман. По краю топи насыпана гать — здешняя дорога."
      - "Ветви расступаются над широкой рекой: пологий илистый берег, плавни, крик птиц. Вдоль берега тянется дорога, по реке идут лодки."
    Орк:
      - "Изгородь выводит вас к горам: ветер, камень, редкие сосны на склонах. Внизу лежит долина, и по её дну вьётся перевальная дорога."
      - "Изгородь обрывается у края степи: трава до горизонта, и ветер гонит по ней волны. Через степь тянется тракт, разбитый копытами."
    Гоблин:
      - "Изгородь выпускает вас среди развалин: старые стены, колонны в плюще, мостовая, из которой растут берёзы. Через развалины идёт дорога — кто-то ею пользуется."
      - "Изгородь переходит в болотистый лес: кривые ольхи, лужи, гнилые пни. Сквозь лес по гати тянется дорога."
    Демон:
      - "Изгородь выводит к выжженному плато: серый камень, трещины, из которых сочится пар, а над всем этим — тёмная гора с дымком на вершине. По плато вьётся дорога, мощённая чёрным камнем."
      - "Ветви расступаются над ущельем, где бьют горячие ключи: камни в рыжих потёках, пар, запах серы. По краю ущелья идёт дорога."
    Гном:
      - "Изгородь выводит к холмам — каменистым, с рудными осыпями и тропками к штольням. Между холмами вьётся дорога, наезженная гружёными телегами."
      - "Изгородь обрывается у подножия гор: скалы, водопад, каменный мост над ущельем — гномьей кладки. За мостом идёт дорога."
    Каджит:
      - "Изгородь выпускает вас на край пустыни: барханы и жара, от которой дрожит воздух. Вдоль цепочки колодцев тянется караванная дорога."
      - "Изгородь выводит в саванну: жёлтая трава, редкие зонтичные деревья, вдали пасётся стадо антилоп. Через саванну идёт торговый тракт."
  # Святыня деревни по расе — её крадут в беде «Украденный артефакт»: имя, оно
  # же в винительном падеже («вынесли Жемчужину Прилива») и что это за вещь —
  # словами старосты.
  artifacts:
    Человек:
      name: "Серебряный серп"
      acc: "Серебряный серп"
      about: "Серп как серп, только серебряный и тупой: им не жнут, им срезают первый колос — с тех пор, как здесь распахали первое поле."
    Эльф:
      name: "Семя Первого Ясеня"
      acc: "Семя Первого Ясеня"
      about: "Тёмное семя в оправе из живой коры. Говорят, с него выросла вся наша роща; проверять никто не брался."
    Мурлок:
      name: "Жемчужина Прилива"
      acc: "Жемчужину Прилива"
      about: "Серая жемчужина величиной с кулак. Пока она лежит в нише, вода в заводи не уходит даже в засуху — так считают старики, а со стариками у нас не спорят."
    Орк:
      name: "Клык Праматери"
      acc: "Клык Праматери"
      about: "Жёлтый клык длиной в ладонь, на ремне из сыромятной кожи. Его носила та, что привела род на эти земли; с тех пор его надевает каждый новый вождь."
    Гоблин:
      name: "Первый грош"
      acc: "Первый грош"
      about: "Медная монета под стеклом — первая, которую деревня заработала честно. Цена ей грош, но другой такой нет, и вся округа об этом знает."
    Демон:
      name: "Свеча Неугасимая"
      acc: "Свечу Неугасимую"
      about: "Чёрная свеча, которая горит с основания деревни и ни разу не гасла. При её огне заключают договоры: лгать при ней у нас не решается никто."
    Гном:
      name: "Молот основателя"
      acc: "Молот основателя"
      about: "Старый молот, рукоять отполирована ладонями до блеска. Им ударили по первой наковальне в этих горах; с тех пор с него начинают каждый новый горн."
    Каджит:
      name: "Лунное зеркало"
      acc: "Лунное зеркало"
      about: "Круглое серебряное зеркало, в котором, говорят, видны обе луны сразу. По нему у нас считают дни, свадьбы и долги."
  # Деревня у входа: местность (lands), какая деревня — по расе, что у неё
  # стряслось — по беде (trouble).
  arrive:
    Человек: |
      У дороги стоит деревня «{name}»: два десятка изб под дерновыми крышами, огороды, колодец с журавлём. Там, где деревня упирается в изгородь, люди подрезали её по межам и вплели в неё жерди — вышел забор, и изгородь, похоже, не против.

      Пахнет дымом, навозом и хлебом. Живут здесь люди — у колодца, правда, орк-батрак тянет ведро, а на завалинке дремлет старый гном, но остальные лица человечьи.
    Эльф: |
      Деревня «{name}» начинается незаметно: ветви сходятся в своды, своды — в залы, и вы понимаете, что уже идёте по улице. Дома здесь не строили — их вырастили: стены из живого орешника, крыши из листьев, которые не опадают. Вокруг ни одного пня — эльфы не рубят, они уговаривают.

      Живут здесь эльфы. Разве что пара людей-травников снимает угол у корней: эльфы терпят их за то, что те умеют молчать.
    Мурлок: |
      За тростником открывается деревня «{name}»: хижины на сваях, мостки из старых вёсел, сети на просушке и запах рыбы, от которого слезятся глаза.

      Мурлоки здесь повсюду — в воде, на крышах, под мостками. Из чужих вы замечаете одного человека-лодочника, и он, кажется, давно перестал чему-либо удивляться.
    Орк: |
      Сначала доносится дым, потом — стук: где-то мнут и режут кожу. Деревня «{name}» стоит у дороги за частоколом из заострённых кольев; с той стороны, где к ней подходит изгородь, между кольями давно проросли её ветви, и частокол от этого только крепче. Длинные дома под шкурами, сушильные рамы, у каждой двери — топор.

      Орки работают молча и много: поднимают на вас глаза — и опускают обратно, к делу. Воду таскает пара гоблинов: видно, нанялись за похлёбку.
    Гоблин: |
      Деревню слышно раньше, чем видно: звон, ругань и чей-то торжествующий визг. Деревня «{name}» слеплена из всего, что лабиринт когда-либо терял: двери от разных домов, крыша из щитов, флюгер из сковородки.

      Гоблины снуют между хижинами с мешками, ящиками и чужими сапогами, за вами следят сразу из десятка щелей. Затесавшийся среди них человек-скупщик торопливо прячет что-то за спину.
    Демон: |
      Воздух теплеет, и сквозь пар проступает багровый свет: деревня «{name}» стоит вокруг горячего ключа, от которого тянет серой. Дома из тёмного камня, по свече в каждом окне, на дверях — таблички с печатями.

      Демоны живут здесь чинно и тихо, как писари в канцелярии. Бес на крыльце пересчитывает свитки, а у ключа греется человек, который, судя по лицу, когда-то что-то подписал.
    Гном: |
      Тянет жаром и окалиной. Деревня «{name}» — это не дома, а двери: круглые, окованные медью, прямо в склоне. Над каждой дверью — труба, из каждой трубы — дым, и где-то под землёй мерно бьёт молот.

      Гномы ходят с закатанными рукавами и в саже по локоть. У ворот пара каджитов торгуется за подковы — и гномы не уступают им ни медяка.
    Каджит: |
      Пахнет корицей, жареным мясом и чем-то сладким. Деревня «{name}» когда-то была стоянкой каравана, который так и не ушёл: шатры стали домами, повозки — заборами, а колокольчики с упряжи висят теперь над каждым входом.

      Каджиты сидят в тени на коврах, от скуки торгуются друг с другом и провожают вас ленивыми жёлтыми глазами. Есть тут и чужие — эльф-ювелир, пара людей, — но цену и здесь называют каджиты.
  # Беда деревни — то, что видно у входа.
  trouble:
    bandits: |
      Живёт деревня крепко, только торговли в ней почти нет. Площадь у въезда пустует, коновязь пустая, на обочине лежит перевёрнутая телега без колёс. Дозорные с копьями и луками смотрят не на вас, а на дорогу.

      Староста выходит навстречу не спеша и оглядывает вас с головы до ног — так выходят к наёмнику, а не к гостю.
    spiders: |
      Живёт деревня крепко, только живёт настороже. Ставни закрыты даже днём, скотину загнали во дворы, по краю деревни вбиты жерди с плошками — в них теплится огонь. На жердях и на кустах вокруг висят клочья серой паутины, толстой, как верёвка.

      Староста выходит навстречу не спеша и оглядывает вас с головы до ног — так выходят к наёмнику, а не к гостю.
    caravan: |
      Живёт деревня крепко, только у ворот тесно: там стоят гружёные повозки, лошади в упряжи, а обоз не трогается. Возчики сидят на облучках и смотрят не на вас, а на дорогу.

      Староста выходит навстречу не спеша и оглядывает вас с головы до ног — так выходят к наёмнику, а не к гостю.
    artifact: |
      Живёт деревня крепко, только на площади неладно. Посреди неё стоит каменный столб с нишей, и ниша пуста; рядом топчутся двое с копьями — стерегут то, чего уже нет. У ворот стража обыскивает каждого, кто входит и выходит, даже своих.

      Староста выходит навстречу не спеша и оглядывает вас с головы до ног — так выходят к наёмнику, а не к гостю.
  headmanLabel:
    label: "🏠 К старосте"
    color: "positive"
  raidLabel:
    label: "🔥 Разграбить"
    color: "negative"
  characterLabel: "Персонаж"
  leaveLabel:
    label: "Уйти"
    color: "negative"
  toDungeonLabel: "В лабиринт"
  left: "Вы уходите обратно в изгородь, и деревня «{name}» остаётся за спиной. Дозорные провожают вас взглядом до самых ветвей."
  razed: "От деревни остались пепел и тишина. Изгородь уже тянет к пепелищу первые побеги."
  farewell: "Староста деревни «{name}» кивает вам на прощание — так кивают тому, с кем рассчитались, — и возвращается к делам."
  questDone: "📜 Контракт деревни выполнен."
  # Налёт: подтверждение, бой с жителями и сторожевой башней, развязка.
  raid:
    confirm: "Деревня не крепость, но и не беззащитна: защищать её будут все, кто может держать оружие, — два десятка жителей, а то и больше, и сторожевая башня со стрелком у входа. Начнёте — уйти уже не дадут, бой придётся довести до конца. Пока ещё можно передумать."
    goLabel:
      label: "⚔ Напасть"
      color: "negative"
    backLabel: "Передумать"
    start: "Вы обнажаете оружие — и деревня «{name}» всё понимает раньше, чем вы делаете шаг. Кто-то кричит, детей тащат в дома, хлопают ставни. Навстречу выходят все, кто может держать хоть вилы, хоть нож, а на сторожевой башне у входа уже скрипит тетива."
    victory: |
      Последний защитник деревни «{name}» падает, и становится очень тихо — так тихо, что слышно, как трещит огонь на крыше башни. В домах кто-то плачет, но к вам больше никто не выходит.

      Серебра у таких деревень не водится: всё ценное, что здесь было, было при её защитниках.
    death: "Вы приходите в себя в колючих ветвях изгороди, далеко от деревни. Жители не стали вас добивать — оттащили подальше и бросили: пусть изгородь решит сама. Изгородь решила отпустить."
  # Староста: кто он — по расе деревни, о чём просит — по беде.
  headman:
    Человек: "Староста — крепкий седой человек в латаной овчине, с руками пахаря и тяжёлым, считающим взглядом. Он не кланяется и не тянет время."
    Эльф: "Староста — эльфийка такая старая, что её годы не прочесть даже по коре: волосы белые, как пух чертополоха, в руке посох из живой ветви, на котором ещё растут листья. Голос у неё тихий — и при этом слышно каждое слово."
    Мурлок: "Староста — грузный мурлок с ожерельем из рыболовных крючков. Жабры у него ходят часто и тяжело, будто он только что вынырнул. На общем он говорит медленно, пережёвывая каждое слово, — но говорит."
    Орк: "Староста — одноглазая орчиха на голову выше любого в деревне, с кожевенным ножом за поясом. На ваше оружие она смотрит так, как смотрят на сапог: хорошо ли сшито."
    Гоблин: "Староста — гоблин в очках с одним стеклом и в жилетке с семью карманами. Прежде чем заговорить, он пересчитывает вас взглядом — оружие, сапоги, кошель — и вздыхает, будто цифра не сошлась."
    Демон: "Староста — рогатый демон с обломанным левым рогом; от его плаща пахнет серой и свечным воском. Говорит он вежливо и гладко, как пишут договоры, — но сесть не предлагает."
    Гном: "Староста — гном с бородой, заплетённой в три косы и заткнутой за пояс, чтобы не мешала у горна. Ладони у него в ожогах. На приветствия он времени не тратит — гномы сразу переходят к делу."
    Каджит: "Староста — пожилая каджитка с седыми кисточками на ушах и золотым кольцом в каждом. Она протягивает вам блюдо с финиками — гостю положено, даже наёмному, — и всё это время смотрит на вас так, будто прикидывает цену."
  plea:
    pay: "Плата — {pay}."
    acceptLabel:
      label: "Взяться"
      color: "positive"
    declineLabel:
      label: "Отказаться"
      color: "negative"
    declined: "Староста пожимает плечами. «Как знаете. Наёмников на дорогах больше, чем разбойников». И отворачивается к своим."
    # Торг (VillageRates.HagglePct): один раз; сторговались — серебро выше на
    # VillageRates.HaggleBonusPct%, {pay} — уже новая плата.
    haggleLabel: "💰 Поторговаться"
    haggled:
      up: "Староста долго молчит, потом нехотя кивает. «Ладно, {pay}. Но больше не просите: за такие деньги у меня полдеревни месяц работает.»"
      no: "«Цена честная, — повторяет староста и не отводит глаз. — Торговаться ступайте на базар.»"
    bandits:
      text: |
        «Скажу сразу: наёмников я не люблю. Сегодня вы за нас, завтра — за того, кто заплатит больше. Но разбойников я не люблю сильнее, так что слушайте.

        Деревню они не трогают: сунулись один раз — и мы встретили их так, что больше не пробуют. Они сидят на дороге. Банда — сброд всех кровей, голов пятнадцать — засела на брошенной заставе у старого тракта и берёт всех, кто идёт мимо: обозы, гуртовщиков, одиноких путников. Последний обоз из города {city} к нам так и не дошёл — возницу нашли у брода, товар не нашли.

        С тех пор к нам не ездят. Соль, железо, ткань — всё через третьи руки и втридорога, а наш товар лежит в амбарах: вывезти его некому. Ещё сезон такой торговли — деревня не умрёт, но обеднеет.

        Верховодит у них {leader}. Это имя знают по всей округе: его выкрикивают, когда останавливают телегу.

        Принесёте мне голову главаря — доплачу {headPay}. За неё в городе {city} давно обещана награда, а своё с наместника я получу сам.

        Гонять их своими людьми я не стану: у меня каждый на счету — работа, хозяйство, стража у входа. Мёртвый работник обходится дороже наёмника. А в городе {city} нашими дорогами не занимаются: у наместника хватает своих забот.

        Плата — {pay}. Цена честная. Не станет логова — серебро ваше.»
      accepted: |
        Староста кивает. Руки не подаёт.

        «Застава у старого тракта, полдня пути отсюда, — дым над ней видно издалека. Серебро будет ждать здесь. Сделаете — получите. Не сделаете — найдём другого.»

        Староста отдаёт вам кусок бересты — контракт деревни: углём выведены её название и плата, ниже наскоро нарисована дорога.
    spiders:
      text: |
        «Буду говорить коротко: вы пришли за работой, а у меня она есть.

        Месяц назад из изгороди вышли сетеплёты. Пауки — ростом с телёнка, а есть и побольше. Засели в глубоком овраге за деревней и оплели его так, что днём там темно, как ночью. Днём они спят. Ночью выходят.

        Сначала пропадала скотина. Потом собаки — на собак они охотятся охотнее. Потом не вернулся домой один из наших: утром мы нашли у тропы его нож в паутине, а самого — нет.

        Мы жжём огни, ставни держим закрытыми, ночная стража ходит по трое. От пауков у входа деревня отобьётся. Но лезть к ним в овраг мы не станем: там паутина и темнота, а яд у них такой, что знахарь из города {city} посмотрел на укус и уехал в тот же день, не взяв платы.

        Гнездо надо выжечь — всё, до последнего кокона. У них есть матка, размером с телегу. Если её не убить, через месяц пауков будет вдвое больше.

        Плата — {pay}. Цена честная. Не станет гнезда — серебро ваше.»
      accepted: |
        Староста кивает. Руки не подаёт.

        «Овраг за деревней — найдёте по паутине: её там больше, чем листьев. Серебро будет ждать здесь. Сделаете — получите. Не сделаете — найдём другого.»

        Староста отдаёт вам кусок бересты — контракт деревни: углём выведены её название и плата, ниже наскоро нарисован овраг.
    caravan:
      text: |
        «Скажу прямо: мне нужен не друг, а лишний меч при обозе.

        Раз в сезон деревня возит свой товар в город {city} — пять повозок: кожи, зерно, мёд, всё, что сделали сами. Четыре перехода по тракту. Раньше хватало двоих караванщиков: дорога длинная, но была спокойная.

        Теперь не так. На тракте шалит сброд всех кровей. Гоблины из гильдии Чернолом рубят изгородь у самой дороги и считают просеку своей — со всем, что по ней едет. А с весны появились серые плащи Сноходцев: останавливают обозы, роются в поклаже и ищут что-то, о чём не говорят. Кто спрашивает — того в сеть.

        Своих людей я в дорогу не отдам: у каждого работа, а стража нужна у входа. Караванщики пойдут — они при обозе. Вы пойдёте с ними.

        Плата — {pay} за весь обоз. Цена честная. Отдаст её не деревня, а тот, кто примет обоз в городе {city}, — так у нас заведено, и платит он за то, что довезли: каждая потерянная повозка — пятой доли долой. Не дойдёт ни одна — не будет и платы.»
      accepted: |
        Староста кивает. Руки не подаёт.

        «Обоз стоит у ворот: скажете караванщикам — и тронетесь. Бросите обоз на полпути — о плате забудьте. А дойдёте — расплатится тот, кто примет товар в городе {city}.»

        Староста отдаёт вам кусок бересты — контракт деревни: углём выведены её название и плата, ниже наскоро нарисован тракт до города {city}.
    artifact:
      text: |
        «Скажу коротко: у нас украли, и я хочу это назад.

        Этой ночью воры вынесли из ниши на площади {artifactAcc}. {artifactAbout}

        Вошли тихо, вышли тихо, дозорному у ворот проломили голову — жить будет, но рассказать ничего не может. Взяли одну эту вещь, хотя рядом было что унести. Значит, шли за ней. Такое берут не себе, а на продажу тому, кто заказал.

        Ушли воры в изгородь. След ещё свежий, но ждать он не будет. Мои люди хорошо знают свои поля, а в изгороди теряются за час. Посылать в город {city} нет смысла: пока там решат, чьё это дело, вещь уже продадут.

        Верните её целой. Что будет с ворами, решайте сами: жалеть их здесь некому.

        Плата — {pay}. Цена честная. Вещь будет в нише — серебро ваше.»
      accepted: |
        Староста кивает. Руки не подаёт.

        «След начинается у ворот: дальше стража их упустила. Поспешите — изгородь следов не бережёт. Серебро будет ждать здесь. Вернёте вещь — получите. Не вернёте — найдём другого.»

        Староста отдаёт вам кусок бересты — контракт деревни: углём выведены её название и плата, ниже наскоро нарисована пропажа — чтобы ни с чем не спутать.
  # Пришёл, а беда ещё не кончилась.
  waiting:
    bandits: "Староста встречает вас у входа и здороваться не спешит. «Обозы так и не ходят. Значит, застава ещё стоит, а за то, что стоит, не платят»."
    spiders: "Староста встречает вас у входа и здороваться не спешит. «Этой ночью опять пропала собака. Значит, гнездо ещё живо, а за то, что живо, не платят»."
    caravan: "Староста встречает вас у входа и здороваться не спешит. «Обоз всё ещё у ворот. В город {city} он сам не поедет, а за то, что стоит, не платят»."
    artifact: "Староста встречает вас у входа и здороваться не спешит. «Ниша на площади всё ещё пустует. Значит, вещь ещё у воров, а за то, чего нет, не платят»."
  # Плата: беда кончилась — староста платит.
  pay:
    bandits: |
      До деревни «{name}» новость доходит раньше вас: по дороге уже скрипит первая телега. Староста выносит кошель и отсчитывает серебро при вас, монету к монете, — и только потом поднимает глаза.

      «{leader} больше не будет кричать на дороге. Обозы пойдут — значит, пойдут и деньги. Работа сделана, плата ваша. Мы в расчёте.»
    spiders: |
      Деревня «{name}» встречает вас запахом гари: дым над оврагом видно и отсюда. Староста выносит кошель и отсчитывает серебро при вас, монету к монете, — и только потом поднимает глаза.

      «Этой ночью собаки лаяли на луну, а не на овраг. Работа сделана, плата ваша. Мы в расчёте.»
    artifact: |
      Староста берёт {artifactAcc} обеими руками и долго разглядывает — нет ли сколов, та ли вещь. Потом сам уносит её на площадь, к нише. Вокруг собирается полдеревни; кто-то из стариков утирает глаза и делает вид, что попала соринка.

      Вернувшись, староста выносит кошель и отсчитывает серебро при вас, монету к монете, — и только потом поднимает глаза. «Цела. Работа сделана, плата ваша. Мы в расчёте.»
    # Принесли голову главаря разбойников — за неё сверху (VillageRates.HeadDoubloons).
    head: "Мешок с головой главаря староста принимает молча, не развязывая, и отсчитывает сверху {headPay}."
    reward: "💰 Получено {pay}.\nПолучено {exp} опыта."
  # Общее у логов бед деревни: кнопки, подсказка после победы, отказ от контракта.
  lair:
    # Под входом в любое логово: бой там сюжетный, «Сбежать» в нём нет.
    noEscape: "⚠ Сбежать из этого боя не получится: начнёте — придётся биться до конца."
    characterLabel: "Персонаж"
    leaveLabel:
      label: "Уйти"
      color: "negative"
    abandonLabel: "Отказаться от контракта"
    returnHint: "Вернуться в деревню за платой можно с карточки «Контракта деревни» — из лабиринта."
    abandon:
      text: "Отказаться от контракта деревни? Бересту вы оставите на развилке, а деревня «{name}» так и будет ждать помощи — только уже не от вас."
      yesLabel:
        label: "Да, отказаться"
        color: "negative"
      noLabel: "Назад"
      done: "Вы оставляете бересту на ветке у развилки: может, её подберёт другой искатель. Что скажет староста, вы уже не услышите."
  # Логово разбойников: вход, бой со всей бандой, развязка.
  bandits:
    intro: |
      Заставу вы находите по дыму, как и говорил староста. Частокол завалился, сторожевая изба осела на один угол, над воротами вместо знака болтаются чьи-то сапоги.

      Во дворе у костра голов пятнадцать, сброд всех кровей: делят тюки с последнего обоза, точат ножи, режутся в кости. На перевёрнутой бочке сидит {leader} и громко рассказывает что-то смешное — остальные смеются, когда положено.
    fightLabel:
      label: "⚔ Напасть"
      color: "negative"
    fight: "Первым вас замечает дозорный — и не успевает крикнуть. Вторым — {leader}. «Гости! — главарь вскакивает с бочки и выхватывает клинок. — Встречайте, раз пришли!»"
    victory: |
      {leader} падает у самого костра и больше не встаёт. На заставе становится тихо, только шипят угли. Среди награбленного — тюки с клеймом города {city}: тот самый обоз, что не дошёл.

      Голову главаря вы заворачиваете в мешковину: староста обещал за неё доплатить. Дорога у деревни «{name}» снова свободна — осталось сказать об этом старосте.
    left: "Вы отступаете в изгородь, пока вас не заметили. Логово никуда не денется — как и контракт деревни."
    gone: "Застава пуста: остывшие кострища, рваные мешки и тишина. Искать здесь больше некого."
    death: "Вы приходите в себя в изгороди, в стороне от заставы. Разбойники не стали добивать — обшарили карманы и бросили. Логово на месте, и контракт деревни всё ещё при вас."
    # Охотники за головами на выходе с заставы (VillageRates.HuntersPct): их
    # четверо и вожак. Отдать голову — без доплаты; драться — сюжетный бой.
    hunters:
      intro: |
        На выходе с заставы вам преграждают дорогу пятеро. Не разбойники: куртки без заплат, у каждого арбалет, у пояса — пустые мешки. Сброд всех кровей, но при деле.

        Вожак кивает на ваш мешок. «{leader}? Мы шли по этому следу три недели. За эту голову в городе {city} обещана награда, и она наша. Отдай мешок — и разойдёмся миром.»
      giveLabel: "Отдать голову"
      fightLabel:
        label: "⚔ Драться"
        color: "negative"
      given: "Вы бросаете мешок вожаку. Тот ловит его одной рукой, заглядывает внутрь и кивает: «Разумно». Охотники уходят по тракту, не оглядываясь. Доплаты за голову не будет — но логово разбито, и за него староста заплатит."
      fight: "«Как знаешь», — вожак взводит арбалет. Охотники расходятся полукругом, не сводя с вас глаз."
      victory: "Последний охотник падает в дорожную пыль. Мешок с головой главаря по-прежнему у вас — староста обещал за неё доплатить."
      death: "Вы приходите в себя у обочины тракта. Мешка с головой нет: охотники забрали своё и ушли. Логово всё равно разбито — за него староста заплатит, только без доплаты."
    # Сдавшиеся после боя (VillageRates.SurvivorsPct): трое разных рас
    # ({survivors} — «человек, эльф и мурлок»). Перерезать — кошели; отпустить —
    # один ({informer}, раса с большой буквы, в начале фразы) показывает тайник.
    survivors:
      intro: "Бой стихает, и из сторожевой избы с поднятыми руками выходят трое — {survivors}. Оружие они бросают в пыль ещё на пороге. «Не губи, — хрипит один. — Мы своё отгуляли.»"
      killLabel:
        label: "Перерезать"
        color: "negative"
      spareLabel:
        label: "Отпустить"
        color: "positive"
      killed: "Вы не тратите на них слов. Через минуту на заставе снова тихо. В кошелях у троих — пригоршня меди и серебра: всё, что осталось от разбойничьей удачи."
      purse: "💰 Получено {silver} серебра."
      spared: "Вы отбираете у них ножи и киваете на изгородь. Двое бегут, не оглядываясь. {informer} задерживается на шаг: «Под старой сосной у ворот, в яме под корнями, — то, что не успели поделить. С последних обозов. Мне оно теперь ни к чему.» И тоже исчезает в ветвях."
    # Вернулись с добычи (тайник), а больше на заставе ничего не ждёт.
    # Пленник на заставе (VillageRates.CaptivePct): {captive} — его раса («гном»),
    # {ally} — имя в отряде (allyName). Взять — в отряд на 48 часов.
    captive:
      intro: "Из погреба сторожевой избы доносится глухой стук. Вы откидываете крышку: внизу, связанный по рукам и ногам, сидит {captive} — возница с последнего обоза. Его держали ради выкупа, да так и не дождались. Развязанный, он долго растирает запястья, потом поднимает глаза: «Возьмите меня с собой. Домой мне идти не с чем, а с этими у меня свой счёт.»"
      takeLabel:
        label: "Иди с нами"
        color: "positive"
      sendLabel: "Ступай домой"
      allyName: "Освобождённый {race}"
      joined: "{ally} подбирает с земли разбойничий нож и встаёт в строй. «Двое суток, — говорит он. — Потом — домой.»"
      joinedReserve: "{ally} подбирает с земли разбойничий нож. В строю места нет — он пойдёт следом, в резерве. «Двое суток, — говорит он. — Потом — домой.»"
      noRoom: "{ally} оглядывает ваш отряд и качает головой: места нет ни в строю, ни в резерве. «Тогда домой. Спасибо, что развязали.» И уходит по тракту."
      sent: "«Ступай домой», — говорите вы. Бывший пленник кивает, подбирает чей-то брошенный плащ и уходит по тракту — сначала шагом, потом почти бегом."
    leftOutpost: "Больше на заставе делать нечего. Дорога у деревни «{name}» свободна — осталось сказать об этом старосте."
  # Гнездо сетеплётов: вход, бой со всем выводком и маткой, развязка.
  spiders:
    intro: |
      Овраг вы находите по паутине, как и говорил староста. Кусты по его краям оплетены серым до самых верхушек, внизу темно, и оттуда тянет сладковатой гнилью. На тропе — кости: собачьи, коровьи и не только.

      На дне, среди коконов, шевелится выводок: с десяток сетеплётов поменьше и несколько взрослых, с лапами толщиной в руку. Над ними, в самой гуще паутины, неподвижно висит матка — и смотрит на вас всеми глазами сразу.
    fightLabel:
      label: "🔥 Выжечь гнездо"
      color: "negative"
    fight: "Вы спускаетесь в овраг с факелом в руке, и паутина вспыхивает с треском. Выводок срывается с места разом: шорох сотен лап заглушает всё остальное. Матка опускается ниже — неторопливо, на одной нити."
    redSpider: "Из самой глубины оврага, раздвигая горящую паутину, выползает ещё один — красный, как свежая рана. Даже матка поджимает лапы."
    # Паучий цвет увёл выводок (VillageRates.LuredRedSpiders — двое красных).
    fightLured: "Вы спускаетесь в овраг с факелом в руке, и паутина вспыхивает с треском. Внизу тихо: выводок ушёл за сладким духом. Навстречу вам выходят только двое красных, как две свежие раны, а над ними на одной нити опускается матка."
    # У входа можно пустить в дело вещь из сумки или с пояса, как на пороге
    # пещеры (см. CaveSupply.nestBoonOf, NestPrep).
    supplyLabel: "🎒 Использовать предмет"
    supply:
      pick: "Что пустить в дело у края оврага? (стр. {page}/{total})"
      empty: "Ни в сумке, ни на поясе ничего нет — спускаться придётся как есть."
      back:
        label: "Назад"
        color: "negative"
      dope: "💨 {name} идёт в ход у края оврага. Дым стекает вниз по паутине и оседает между коконами: пауки там вялые, атака и энергия у них просели на {pct}%."
      poison: "🟢 {name} лопается у края, и споры оседают на паутине. Пауки встретят вас уже отравленными."
      burn: "🔥 {name} летит вниз, и сухая паутина вспыхивает разом. Огонь бежит по нитям до самого дна: пауки выйдут к вам уже горящими — пламя {pct}%."
      lure: "🌸 {name} идёт в ход: вы растираете цветы в ладонях и бросаете на тропу, подальше от оврага. Сладкий дух тянется по ветру, и выводок, одурев, расползается по кустам за запахом. Внизу остаются только матка и двое красных — эти пришли на запах из самой глубины."
      already: "{name} тут уже не поможет: гнездо своё получило."
      wasted: "Вы истратили «{name}». Гнезду до этого нет никакого дела."
      quest: "«{name}» для такого не годится — эта вещь вам ещё пригодится."
      emptyFlask: "«{name}» пуста — плескать нечем."
    victory: |
      Матка падает на дно оврага и сворачивается, поджимая лапы. Огонь бежит по паутине вверх, коконы лопаются один за другим. Среди них вы находите обрывок пояса с медной пряжкой — видно, того, кто не вернулся домой.

      Гнезда больше нет. Осталось сказать об этом старосте.
    left: "Вы отступаете от края оврага, пока выводок спит. Гнездо никуда не денется — как и контракт деревни."
    gone: "Овраг пуст: обгоревшая паутина, пепел и тишина. Здесь больше нечего жечь."
    death: "Вы приходите в себя в стороне от оврага, в липкой паутине с головы до ног. Видно, выводок был сыт и оставил добычу на потом. Гнездо на месте, и контракт деревни всё ещё при вас."
  # Караван деревни: у ворот, переходы по тракту, засады, город.
  caravan:
    intro: |
      Обоз ждёт у ворот деревни «{name}», как и говорил староста: пять гружёных повозок, лошади в упряжи, на облучках — возчики. Двое караванщиков с оружием проверяют упряжь и косятся на вас без особой радости.

      Старший из них сплёвывает в пыль. «До города {city} — четыре перехода. Мы впереди, ты — где понадобишься. Скажешь — тронемся.»
    noEscape: "⚠ Из засады не сбежать: начнётся бой — придётся биться до конца. А бросите караван на полпути — контракт будет сорван."
    wagonsHint: "🐂 В бою повозки встают на первые пять мест вашего строя. Кто стоит на повозке, принимает удары за неё и сбивает с неё огонь; непокрытую бьют и жгут."
    wagonsLeft: "🐂 Повозок в обозе: {n} из {total}."
    goLabel:
      label: "🐎 Выступить"
      color: "positive"
    # По строке на переход, по порядку: где идёт караван и как близок город.
    legs:
      - "Обоз выходит за ворота и сворачивает на тракт. Колёса скрипят, лошади фыркают на изгородь, что тянется вдоль обочины, а возчики переругиваются, кому ехать первым. До города {city} — четыре перехода."
      - "Тракт ныряет в изгородь: живые стены смыкаются над повозками, и колёса идут мягко, как по мху. Здесь тихо — тише, чем хотелось бы. До города {city} — ещё три перехода."
      - "Изгородь расступается. Обоз переходит брод — вода доходит лошадям до брюха, — а на том берегу у дороги стоит столб с выцветшей стрелкой: «{city}». Осталось два перехода."
      - "С холма уже виден город {city}: дым над крышами, стены, телеги у ворот. Последний переход — самый короткий, и возчики, не сговариваясь, подгоняют лошадей."
    onRoad: "Караван в пути: переход {leg} из {legs}. Караванщики идут впереди, вы — рядом с повозками."
    # Переход прошёл без засады — строки по очереди.
    quiet:
      - "Переход проходит спокойно: только пыль, скрип колёс и чьи-то старые следы на обочине."
      - "На тракте пусто. Встречная телега уступает дорогу, и её возница долго смотрит вам вслед."
      - "Тихо. Караванщики даже начинают переговариваться — вполголоса, не убирая рук с оружия."
      - "Обоз проходит переход без задержек — только раз останавливаются напоить лошадей."
    # Засада в конце перехода: кто вышел на караван.
    ambush:
      bandits: "Тракт перегорожен поваленным деревом, и возчики натягивают вожжи. Из кустов выходят люди с оружием — сброд всех кровей. «Обоз оставьте, сами — проваливайте!» Караванщики переглядываются и берутся за топоры. Кто-то из разбойников уже тянется к ближней повозке: товар им нужнее, чем вы."
      chernolom: "Тракт перегорожен свежим завалом: изгородь у дороги вырублена, пни ещё сочатся соком. На завале — гоблины-лесорубы в кожаных фартуках, на рукавах — нашивка с расколотым пнём. Десятник машет бумагой с печатью: «Просека гильдии Чернолом! Всё, что по ней едет, — наше!» У половины в лапах не топоры, а факелы."
      hounds: "Из тени изгороди неслышно выходят каджиты в серых плащах, с сетями на плечах, — ищейки Сноходцев. По узким клинкам у них на поясах бегают синие искры. «Обоз досмотрим, — мурлычет старший. — А кто против — тот в сеть.» На повозки они даже не смотрят — смотрят на людей."
    abandonLabel:
      label: "Бросить караван"
      color: "negative"
    abandon:
      text: "Бросить караван на полпути? Караванщики пойдут дальше без вас, а контракт деревни «{name}» будет сорван — платы не будет."
      yesLabel:
        label: "Да, бросить"
        color: "negative"
      done: "Вы сворачиваете с тракта в изгородь, и скрип колёс ещё долго слышен за спиной. Контракт деревни сорван: бересту вы оставляете на ветке у дороги."
    # Дошли: платит тот, кто принял обоз, — сразу, с его рассказом.
    arrival: |
      Обоз въезжает в город {city} под вечер, когда у ворот уже зажигают факелы. Его ждут: у складов торговых рядов стоит грузная купчиха в меховой безрукавке. Товар деревни «{name}» она берёт каждый сезон — и, видно, всерьёз боялась, что в этот раз его не будет.

      Она обходит повозки, щупает тюки, нюхает мёд и только потом поворачивается к караванщикам. Старшему — кошель, младшему — монету сверху, «за страх». Вашу долю она отсчитывает последней — медленно, монету к монете.

      «Староста писал, что наймёт охрану, — говорит она. — Я думала, опять кого-нибудь из своих, с вилами. А вы довели. Будет следующий обоз — спрошу вас.»
    # Сколько повозок дошло — под рассказом получателя.
    delivered:
      all: "Дошли все пять повозок."
      some: "Из {total} повозок до города дошло {n} — купчиха платит за то, что дошло."
    lost: "Последняя повозка догорает у обочины. Везти больше нечего — и платить не за что. Караванщики молча собирают обгорелую упряжь. Контракт деревни сорван."
    gone: "У ворот пусто: обоза здесь больше нет."
    left: "Вы оставляете обоз у ворот — он подождёт. Контракт деревни всё ещё при вас."
    death: "Вы приходите в себя на обочине. Повозок нет — только колея, рассыпанное зерно и обрывки упряжи. Караван разграблен, контракт деревни сорван."
    # Двое караванщиков в строю героя.
    guards: ["Старший караванщик", "Караванщик"]
  # Украденный артефакт: от ворот по следу воров, переходы, их стан, развязка.
  # Сколько переходов, игроку не говорим (так решил пользователь): что воры
  # близко, видно по тексту. Средние переходы — строки middle по очереди.
  artifact:
    intro: |
      След начинается у ворот деревни «{name}», как и говорил староста: примятая трава, сбитая роса на кустах, а у самой изгороди — сломанная ветка на высоте плеча. Дальше ветви смыкаются, и тропы нет — есть только след.

      Воры шли налегке и не прятались: видно, не думали, что за ними кто-нибудь пойдёт.
    trailHint: "👣 Сколько идти до воров, не скажет никто — смотрите, что видно на следу. Сойдёте со следа — воры уйдут дальше, и погоню придётся начинать заново, от ворот."
    goLabel:
      label: "👣 Идти по следу"
      color: "positive"
    legs:
      first: "Вы ныряете в изгородь вслед за ворами. След петляет, но не теряется: шли они быстро и не думали, что оставляют за собой, — сорванный лист, вмятину от каблука, клок шерсти на шипах."
      middle:
        - "След выводит к ручью и обрывается у воды. Вы идёте вдоль берега, пока на той стороне не находится то, что искали: мокрые следы на камнях. Воры переходили вброд — и торопились."
        - "На прогалине — кострище. Угли холодные, но зола ещё не слежалась: здесь ночевали этой ночью. Вокруг объедки, пустая фляга и обрывок верёвки. Следы ведут дальше, в самую гущу."
        - "Изгородь здесь гуще, и воры прорубались сквозь неё: срезы на ветках ещё сочатся соком. Кто-то из них порезался о шипы — на листьях темнеют капли крови."
      last: "Ветер приносит запах дыма. Следы с каждым шагом свежее, а потом впереди, за ветвями, слышатся голоса и смех. Вы замедляете шаг: стан воров совсем рядом."
    onTrail: "Вы идёте по следу воров. Изгородь смыкается за спиной, впереди — только следы."
    # Вор со свёртком в бою не задерживается: подсказка у стана ({rounds} —
    # VillageRates.ThiefEscapeRounds, слово «раунда» — для 2–4). Ушёл — переход
    # по его следу, потом он сам, загнанный, с двумя подручными. {thief} — имя
    # вора, в начале фразы; не запомнили — thiefNameless.
    thiefHint: "🏃 Вор со свёртком драться не станет: не свалите его за {rounds} раунда — уйдёт в изгородь с артефактом, и погоню придётся продолжить."
    thiefNameless: "Вор"
    # Покупатели. Воров застали при сделке (VillageRates.NecromancerPct) — у
    # костра Некромант, минибосс. После боя маг Сноходцев (MageOfferPct) даёт
    # за артефакт дублоны ({offer} — числом и словом); был Некромант — мага нет.
    campNecromancer: |
      Стан воров — на прогалине в кольце колючих кустов: шалаш из веток, костёр, оседланные кони у коновязи. Только у огня сегодня не до похлёбки: воры стоят полукругом, а перед ними — высокая сутулая фигура в чёрном, с посохом из тёмной кости. От неё тянет сырой землёй, как из разрытой могилы.

      Вор со свёртком протягивает его гостю, а тот не спешит брать: сначала отсчитывает монеты — по одной, длинными серыми пальцами. Некромант. Вы успели к самой сделке.
    fightNecromancer: "Вас замечают слишком поздно: монеты сыплются в траву, свёрток так и не переходит из рук в руки. Некромант медленно поворачивается к вам. «Ещё один покупатель? — голос у него сухой, как шелест страниц. — Нет. Свидетель.» Воры хватаются за оружие."
    mageOffer: |
      Вы уже собираетесь уходить, когда из-за кустов неслышно выходит незнакомец в сером плаще. На застёжке у горла — глаз в снежинке: знак Сноходцев. На мёртвых он не смотрит — только на свёрток у вас в руках.

      «Эти люди работали на меня, — говорит он ровно. — Работали плохо. Вещь мне нужна, и плачу я золотом: {offer}. Деревня столько не даст. Решайте.»
    sellLabel:
      label: "💰 Продать за {offer}"
      color: "negative"
    refuseLabel:
      label: "Отказать"
      color: "positive"
    sold: |
      Сноходец взвешивает свёрток на ладони, не разворачивая, и отсчитывает монеты — тяжёлые, золотые, по одной. «Деревня переживёт, — говорит он, пряча свёрток под плащ. — Деревни всегда переживают.» И уходит в изгородь так же неслышно, как пришёл.

      Контракт деревни «{name}» сорван: бересту вы оставляете на ветке у стана.
    soldReward: "💰 Получено {offer}."
    refused: "Сноходец пожимает плечами, будто другого и не ждал. «Как знаете. Вещи вроде этой долго на одном месте не лежат.» И уходит в изгородь так же неслышно, как пришёл."
    thiefGone: "Бой кончен, но свёртка нигде нет. {thief} бежит с ним через изгородь — вы успеваете увидеть только спину. Далеко не уйдёт: ломится напролом, не разбирая дороги."
    escapedLeg: "Беглец не прячет следов — ему уже не до того: сломанные ветки, клочья одежды на шипах, брошенная фляга. Следы свежие, и с каждым шагом свежее."
    cornered: |
      След обрывается у старого оврага. {thief} ждёт внизу, прижавшись спиной к осыпи; рядом двое подручных, что ушли из стана следом. Бежать дальше некуда: за спиной только глина и корни.
    fightCornered: "Вы спускаетесь в овраг. {thief} выхватывает нож и хрипит: «Задаром не отдам!» Подручные встают рядом — терять им тоже нечего."
    victoryCornered: |
      Последний из троих падает у осыпи, и свёрток выкатывается вам под ноги. Вы разворачиваете мешковину: внутри — {artifact}. Вещь цела, только в глине.

      Осталось вернуть пропажу старосте деревни «{name}».
    camp: |
      Стан воров — на прогалине в кольце колючих кустов: шалаш из веток, костёр, оседланные кони у коновязи. Задерживаться здесь, видно, не собирались. У огня голов семь, сброд всех кровей: кто чинит сбрую, кто доедает похлёбку, кто дремлет, не снимая сапог.

      Чуть в стороне, на тюках, сидит восьмой и держит на коленях свёрток в мешковине. Свёрток он не выпускает из рук, даже когда тянется за флягой.
    fightLabel:
      label: "⚔ Напасть"
      color: "negative"
    fight: "Вы выходите из кустов, и первым вас замечает тот, что на тюках. Свёрток он прижимает к груди, а своим орёт: «Гости!» Воры вскакивают, хватая, что под рукой."
    victory: |
      Последний вор падает у костра. Свёрток в мешковине лежит там, где его выронили. Вы разворачиваете его: внутри — {artifact}. Вещь цела, только в копоти.

      Осталось вернуть пропажу старосте деревни «{name}».
    quitLabel:
      label: "Сойти со следа"
      color: "negative"
    quit:
      text: "Сойти со следа? Воры уйдут дальше, след остынет — и погоню придётся начинать заново, от ворот деревни. Контракт останется при вас."
      yesLabel:
        label: "Да, сойти"
        color: "negative"
      done: "Вы сворачиваете в сторону, и след теряется за спиной. Контракт деревни всё ещё при вас — но погоню придётся начинать заново."
    left: "Вы отходите от ворот. След пока виден — изгородь затягивает его не сразу. Контракт деревни всё ещё при вас."
    gone: "Здесь больше некого выслеживать: след никуда не ведёт."
    death: "Вы приходите в себя в изгороди, в стороне от стана. Воры не стали добивать — обшарили карманы и ушли, а с ними ушёл и след. Контракт деревни всё ещё при вас: погоню придётся начинать заново, от ворот."
  # Карточка «Контракта деревни»: что делать сейчас и кнопка.
  card:
    bandits: "Деревня {race} «{name}» платит за логово разбойников: на брошенной заставе у старого тракта верховодит {leader}. Плата — {pay}, за голову главаря — ещё {headPay}. Идти к логову — с этой карточки, из лабиринта."
    head: "Голова главаря с заставы у деревни {race} «{name}» — {leader}. Староста доплатит за неё {headPay}. Вернуться в деревню — с этой карточки, из лабиринта."
    spiders: "Деревня {race} «{name}» платит за гнездо сетеплётов: оно в глубоком овраге за деревней, при выводке — матка. Плата — {pay}. Идти к гнезду — с этой карточки, из лабиринта."
    return: "Дело сделано. Староста деревни {race} «{name}» ждёт вас с платой — {pay}. Вернуться в деревню — с этой карточки, из лабиринта."
    banditsLabel: "⚔ Идти к логову"
    spidersLabel: "🕸 Идти к гнезду"
    caravan: "Деревня {race} «{name}» нанимает охрану для каравана до города {city}: пять повозок, четыре перехода по тракту, в пути возможны засады. Плата — {pay} за весь обоз: отдаст тот, кто примет его в городе, — за каждую дошедшую повозку. Идти к каравану — с этой карточки, из лабиринта."
    caravanLabel: "🐎 Идти к каравану"
    artifact: "Деревня {race} «{name}» платит за свою украденную святыню — {artifact}: воры ушли с ней в изгородь, след начинается у ворот. Плата — {pay}. Идти по следу — с этой карточки, из лабиринта."
    artifactLabel: "👣 Идти по следу"
    artifactReturn: "{artifact} у вас. Староста деревни {race} «{name}» ждёт свою святыню и платит за неё {pay}. Вернуться в деревню — с этой карточки, из лабиринта."
    returnLabel: "🏠 Вернуться в деревню"
    onlyInLabyrinth: "К деревне ведёт лабиринт: идти туда можно только из него."
    tooShallow: "Деревни встречаются не ближе {level}-го уровня лабиринта — пройдите дальше."

# Квест смены расы (см. RaceQuestState): купон из лавки Фета — выбор расы —
# история этой расы. Герой берётся за обычное дело, а в конце его калечит и
# добивает кто-то этой расы, и он просыпается в теле убийцы, как в прологе.
# Сцена — text; выбор — подпись по своему id; <id>Then — реплика в начале
# следующей сцены, если у выбора она есть.
# Смена имени по купону Фета (см. NameChangeState). Отказы — в heroName.
nameChange:
  useLabel:
    label: "✍ Сменить имя"
    color: "positive"
  onlyInCity: "Сменить имя можно только в городе."
  current: "Сейчас вас зовут {name}."
  ask: "✍ Напишите новое имя одним сообщением: от 3 до 16 букв, русских или латинских. Купон сгорит, когда имя будет принято."
  confirm: "Новое имя — {name}. Купон сгорит. Меняем?"
  yesLabel: "Да, меняем"
  otherLabel: "Другое имя"
  cancelLabel: "Отмена"
  noCoupon: "Купона на смену имени в сумке больше нет — имя осталось прежним."
  done: "✍ Готово: теперь вас зовут {name}. Купон сгорел."

raceQuest:
  useLabel:
    label: "🎭 Сменить расу"
    color: "positive"
  onlyInCity: "Начать квест смены расы можно только в городе."
  pick: "В чьём теле проснуться? Нажмите на расу — покажу, что писал о ней Ашалдарон. Купон сгорит в конце квеста, когда вы проснётесь в новом теле."
  confirm: "Квест «{title}». Кем проснуться: {race}?"
  goLabel:
    label: "✅ Решено"
    color: "positive"
  otherLabel: "↩ Выбрать другую"
  cancelLabel:
    label: "Не сейчас"
    color: "negative"
  done: "📜 Квест «{title}» завершён. Теперь вы — {race}."
  homeLabel: "Вернуться в Кинэт"
  noCoupon: "Купона на смену расы в сумке не нашлось — история обрывается на полуслове."

  human:
    title: "Рыжая"
    s1:
      text: |
        На Торговой площади, между лотком с пряниками и бочкой с солёной рыбой, ревёт девочка лет восьми. Ревёт так, что лоточники морщатся, а голуби держатся подальше.

        — Рыжая убежала, — всхлипывает она, когда я останавливаюсь. — Кошка. Она рыжая. Её все так и зовут. Найдёте — отдам вам сокровище.

        Сокровище оказывается медной пуговицей с якорем. Девочка держит её на ладони так, будто это золотой.
      take: "Взяться искать"
      ignore: "Отмахнуться и пойти дальше"
      ignoreThen: "Я ухожу. Через десять шагов за спиной раздаётся сопение. Через двадцать девочка идёт рядом и пересказывает, что Рыжая любит, чего боится и как мурчит. Через тридцать я понимаю, что ищу кошку."
    s2:
      text: |
        Рыжие кошки в Кинэте водятся на каждом углу, но эта, судя по всему, особенная. Торговка рыбой видела «рыжую бандитку», которая утащила у неё леща и удрала в сторону порта. Мальчишка-разносчик видел её на заборе у Портового квартала. Сторож у причала видел, как она шмыгнула в старый склад, «куда честным людям ночью лучше не соваться».
      ask: "Расспросить сторожа о складе"
      askThen: "Сторож мнётся, оглядывается и шепчет: — Масло там хранят. Льняное. Только масло это почему-то по ночам возят, и бочки с него тяжёлые, как с камнями. Не моё дело. И не ваше."
      go: "Сразу идти к складу"
    s3:
      text: |
        Дверь склада не заперта — и это первое, что мне не нравится. Внутри темно, пахнет смолой и чем-то едким, как после фейерверка. Бочки с надписью «Льняное масло. Огнеопасно» стоят до самого потолка.

        На верхней бочке сидит рыжая кошка и смотрит на меня, как на опоздавшего. Я тянусь к ней — и тут скрипит дверь, и в склад входят трое. Впереди — жилистый человек со шрамом через губу и ножом, который он держит так, будто родился с ним в руке.

        — Это ещё кто? — спрашивает он ласково. Под рубахой у меня теплеет Клеймо, хотя рядом нет ни огня, ни солнца.
      cat: "Сказать, что пришёл за кошкой"
      catThen: "— За кошкой, — повторяет человек со шрамом и улыбается. — Ночью. В мой склад. За кошкой. Ребята, вы слышали? Стража совсем обленилась: даже врать не учит."
      hide: "Молча шагнуть в тень за бочки"
      hideThen: "Я отступаю в тень, но кошка выдаёт меня громким, обиженным «мяу». — Вот и ищейка, — говорит человек со шрамом. — Кривой Ян чужих ищеек не любит."
    s4:
      text: |
        Кривой Ян не дерётся честно, и его ребята тоже. Первый нож входит под рёбра раньше, чем я успеваю поднять оружие. Второй — в бедро. Я ломаю кому-то челюсть, кому-то руку, но в темноте между бочками их трое, а я один. Меня бьют, пока я не перестаю вставать, и ещё немного после.

        Я лежу на грязном полу, и кровь уходит в щели между досками. Ян садится рядом на корточки.

        — За кошкой, — говорит он с уважением. — Почти поверил.

        Последнее, что я вижу, — рыжая кошка на бочке. Она смотрит на меня, не мигая.
      close: "Закрыть глаза"
    s5:
      text: |
        Я открываю глаза и вижу свои руки. Жилистые, со сбитыми костяшками. В правой — нож. Мой прежний я лежит у моих ног и больше не дышит. Лицо у него удивлённое — у Яна, видно, было много времени удивиться.

        — Хозяин, — говорит один из подручных и протягивает мне мои же вещи, снятые с мертвеца. — Ваша доля.

        Я беру. В отражении на лезвии — шрам через губу и мой взгляд. Под рубахой разгорается огненный узор Клейма. Теперь мой убийца — это я. Со всеми его долгами, со всеми его врагами и со складом пороха под видом льняного масла.

        Утром я приношу девочке кошку. Она смотрит на шрам, на нож за поясом — и не боится.

        — У вас глаза, как у того дяди, — говорит она. — Который обещал найти.

        Медную пуговицу я так и не взял. Ни одна черта не усилена и не ослаблена: сила, телосложение, ловкость и ум — всё в полную меру. Обычный человек. Самая опасная примета в Пангее.

  khajiit:
    title: "Долг до утра"
    s1:
      text: |
        На Западной дороге стоит каджитский караван, и у его костра играют в кости. Хозяин каравана, Ра'Шидд, — седой каджит с золотым кольцом в ухе — улыбается каждому, кто подсаживается, и почти каждого раздевает до рубахи.

        — Путник хочет испытать удачу? — мурлычет он. — Удача любит смелых. Каджит любит удачливых. Особенно когда удача заканчивается.
      small: "Играть по маленькой"
      smallThen: "Я ставлю по медяку, осторожно. А кости вдруг будто сходят с ума: шестёрки, шестёрки и снова шестёрки. К полуночи передо мной гора серебра, и улыбка Ра'Шидда становится всё тоньше."
      all: "Поставить всё сразу"
      allThen: "Я ставлю всё, что есть. Кости катятся, стучат — две шестёрки. Каджиты вокруг костра перестают дышать. Ра'Шидд смотрит на кости долго, будто надеется, что они передумают."
    s2:
      text: |
        — Каджит заплатит, — говорит Ра'Шидд и кланяется так низко, что кольцо в ухе касается земли. — Каджит всегда платит. Не сейчас. Утром. Деньги в сундуке, а сундук спит, как и все честные сундуки.

        Он предлагает мне шатёр для гостей, лучший в караване. Ни один каджит не говорит «нет». Все говорят «не сейчас» — и я, кажется, начинаю понимать, что это значит.
      tent: "Остаться в гостевом шатре"
      fire: "Лечь у костра, на виду"
      fireThen: "Я устраиваюсь у костра, спиной к колесу повозки. Каджиты один за другим уходят спать. Костёр догорает. Последним уходит молодой каджит с серой шерстью — он долго смотрит на меня, прежде чем исчезнуть в темноте."
    s3:
      text: |
        Я просыпаюсь от того, что Клеймо обжигает грудь. В темноте надо мной — два жёлтых глаза с вертикальными зрачками и изогнутый нож.

        Племянник Ра'Шидда, Джа'Ри, быстрый, как сквозняк. Я успеваю перехватить первый удар, но не второй и не третий. Он режет не глубоко — часто: по рукам, по ногам, по лицу. Так охотятся кошки: не убивают сразу, а ждут, пока добыча перестанет сопротивляться. Я перестаю.

        — Дядя всегда платит, — шепчет Джа'Ри, наклоняясь ко мне. — Не сейчас — так никогда.
      breath: "Вдохнуть в последний раз"
    s4:
      text: |
        Звёзды. Их слишком много — столько я не видел никогда. Глаза видят в темноте так, что каждая травинка как днём. За спиной шевелится что-то пушистое и упрямое. Хвост. Шерсть густая и серая, уши ловят шорох мыши за двадцать шагов. В лапе — изогнутый нож, ещё тёплый.

        Под шерстью разгорается огненный узор Клейма.

        Утром Ра'Шидд выходит из шатра, видит мёртвого гостя и меня рядом и довольно кивает:

        — Джа'Ри молодец. Долг уплачен. — Он отсчитывает мне из сундука горсть серебра — моего серебра — и бросает к ногам мои же вещи. — Твоя доля, племянник.

        Так я получил свой выигрыш. Утром, как и обещали. Ловкость в теле — как у пружины. Здоровья поменьше: каджиты платят за быстроту. А «не сейчас» я теперь, кажется, буду говорить и сам.

  elf:
    title: "Письмо с печатью"
    s1:
      text: |
        В Торговом доме ко мне подходит нотариус — сухой человек в чернильных нарукавниках. Работа простая и хорошо оплаченная: доставить письмо старосте эльфийской деревни за Гнилым Лесом. Лично в руки. Срочно.

        Письмо запечатано зелёным воском. Адрес выведен эльфийскими знаками — теми, которыми в Кинэте пишут договоры и расписки. Только эти знаки старинные, с завитками, и прочитать их у меня не выходит.
      take: "Взять письмо"
      ask: "Спросить, что в письме"
      askThen: "— Не моё дело читать чужие письма, — нотариус поправляет нарукавники. — И не ваше. Платят за доставку, а не за любопытство. Задаток — вот."
    s2:
      text: |
        За Гнилым Лесом лес меняется, будто кто-то провёл черту: пропадает вонь, стволы светлеют, под ногами вместо гнили — мох. Здесь деревья не рубят — их уговаривают. Тропа сама поворачивает туда, куда мне нужно, и это пугает больше любого волка.

        Письмо оттягивает сумку, будто в нём не бумага, а камень.
      open: "Вскрыть письмо на привале"
      openThen: "Я поддеваю воск ножом. Внутри одна строка старинных знаков. Прочитать я могу только одно слово — его пишут на каждой расписке в Кинэте: «податель». Я запечатываю письмо обратно, как умею. Получается плохо."
      keep: "Не трогать чужое"
    s3:
      text: |
        Староста Аэлинар встречает меня у ворот, вросших в живые деревья. Высокий, тонкий, с луком за спиной. Он читает письмо долго, хотя там одна строка. Потом аккуратно сворачивает его.

        — Договор, — говорит он без выражения. — Заключён в Кинэте, скреплён нашими знаками, оплачен вперёд. Здесь написано: «Подателя сего — не отпускать живым». Эльфы не нарушают того, что написано нашими буквами. Никогда. Ничего личного.

        Клеймо под рубахой вспыхивает, будто его облили маслом. Вокруг, на ветвях, бесшумно поднимаются луки.
      run: "Бежать к лесу"
      runThen: "Я успеваю сделать четыре шага. Первая стрела входит под колено, вторая — в спину. Эльфы стреляют, как пишут: без единой лишней черты."
      fight: "Выхватить оружие"
      fightThen: "Я успеваю выхватить оружие. Это всё, что я успеваю. Стрелы прилетают со всех сторон разом, и каждая находит своё место, как буква в строке."
    s4:
      text: |
        Я лежу во мху, утыканный стрелами, и мох под щекой уже тёплый от крови. Встать не получается. Двигаться — тоже. Аэлинар подходит неторопливо и накладывает последнюю стрелу.

        — Договор есть договор, — говорит он. — Ты не виноват. Виноват тот, кто писал.
      look: "Посмотреть ему в глаза"
    s5:
      text: |
        Первым приходит запах. Лес пахнет сотней вещей, о которых я раньше не знал: смолой, дождём, который пойдёт завтра, лисой, что пробежала здесь утром. Потом — звук: сердце бьётся медленно, будто ему некуда спешить.

        Я стою с луком в руках, и мир оказывается ниже. Пальцы длинные, в ушах звенят кольца. На бледной коже с зеленцой проступает огненный узор Клейма — чужой этому телу, как клякса на чистой странице.

        Моё прежнее тело лежит во мху. Эльфы уносят его с почестями: договор исполнен, исполнителю — уважение. Мои вещи мне отдают, как старосте и положено.

        Письмо всё ещё в моей руке. Я переворачиваю его. На обороте, мелко, человеческим почерком, приписка, которую я раньше не видел: «Привет от Братства».

        Ловкость в пальцах стала острее, мысли — быстрее. А вот рубить с плеча теперь труднее: сила ушла, как вода в песок. Ничего. Теперь я умею читать.

  orc:
    title: "Трёхклык"
    s1:
      text: |
        В таверне за угловым столом сидит орк, и столько места не занимают даже трое. Бурзаг, охотник с перевала. Ищет напарника на кабана, о котором в горах рассказывают сказки: Трёхклык, ростом с телегу, с тремя клыками и характером хуже, чем у налогового сборщика.

        — Плачу половиной шкуры, — гудит Бурзаг. — Из такой шкуры выйдет десять пар сапог. Или один хороший орк.
      agree: "Согласиться"
      haggle: "Поторговаться"
      haggleThen: "— Орк не торгуется, — Бурзаг хмурится, думает и вдруг добавляет: — Орк добавляет. Половина шкуры. И клык. Самый маленький. Хватит."
    s2:
      text: |
        В горах холодно, ветрено и неудобно, и Бурзаг чувствует себя как дома. Он читает следы на камне, как я читаю вывески, и по дороге учит меня орочьим охотничьим правилам. Не ходить против ветра. Не смотреть зверю в глаза. И последнее:

        — Раненого в горах не тащат, — говорит Бурзаг. — Добивают. Быстро. Чтобы не мучился и чтоб других не губил. Так правильно.

        Клеймо под рубахой почему-то теплеет, хотя ветер пробирает до костей.
      first: "Идти первым"
      firstThen: "Я иду первым. Бурзаг не спорит — только перехватывает копьё поудобнее, будто знает, чем кончаются горы для тех, кто идёт первым."
      follow: "Идти следом за орком"
      followThen: "Я иду за Бурзагом, след в след. Это не помогает: кабан выходит не спереди, а сзади."
    s3:
      text: |
        Трёхклык выходит из тумана молча, и это самое страшное. Он ниже, чем в сказках, но шире, чем в кошмарах. Удар — и я лечу на камни. Ещё удар — что-то хрустит в рёбрах. Третий клык проходит по ноге, и ноги больше нет — не в том смысле, что её оторвало, а в том, что она больше не слушается.

        Бурзаг вгоняет копьё кабану под лопатку и держит, пока зверь не затихает. Потом подходит ко мне. Смотрит на ногу, на рёбра, на кровь в снегу. Вздыхает.

        — Ты хорошо держался, — говорит он и достаёт нож. — Раненого в горах не тащат.
      teeth: "Сжать зубы"
    s4:
      text: |
        Холод. Потом — тяжесть в плечах и тёплая рукоять ножа в огромной зелёной ладони. Я поднимаю руку: она огромная, с когтями, что царапают ладонь. Нога на месте. Обе. Обе слушаются.

        У моих ног лежит моё прежнее тело, а рядом — Трёхклык. Под шкурой на груди разгорается знакомый огненный узор, впиваясь в новую плоть. Теперь мой убийца — это я.

        Вещи погибшего орки несут его родне. Родни у погибшего нет — значит, тому, кто добил. Так правильно. Я собираю свои вещи и взваливаю на плечо кабанью голову.

        В долине клан встречает меня рёвом: Бурзаг вернулся с Трёхклыком. Сила течёт по жилам, тяжёлая, как ртуть. Ловкости в пальцах стало меньше, ума в голове — не больше. Зато поднять я теперь могу почти всё.

  gnome:
    title: "Замок без ключа"
    s1:
      text: |
        На двери мастерской в Нижнем квартале, под Гномьими Шахтами, висит объявление: «Кто откроет замок мастера Торбальда — получит кошель золота. Кто не откроет — заплатит за попытку». Внизу приписка, мельче: «Пока не открыл никто».

        Сам Торбальд — коренастый гном с бородой, заплетённой в три косы, — встречает меня у верстака и потирает руки. Замок на верстаке размером с кулак и блестит, как новенький.
      take: "Взяться за замок"
      look: "Сначала осмотреться в мастерской"
      lookThen: "Пока Торбальд готовит инструменты, я разглядываю стену с чертежами. Все подписаны одним именем — Хальдор Наковальня. Только ни одного Хальдора в мастерской нет. Есть Торбальд, и он очень быстро задёргивает чертежи занавеской."
    s2:
      text: |
        Замок хорош. Нет — замок гениален: шестнадцать штифтов, ложный механизм, пружина, которая ломает отмычку, если тронуть её не в том порядке. Я вожусь с ним до вечера, и где-то на третьем часу понимаю: этот замок я уже видел. На чертеже. С подписью Хальдора.

        Щёлк. Замок открывается.

        Торбальд смотрит на меня так, будто я открыл не замок, а его сундук с грехами.
      tell: "Сказать, что узнал чертёж"
      tellThen: "— Это не твой замок, — говорю я. — Это замок Хальдора. — Торбальд молчит. Потом улыбается — широко, по-доброму, и от этой улыбки у меня холодеет спина."
      silent: "Молча забрать награду"
      silentThen: "Я молча протягиваю руку за кошелем. Торбальд отдаёт его — слишком легко для гнома. Он видел, как долго я смотрел на чертежи."
    s3:
      text: |
        — Это надо обмыть, — говорит Торбальд и ведёт меня вниз, в кузню под мастерской. — Первый, кто открыл! Пиво у нас в квартале лучшее в Пангее.

        Пиво оказывается хорошим. Пол под ногами — нет. Плита уходит вниз, и я лечу в шахту для остывания слитков, на камни и железо. Ломаются ноги, потом рука. Клеймо горит так, что я чувствую его сквозь боль.

        Торбальд спускается по лестнице неторопливо. В руке — кузнечный молот.

        — Ничего личного, — ворчит он. — Секреты — тоже металл. Их куют и прячут. А ты слишком хорошо открываешь замки.
      shield: "Заслониться рукой"
    s4:
      text: |
        Тяжесть. Это первое. Кость тяжелее, чем у иного орка, и тело стоит на земле так, будто вросло в неё. Я сжимаю кулак: пальцы толстые, в густом волосе, кожа грубая и красноватая. В руке — молот. В бороде, заплетённой в три косы, застряла окалина.

        На камнях внизу лежит моё прежнее тело. Мои вещи — там же: Торбальд не успел их прибрать.

        Клеймо проступает на груди медленно, будто прожигает не кожу, а металл. Теперь мой убийца — это я. С его мастерской, его спором и его чертежами с чужой подписью.

        Я поднимаюсь наверх и долго смотрю на стену с чертежами Хальдора. Ловкости в руках стало меньше, зато сдвинуть меня с места теперь не сможет никто. С мысли — тем более.

  murloc:
    title: "Кто ворует сети"
    s1:
      text: |
        В рыбацкой деревне ниже по реке беда: кто-то по ночам рвёт сети и уносит улов. Староста рыбаков клянётся, что это не выдры и не соседи — «у соседей зубы не такие». Он показывает обрывок сети: прядь перекушена ровно, острыми мелкими зубами. Платит рыбой и честным словом. Честное слово у рыбаков, говорят, дороже рыбы.
      wait: "Засесть у сетей на ночь"
      walk: "Пройти вдоль берега до трёх камней"
      walkThen: "Я иду вдоль реки до трёх камней, что торчат из воды, как зубы. На песке — следы перепончатых лап, и все они ведут обратно, к рыбацким сетям. Возвращаюсь и сажусь ждать."
    s2:
      text: |
        За полночь сеть дёргается. Я тяну — и вытаскиваю на берег мурлочонка, запутавшегося в ячеях. Маленький, мокрый, перепуганный, с полной пастью краденой рыбы. Он смотрит на меня огромными жёлтыми глазами и даже не пытается укусить.
      free: "Отпустить малька"
      freeThen: "Я распутываю сеть. Мурлочонок не убегает сразу — смотрит на меня, будто не верит. Потом выплёвывает рыбу мне под ноги и плюхается в реку. Я выпрямляюсь — и вижу, что из тростника на меня смотрят сорок глаз."
      tie: "Связать и нести к рыбакам"
      tieThen: "Я связываю мурлочонка его же сетью. Он не кричит — только тихо булькает. Ответ приходит из тростника: сорок глаз разом открываются в темноте."
    s3:
      text: |
        Мурлоки выходят из воды молча, с костяными копьями. У мурлоков просто: кто силы не показал, тот не гость, а добыча. Я пытаюсь показать силу — одному, другому, третьему. Но их сорок, а я на их берегу и в их реке.

        Меня тащат под воду. Течение здесь злое: оно бьёт о камни — раз, другой, третий, и с каждым ударом что-то ломается. Вода заливает рот. Клеймо горит даже под водой.

        Шаман с посохом, увитым ракушками, что-то булькает, и мне в лицо смотрит тот самый мурлочонок. В его лапах — костяное копьё. У мурлоков, похоже, есть обычай: кто привёл добычу, тот её и добивает. Он медлит. Шаман булькает ещё раз.
      water: "Вдохнуть воду"
    s4:
      text: |
        Вода. Она не душит — она дышит за меня. Жабры по бокам шеи раскрываются сами, и река течёт сквозь меня прохладной, вкусной струёй. Пальцы соединены перепонками, на запястьях — плавники. В лапе — костяное копьё.

        Племя булькает и хлопает меня по спине: мой первый охотник, моя первая добыча. Шаман снимает с посоха ракушку и кладёт мне в ладонь — новое поколение.

        Клеймо проступает на маленькой чешуйчатой груди огненными прожилками, и вода вокруг начинает парить. Моё прежнее тело лежит на дне. Мои вещи — на берегу: мурлоки не трогают то, что пахнет Клеймом.

        Сила в лапах уже не та, и тело хрупче, зато ловкость и ум острые, как зубы. А рыбакам, кажется, придётся искать нового сторожа. И, кажется, теперь я смогу догнать лошадь. По суше.

  goblin:
    title: "Настоящая карта"
    s1:
      text: |
        На краю Торговой площади ко мне подкатывается гоблин в трёх шапках разом и шёпотом, на всю площадь, сообщает, что у него есть «настоящая карта». К сокровищу. В руинах на болоте. Всего за сто серебра.

        Я качаю головой. Карта тут же дешевеет до пятидесяти. Потом до двадцати. Когда я уже ухожу, гоблин кричит вслед: «Бесплатно! Но я иду с тобой. За долю».
      hire: "Взять гоблина в проводники"
      leave: "Уйти"
      leaveThen: "Я ухожу. Гоблин, назвавшийся Шмыгой, догоняет меня у ворот, на дороге к болоту и на самом болоте. К вечеру я понимаю, что он — мой проводник, хочу я того или нет."
    s2:
      text: |
        Шмыга ведёт через болото быстро и уверенно и каждые сто шагов пересматривает уговор. Сначала было пополам. Потом шестьдесят на сорок — «у меня ноги короче, мне тяжелее». Потом семьдесят на тридцать — «я знаю, где кочки, а ты нет». На восьмидесяти мы доходим до руин.

        Клеймо под рубахой зудит, как комариный укус. Наверное, комары.
      agree: "Согласиться на восемьдесят"
      agreeThen: "— Восемьдесят так восемьдесят, — говорю я. Шмыга смотрит на меня с жалостью. — Никогда не соглашайся с гоблином сразу. Гоблин тогда думает, что продешевил."
      threaten: "Пригрозить гоблину"
      threatenThen: "Я хватаю Шмыгу за шиворот. Он не пугается, а достаёт из-за пазухи огрызок бумаги и что-то записывает. — Угрозы гоблин записывает, — поясняет он. — На потом."
    s3:
      text: |
        Сундук в руинах настоящий. Тяжёлый, кованый, полный. Это я успеваю заметить, прежде чем пол подо мной проваливается в яму с кольями.

        Колья заканчивают то, что начал пол. Я лежу на дне, наколотый, как бабочка в коллекции, и смотрю, как сверху спускается Шмыга. Он сначала обходит меня, сгребает из сундука всё, что блестит, потом садится мне на грудь. В руке — ржавый нож.

        — Обмануть гоблина можно ровно один раз, — говорит он почти ласково. — А тебя — сколько угодно. На всякий случай.
      laugh: "Рассмеяться"
    s4:
      text: |
        Холодно, мокро и смешно. Это первое, что я понимаю: внутри этого тела всё время кому-то смешно. Руки тонкие и кривые, кожа зелёная и толстая, как подошва. В каждом кармане что-то звенит — сокровище из сундука. Я не помню, чтобы что-то туда клал. Хотя нет. Помню. Теперь помню.

        Моё прежнее тело лежит на кольях. Я забираю у мертвеца свои же вещи — и кошелёк, и сапоги, и всё остальное. Это, пожалуй, самое честное ограбление в истории болота.

        Клеймо проступает на груди, и я впервые за весь день не смеюсь. Теперь мой убийца — это я. Со всем его сокровищем и всеми, кого он успел обмануть.

        Вёрткости хватит на троих, силы — чуть больше прежнего. Здоровья поменьше, а умных мыслей… Ладно. Обмануть меня теперь можно ровно один раз.

  demon:
    title: "Скрежет в стене"
    s1:
      text: |
        Ночью в комнате над таверной кто-то скребёт в стене. Не крыса — крысы так не умеют: скрежет идёт ритмично, будто кто-то пишет когтем одно и то же слово. Трактирщик утром пожимает плечами: «Стены старые. Поют».

        Следующей ночью стена поёт снова. И теплеет — я кладу на неё ладонь, и камень тёплый, как бок спящего зверя.
      knock: "Постучать в стену в ответ"
      knockThen: "Я стучу. Скрежет замирает. Потом из стены отвечают — три удара, точно в такт моим. Внизу, в подвале, с грохотом падает бочка."
      cellar: "Спуститься в подвал"
    s2:
      text: |
        За бочками в подвале — дверь, о которой трактирщик, похоже, не знает. За дверью — комнатка, мел на полу, огарки свечей и белый как мел студент, прижавшийся к стене.

        — Я хотел совсем маленького, — шепчет он. — Для учёбы. Чертёнка. Совсем крошечного…

        В меловом круге сидит существо размером с кошку. Чёрное, в шипах, с глазами, как два уголька. Оно смотрит на меня и мурлычет.

        — Выпусти, — говорит оно голосом, от которого гаснут свечи. — Я покажу тебе, кто ты.
      erase: "Стереть черту"
      eraseThen: "Я провожу сапогом по мелу. Черта стирается легко, будто только этого и ждала. Существо выходит из круга, потягиваясь, — и с каждым шагом становится больше."
      leave: "Выгнать студента и уйти самому"
      leaveThen: "Я выталкиваю студента за дверь. Он бежит, роняет свечу на круг, и мел трескается от жара. Существо выходит из круга, потягиваясь, — и с каждым шагом становится больше."
    s3:
      text: |
        Через десять шагов демон ростом с меня. Через двадцать — упирается рогами в потолок подвала. Шипы, когти, одно крыло, второе обломано у основания. Кожа чёрная, и от неё идёт жар.

        — Ты спросишь, откуда я взялся, — говорит он. — Все спрашивают. Лучше ответь: а ты?

        Я не знаю ответа. Я бью — оружие отскакивает от шипов. Он бьёт в ответ, и рёбра лопаются, как сухие ветки в костре. Я падаю. Демон наклоняется и кладёт мне на грудь ладонь — туда, где горит Клеймо.

        — Интересно, — шепчет он. — Что это у тебя?

        И давит.
      silent: "Не отвечать"
    s4:
      text: |
        Жар. Теперь он не снаружи, а внутри — он и есть я. Я открываю глаза, и в темноте подвала всё видно, как днём: глаза светятся сами. На голове тяжесть рогов, за спиной — крыло. Одно. Второе, обломанное, ноет, как старая обида.

        Моё прежнее тело лежит у стены. Лицо у него удивлённое. Демон хотел узнать, что у меня на груди. Узнал. Огненный узор горит теперь на чёрной коже, и шипы вокруг него расходятся, уступая место. Теперь мой убийца — это я.

        Мои вещи лежат там, где я упал. Наверху кричит студент. Кажется, он наконец получил своего демона.

        Сила и ум стали острее на пятую часть. Тело — хрупче на столько же. Демона трудно переспорить, но нетрудно продырявить. Придётся помнить.

# VK Mini App, вкладка «Вещи»: названия хранилищ и что сказать, пока хранилище
# закрыто, — как его открыть.
miniapp:
  storages:
    casket:
      title: "Ларец Азата"
      locked: "Ларец Азата собирает Фет — его лавка в Торговом доме."
    livingBag:
      title: "Живая сумка"
      locked: "Живую сумку собирает Фет — его лавка в Торговом доме."
    wardrobe:
      title: "Миниатюрный шкаф"
      locked: "Миниатюрный шкаф собирает Фет — его лавка в Торговом доме."
    barrel:
      title: "Неприметная бочка"
      robbed: "Крышка висит на одном гвозде: гоблины всё унесли. Пока своё не вернёте, класть сюда нечего."
    vault:
      title: "Хранилище"
      locked: "Хранилище — в Торговом доме: ячейку продаёт банкир Рахадим."
    herbs:
      title: "Полки трав"
      locked: "Верстак травника стоит в доме со второго: дома продаёт Юнона Кинтслев."
      full: "На полках трав нет места."
    brews:
      title: "Полка отваров"
      locked: "Верстак травника стоит в доме со второго: дома продаёт Юнона Кинтслев."
      full: "На полке отваров нет места."
    cauldron:
      title: "Котелок"
      locked: "Верстак травника стоит в доме со второго: дома продаёт Юнона Кинтслев."
    gems:
      title: "Камни"
      locked: "Хранилище камней есть только в доме на парящем острове."
      full: "В хранилище камней нет места."
    runes:
      title: "Алтарь"
    wall:
      title: "Трофеи"
      locked: "Стена трофеев — в доме на парящем острове."
    racks:
      title: "Стойки"
      locked: "Магическую стойку ставит Юнона в «Обустройстве»."
      rack: "Стойка {n}"
    bag:
      title: "Сумка"
    # Вне города из приложения перекладывают только между тем, что при себе; в бою — никак.
    away: "Вне города можно перекладывать только то, что при себе. Хранилища города и дома — когда вернётесь в Кинэт."
    inBattle: "В бою вещи не переложить. Закончится бой — разберёте."
    # Итог переноса: что и куда — без падежей, у хранилищ они разные.
    moved: "«{name}» → {to}"
    movedAll: "{items} → {to}"
    wrongPlace: "«{name}» сюда не положить: {to} такое не берёт."
    # «Выбросить»: откуда — как и для переноса, что выброшено, сюжетное — нельзя.
    dropAway: "Вне города выбросить можно только то, что при себе. Хранилища города и дома — когда вернётесь в Кинэт."
    dropInBattle: "В бою вещи не выбросить. Закончится бой — разберёте."
    dropped: "🗑 Выброшено: «{name}»."
    droppedAll: "🗑 Выброшено: «{name}» ×{n}."
    questNoDrop: "★ Этот предмет нужен для задания — его не выбросить."
  noHouse: "Дома пока нет. Дома продаёт Юнона Кинтслев — «🏠 Дом» в городе."
  # Плашка у объявления с доски во вкладке «Задания»: в журнале бота строка
  # длинная («сделано, можно сдавать»), на плашке нужна короче.
  boardReady: "готово"
  # Топ: подпись героя без имени — прошёл пролог до имён, а из ВК имени не
  # подобрали (см. NameBackfill).
  top:
    noName: "Искатель без имени"
  # Крафт из приложения: только в городе, как и передачи вещей.
  craft:
    away: "Крафт — только в городе. Вернитесь в Кинэт, чтобы класть вещи и активировать куб."
    noCube: "Куб ещё не работает."
  # Снаряжение из приложения меняют где угодно, только не в бою: ход боя
  # считается на надетом.
  equipment:
    inBattle: "В бою снаряжение не сменить. Закончится бой — переоденетесь."
  # Отвар из приложения: что спросить перед тратой и что сказать, если стало нельзя.
  brew:
    confirm: "Использовать «{name}»? Склянка уйдёт."
    stale: "Так этим отваром сейчас не воспользоваться."
  # Кнопка задания с карточки сюжетного предмета (см. QuestCard): задание
  # пошло дальше — его новый экран уже в чате с ботом; кнопка устарела —
  # пока игрок смотрел, предмет или шаг задания поменялись.
  quest:
    toChat: "📜 Задание продолжается в чате с ботом: новый экран уже там."
    stale: "С этим предметом сейчас так не выйдет — загляните в его карточку ещё раз."
  squad:
    inBattle: "В бою строй не перестроить. Закончится бой — расставите отряд заново."
  # Покупка на аукционе из приложения — тоже только в городе, как в Торговом доме.
  auction:
    away: "Покупать на аукционе можно только в городе. Вернитесь в Кинэт, чтобы купить лот."

# Обмен между игроками (см. Trades): предложение, ответ, принятие. Положенное в
# обмен ждёт в закладе; отзыв, отказ и срок возвращают всё целиком, с комиссией.
trade:
  notInCity: "Обмен — только в городе: предлагать, отвечать и принимать можно, пока вы в Кинэте. Отозвать или отклонить — откуда угодно."
  noPartner: "Героя по имени «{name}» нет — проверьте, как оно пишется."
  self: "С самим собой не меняются."
  tooMany: "У вас уже {max} открытых предложений обмена. Дождитесь ответа или отзовите какое-нибудь."
  empty: "Положите что-нибудь в обмен или напишите, чего хотите взамен."
  nothing: "В обмене пусто с обеих сторон — принимать нечего."
  noteTooLong: "Записка длиннее {max} знаков — сократите её."
  badAmount: "Сумма — число не меньше нуля."
  tooLittle: "Меньше {min} в обмен не положить."
  notEnoughSilver: "Не хватает серебра: в обмен нужно ещё {need} вместе с комиссией {fee}, а при себе и в ячейке {have}."
  notEnoughDoubloons: "Не хватает дублонов: в обмен нужно ещё {need} вместе с комиссией {fee}, а при себе {have}."
  itemGone: "Какой-то из этих вещей уже нет при вас — откройте список заново."
  notTradable: "«{name}» не передаётся: сюжетные вещи и трофеи остаются у хозяина."
  closed: "Это предложение уже закрыто."
  notYourTurn: "Сейчас ход партнёра — дождитесь его ответа. Отказаться можно в любой момент."
  stale: "Пока вы смотрели, предложение изменилось — откройте его заново."
  nothingSide: "ничего"
  # Подпись посылки, которой заклад возвращается хозяину.
  returnFrom: "Возврат с обмена"
  # Письма партнёру.
  offered: "🤝 {name} предлагает вам обмен. Посмотреть и ответить — в Торговом доме («Обмен») или в приложении."
  answered: "🤝 {name} отвечает на обмен. Посмотреть — в Торговом доме («Обмен») или в приложении."
  accepted: "🤝 {name} принимает обмен. Вам: {got}."
