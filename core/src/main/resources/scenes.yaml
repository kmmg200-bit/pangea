    startKin: "Вы выходите из тростника с оружием наготове. Дети замечают вас первыми — и не визжат: узнают своего и бегут навстречу. Потом видят железо в ваших лапах. Из тростника — не крик, а тишина. Её рвёт голос старейшины: «Свой… С железом — на своих?» — и тишина кончается."
