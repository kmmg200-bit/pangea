# Расплата: раса приходит за своим, когда герой положил слишком многих.
# {race} — род, {name} — имя того, кто пришёл. Счёт они ведут, но вслух не называют.
revenge:
  scenes:
    - |
      Коридор впереди перегорожен, сзади уже стоят. Их трое, и тот, что посередине, знает вас в лицо.
      «{name}. Запомни это имя — последнее, что ты услышишь. За всех наших, кого ты положил, ответишь сегодня.»
    - |
      Свет факелов сходится с двух сторон разом: {raceLower} вышли из боковых ходов и встали кольцом.
      «Мы считали, — говорит {name}, выступая вперёд. — Каждого по имени. Ты со счёта сбился, а мы нет.»
    - |
      Они не прячутся. Стоят посреди зала, и оружие у них опущено — пока.
      «Долго искали, — {name} говорит негромко, будто о погоде. — Слишком многих ты у нас забрал. Сегодня счёт закроем.»
    - |
      Сперва вы слышите, как за спиной осыпается щебень, и только потом видите их впереди.
      «{race} помнят, — {name} перехватывает оружие поудобнее. — Всех до одного помнят. Стой где стоишь.»
    - |
      Двое перекрывают проход, третий спускается сверху и встаёт между вами и выходом.
      «{name}, — представляется он, будто это что-то меняет. — Ты зачастил в наши края и возвращался не с пустыми руками. Больше не вернёшься.»
  fight: "⚔ Принять бой"
  persuade: "Это не я"
  believed: "«…Не он», — говорит кто-то сзади. {race} переглядываются, и кольцо размыкается так же молча, как сомкнулось. Вас пропускают."
  notBelieved: "Вас дослушивают до конца. Потом тот, что посередине, качает головой: «Складно. Но руки у тебя в нашей крови по локоть»."
  battle: "⚔ {name} и двое старших {raceOf} идут на вас разом."

# Пещера с монстрами (1%): 10–20 комнат на сетке, кучки мобов по 3–5, находки
# по углам и один сухой угол на привал.
cave:
  gate:
    text: |
      В скале — пролом, из которого тянет сыростью и чужим жильём. У самого входа натоптано: следы свежие, и оставили их {race}.
      Сколько их там, по следам не понять. Слышно только, что внутри не один и не двое.
    enter: "Войти"
    supply: "Использовать предмет"
    leave: "Уйти"
  entered: "Свод смыкается над головой, и дневной свет остаётся за спиной. Пути расходятся в темноту."
  # Пещера Некроманта: вся родня внутри поднята, и это чувствуется с порога.
  deadAir: "Первым делом ищешь, чем пахнет зверь: шерстью, старой кровью, мочой. Ничего. Пахнет только тем, что уже не вернётся, — и пахнет ровно, без порывов, будто запах здесь не остался, а живёт."
  # Логово хозяина: у Некроманта и у Крысиного короля свои. Хозяин ждёт на
  # нижнем ярусе: ход к нему (room.stairs), спуск (descended) и выбитый верх
  # (upperClear) — тоже у каждого свои (см. MonsterCaveState.FloorSays).
  necro:
    room:
      lair: "Ход открывается в залу, где кости сложены по стенам ровными рядами, как дрова. В середине кто-то стоит и ждёт, пока вы подойдёте."
