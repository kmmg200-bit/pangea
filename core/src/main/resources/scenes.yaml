  # засада оказывается от ночной стражи.
  caravan:
    text: |
      Караван стоит у Сухого колодца: шесть повозок кругом, костры внутри, вьючные звери дремлют стоя. Слишком много охраны для честной торговли — и слишком много ножей для честной охраны.

      Барти катит за мной тачку, гружённую так, что скрипят колёса. Мои двадцать шнапса и двадцать живой воды — а сверху ещё ящик самогона и две корзины склянок. «Своё! — гордо шепчет он. — Я тоже запасался. Делец я или кто?»

      Хозяин каравана, Та'Нахир, — старый каджит в шёлковом халате — улыбается так широко, что видны все клыки.

      «Каджит рад друзьям. Каджит особенно рад друзьям с товаром. Каджит знает искателей: искатели любят караваны — особенно чужие. Пусть друг поставит ящики у колеса. Каджит пересчитает. Золото — потом. Каджит всегда платит. Не сейчас.»

      За спиной у меня встаёт молодой каджит с изогнутым ножом и не убирает его, даже когда я оборачиваюсь.

      «Это нормально, — шепчет Барти. — Обычай у них такой. Наверное.»
    # Герой-каджит: караван встречает собрата.
    textKin: |
      Караван стоит у Сухого колодца: шесть повозок кругом, костры внутри, вьючные звери дремлют стоя. Охраны много — каджитской, при саблях.

      Барти катит за мной тачку, гружённую так, что скрипят колёса. Мои двадцать шнапса и двадцать живой воды — а сверху ещё ящик самогона и две корзины склянок. «Своё! — гордо шепчет он. — Я тоже запасался. Делец я или кто?»

      Хозяин каравана, Та'Нахир, — старый каджит в шёлковом халате — видит мои уши, мой хвост, мои глаза и прижимает ладонь к сердцу.

      «Здешние пески холодны, брат. Но Каджит видит: на дело из Кинэта пришёл собрат-каджит — и на душе у Каджита стало теплее. Пусть брат поставит ящики у колеса. Золото — потом: Каджит пересчитает. Каджит всегда платит. Брату — тем более.»

      Двое капитанов каравана встают рядом со мной — не за спиной, а плечом к плечу.

      «Это у них обычай такой? — шепчет Барти. — Наверное, хороший.»
