  accepted: "🎟 Код принят! Азат благословил вас на {days} дня: больше опыта, серебра и добычи, а каждую полночь — быстрые отдыхи."
  ownerNotice: "🎟 {name} вписал(а) ваш код друга — Рахадим передаёт вам 🟡 {now}. Когда друг дорастёт до {level} уровня, придут ещё 🟡 {later}."
  levelNotice: "🎟 {name}, вписавший(ая) ваш код, дорос(ла) до {level} уровня — Рахадим передаёт вам ещё 🟡 {doubloons}."

# Промокоды: пишут боту в личку голым сообщением, с любого экрана. Каждому —
# один раз. Список наград (`rewards`) собирается из строк item / blessing /
# blessingLonger / doubloons, по строке на награду.
promo:
  accepted: "🎁 Код «{word}» принят! Вы получили:\n{rewards}"
  item: "• {name}"
  blessing: "• ✨ Благословение Азата на {hours} ч"
  blessingLonger: "• ✨ Благословение Азата продлено на {hours} ч"
  doubloons: "• 🟡 {amount} дублонов"
  already: "Код «{word}» вы уже вводили — второй раз он не сработает."
  expired: "Срок кода «{word}» вышел — он больше не действует."
  noRoom: "Награда не помещается: нужно свободных мест в сумке — {need}, а есть {free}. Освободите место и введите код снова — он не сгорел."
  noHero: "Код «{word}» можно будет ввести, когда вы создадите персонажа."

transfer:
  pick: "Кому: {to}. Сколько: {count}.\nВыберите вещь — у каждой кнопки свои характеристики.\nСтраница {page}/{total}"
  # Ищут в том, что при герое: сумка, ларец, Живая сумка, шкаф (см. Transfers.carried).
  nothing: "При вас нет ничего похожего на «{query}»."
  noTrophies: "Трофеи из рук в руки не ходят: их сдают в Гильдии, а не передают."
  noNamedTrophies: "Уникальные трофеи из рук в руки не ходят: их место — на Стене трофеев."
  # Подошла только сюжетная экипировка (см. Item.isStoryGear).
  noStoryGear: "★ Сюжетные вещи из рук в руки не ходят: их носят сами — или продают Ришелье."
  # Такое есть только в стопке, а слово «стопку» не сказали (см. Transfers.matching).
  bundleWord: "📦 «{query}» у вас только в стопке. Чтобы передать стопку, так и скажите: «Передать стопку {query}»."
  cancel: "Отмена"
  confirm: "Передать {what} игроку {to}?"
  confirmYes: "Передать"
  confirmNo:  "Отказаться"
  sent: "{name} ×{count} отправлено игроку {to}. Вещь ляжет к нему в банковскую ячейку."
  # То же для того, что дом получателя может взять сразу (см. HomeIntake):
  # руны, травы, отвары, камни. Есть ли у него дом и место, отправителю не видно.
  sentHome: "{name} ×{count} отправлено игроку {to}. Вещь ляжет к нему в дом или в банковскую ячейку."
  # То же для стопок: «стопку» не скажешь «отправлено».
  sentBundle: "📦 Вы передали {what} игроку {to}. Всё ляжет к нему в банковскую ячейку."
  # Стопка в строках о передаче, винительный падеж (см. Transfers.what):
  # «стопку «…»», «2 стопки «…»», «5 стопок «…»», «21 стопку «…»».
  bundle:
    one: "стопку «{name}»"
    count: "{n} {word} «{name}»"
    words: ["стопку", "стопки", "стопок"]
  # Вне города с личным посыльным: вещи — из хранилища Торгового дома, а нет
  # там — с полок дома (home), и только те, что понятны без выбора (см.
  # Transfers.courierSend). В городе — то, чего нет в сумке (city).
  courier:
    sent: "🏃 Посыльный отнёс {what} из вашего хранилища Торгового дома игроку {to}. Вещь ляжет к нему в банковскую ячейку."
    # Руны, травы, отвары, камни — как transfer.sentHome.
    sentHome: "🏃 Посыльный отнёс {what} из вашего хранилища Торгового дома игроку {to}. Вещь ляжет к нему в дом или в банковскую ячейку."
    nothing: "Посыльный ищет вещь в хранилище Торгового дома, а потом дома — на полках верстака травника и в хранилище камней. Ничего похожего на «{query}» он не нашёл. Вещи, что при вас, он не трогает — их можно передать в городе."
    ambiguous: "Посыльный не понял, что нести: в хранилище под «{query}» подходит несколько вещей — {items}. Назовите точнее. А если они одинаковые с виду, в городе заберите нужную из хранилища и передайте из сумки."
    # Нашлось не в хранилище, а дома: {from} — с какой полки (home.from).
    home:
      sent: "🏃 В хранилище Торгового дома такого не нашлось — посыльный взял {what} {from} у вас дома и отнёс игроку {to}. Вещь ляжет к нему в банковскую ячейку."
      sentHome: "🏃 В хранилище Торгового дома такого не нашлось — посыльный взял {what} {from} у вас дома и отнёс игроку {to}. Вещь ляжет к нему в дом или в банковскую ячейку."
      ambiguous: "Посыльный не понял, что нести: в хранилище Торгового дома такого нет, а дома под «{query}» подходит несколько вещей — {items}. Назовите точнее. А если они одинаковые с виду, в городе заберите нужную из дома и передайте из сумки."
      from:
        herbs: "с полок верстака травника"
        brews: "с полки отваров"
        gems: "из хранилища камней"
    # В городе: вещь — сперва из того, что при герое (сумка, ларец, Живая
    # сумка, шкаф), а нет там — посыльный ищет в
    # хранилище Торгового дома, потом дома (см. Transfers.quickSend). Ключи —
    # как вне города; {from} — transfer.courier.home.from.
    city:
      sent: "🏃 При вас такого не нашлось — посыльный отнёс {what} из вашего хранилища Торгового дома игроку {to}. Вещь ляжет к нему в банковскую ячейку."
      sentHome: "🏃 При вас такого не нашлось — посыльный отнёс {what} из вашего хранилища Торгового дома игроку {to}. Вещь ляжет к нему в дом или в банковскую ячейку."
      nothing: "При вас нет ничего похожего на «{query}», и посыльный не нашёл такого ни в хранилище Торгового дома, ни дома — на полках верстака травника и в хранилище камней."
      ambiguous: "Посыльный не понял, что нести: при вас такого нет, а в хранилище под «{query}» подходит несколько вещей — {items}. Назовите точнее. А если они одинаковые с виду, заберите нужную из хранилища и передайте из сумки."
      home:
        sent: "🏃 Ни при вас, ни в хранилище Торгового дома такого не нашлось — посыльный взял {what} {from} у вас дома и отнёс игроку {to}. Вещь ляжет к нему в банковскую ячейку."
        sentHome: "🏃 Ни при вас, ни в хранилище Торгового дома такого не нашлось — посыльный взял {what} {from} у вас дома и отнёс игроку {to}. Вещь ляжет к нему в дом или в банковскую ячейку."
        ambiguous: "Посыльный не понял, что нести: ни при вас, ни в хранилище Торгового дома такого нет, а дома под «{query}» подходит несколько вещей — {items}. Назовите точнее. А если они одинаковые с виду, заберите нужную из дома и передайте из сумки."
  # Письмо получателю, как только вещь легла: notice + где она + (если с неё
  # пошёл срок почты) noticeShelf. Пока на почте что-то лежит, срок не пишем.
  notice: "📦 {from} передал(а) вам: {what}."
  noticeVault: " Уже в вашей банковской ячейке."
  noticeMail: " Ждёт на почте Торгового дома."
  noticeSplit: " В банковскую ячейку легло {vault}, остальное ({mail}) ждёт на почте Торгового дома."
  noticeShelf: " Заберите в течение 7 дней, иначе всё, что лежит на почте, сгорит."
  # Часть (или всё) легло прямо в дом получателя (см. HomeIntake) — вместо
  # noticeVault/noticeMail/noticeSplit. Места — parcel.places: noticeHome —
  # «где лежит» (at), остальные — «куда легло» (to).
  noticeHome: " Всё уже в вашем доме: {places}."
  noticeHomeVault: " В дом легло {home} ({places}), остальное ({vault}) — в банковскую ячейку."
  noticeHomeMail: " В дом легло {home} ({places}), остальное ({mail}) ждёт на почте Торгового дома."
  noticeHomeSplit: " В дом легло {home} ({places}), в банковскую ячейку — {vault}, остальное ({mail}) ждёт на почте Торгового дома."
  announce: "📦 Игрок {from} передал {what} игроку {to}"
  back: "Возвращаемся к делам."
  someone: "искатель"
  # Деньги из рук в руки: «Передать серебро 100», «Передать дублоны 5».
  money:
    howMuch: "Сколько передать? Напишите сумму — не меньше 50, например: «Передать серебро 100» или «Передать дублоны 50». Комиссия — 10% сверху."
    tooLittle: "Меньше {min} не передать."
    notEnoughSilver: "Не хватает серебра: нужно {need} вместе с комиссией {fee}, а при себе и в ячейке вместе {have}."
    notEnoughDoubloons: "Не хватает дублонов: нужно {need} вместе с комиссией {fee}, а при себе {have}."
    sent: "{money} отправлено игроку {to}. Комиссия — {fee}."
    # Вне города с личным посыльным: серебро — только из ячейки Торгового дома.
    sentByCourier: "🏃 Посыльный отнёс {money} из вашей ячейки Торгового дома игроку {to}. Комиссия — {fee}."
    notEnoughVault: "Посыльный носит серебро только из ячейки Торгового дома: нужно {need} вместе с комиссией {fee}, а в ячейке {have}. Серебро, что при вас, он не трогает."
    noticeVault: "💰 {from} передал(а) вам {money}. Деньги уже в вашей банковской ячейке."
    noticeCity: "💰 {from} передал(а) вам {money}. Рахадим отдаст их вам в руки, как только вы окажетесь в городе."
    noticeHand: "💰 {from} передал(а) вам {money}. Они уже у вас."
    failed: "Передать не вышло — дублоны вернулись к вам."
    announce: "💰 Игрок {from} передал {money} игроку {to}"

# Посылки, которые не разложились сразу при отправке: их раскладывает ход
# игрока или фон через минуту (тогда это письмо). Там же — письмо о сгоревшей
# почте (burned).
parcel:
  delivered: "📦 Вам передали: {items}. Всё убрано в банковскую ячейку."
  # Что легло прямо в дом (см. HomeIntake): руны — на алтарь, травы и
  # отвары — на верстак травника, камни — в хранилище на острове.
  home: "🏠 Вам передали: {items}. Всё уже в вашем доме: {places}."
  # Места в доме для писем о посылках: to — куда легло, at — где лежит.
  places:
    to:
      runes: "на рунический алтарь"
      herbs: "на полки верстака травника"
      brews: "на полку отваров"
      gems: "в хранилище камней"
    at:
      runes: "на руническом алтаре"
      herbs: "на полках верстака травника"
      brews: "на полке отваров"
      gems: "в хранилище камней"
  # Ячейка не приняла, а почта была пуста — с этого момента пошёл срок
  # (Parcels.ShelfDays). Пока на почте что-то лежит, срок не пишем (mailedMore).
  mailed: "📮 На почту Торгового дома пришло: {items}. Заберите в течение 7 дней, иначе всё, что лежит на почте, сгорит."
  mailedMore: "📮 На почту Торгового дома пришло: {items}."
  # Сюжетная экипировка: она на почте не сгорает (см. Item.isStoryGear).
  mailedStory: "📮 На почту Торгового дома пришло: {items}. ★ Сюжетное на почте не сгорает — заберите, когда в сумке будет место."
  burned: "🔥 Срок хранения на почте вышел — всё, что там лежало, сгорело: {items}."
  andMore: " и ещё {count}"

# Стопка одинаковых вещей целиком (см. StackMove): взял или положил одну —
# рядом встаёт «все N»; куб и артефакты выгребаются одной кнопкой.
stack:
  all: "⏬ все {n}"
  takeAll: "⏬ Забрать всё"
  rest: "Не поместилось: {n}."
  # Вещь успела уйти, пока игрок жал кнопку.
  gone: "Этой вещи там уже нет."

mail:
  empty: "На почте для вас ничего нет."
  header: "📮 Почта Торгового дома.\n🎒 Свободно в сумке: {free}"
  burnsIn: "⏳ Через {left} всё, что лежит на почте, сгорит."
  # На почте есть сюжетная экипировка — она не сгорает (см. Item.isStoryGear).
  burnsInStory: "⏳ Через {left} всё, что лежит на почте, кроме сюжетного (★), сгорит."
  line: "📦 {name} — от {from}"
  takeOne: "Забрать {name}"
  takeAll: "Забрать всё, что влезет"
  taken: "{name} у вас в сумке."
  tookAll: "Забрано: {items}"
  back: "Назад"

fet:
  intro: "Лавка Фета занимает дальний угол Торгового дома — тот, где пахнет не бумагами, а маслом и нагретым металлом.\n\nО самом Фете говорят разное. Одни — что он бывший искатель и вынес из лабиринта столько, что хватило бы на три спокойные жизни. Другие — что ему попались рецепты Азата, каких не видели даже в Храме, и он рассудил: торговать чудесами прибыльнее, чем добывать их.\n\nФет не спорит ни с теми, ни с другими. «Смотри, не трогай руками, — говорит он. — Оно само за тобой пойдёт, если сойдёмся в цене.»"
  counter: "На прилавке у Фета — живые артефакты Азата, а с краю, отдельно, четыре тёмные склянки."
  leave: "Назад"
  back: "Назад"
  buyLabel:     "Купить за 🟡 {price}"
  upgradeLabel: "Улучшить за 🟡 {price}"
  stateNone:  "У вас такого нет. Новый артефакт держит {slots} мест."
  stateOwned: "У вас ступень {tier}/{maxTier}: {capacity} мест. Следующая даст {next}."
  stateFull:  "Собран полностью: {capacity} мест. Улучшать больше некуда."
  notEnough:  "Фет разводит руками: нужно 🟡 {price}, а столько у вас не наберётся."
  confirmBuy:     "Взять {title} за 🟡 {price}?"
  confirmUpgrade: "Улучшить {title} за 🟡 {price}?"
  confirmYes: "Договорились"
  confirmNo:  "Не сейчас"
  bought:   "Фет выкладывает {title} на прилавок и подталкивает к вам. Ступень {tier}/{maxTier}, мест внутри: {capacity}."
  # Зелья Фета: выпиваются сразу при покупке (см. FetPotion).
  potionBuyLabel: "Купить и выпить за 🟡 {price}"
  confirmPotion:  "Выпить «{title}» за 🟡 {price}?"
  # Купон на смену расы — игровой предмет: начинает квест смены расы (см. RaceQuestState).
  coupon:
    title: "🎟 Купон на смену расы"
    pitch: "🎟 Купон на смену расы начинает квест смены расы: вы выбираете, кем проснуться, — и история начинается сразу. Купон сгорает в конце квеста, когда вы проснётесь в новом теле. Начать можно только в городе."
    confirm: "Купить купон на смену расы за 🟡 {price}?"
    done: "🎟 Купон на смену расы — в сумке. Откройте его там, когда будете в городе."
  # Купон на смену имени — своя сцена у прилавка; в ход идёт из сумки (см. NameChangeState).
  nameCoupon:
    title: "🎟 Купон на смену имени"
    pitch: "«Имя — та же одёжка, — Фет вертит в пальцах узкий листок. — Износилась — бери новую. Впишешь сюда — и наутро весь город будет звать тебя так, будто иначе и не звал.»\n\n🎟 Купон на смену имени: пишете новое имя — и в Пангее вас зовут так. Купон сгорает, когда имя принято. Сменить имя можно только в городе."
    confirm: "Купить купон на смену имени за 🟡 {price}?"
    done: "🎟 Купон на смену имени — в сумке. Откройте его там, когда будете в городе."
  # Набор успешного искателя: один на игрока, покупка — в журнале событий. Числа
  # в pitch и done — те же, что в FetShopState (PackPriceDoubloons и ниже).
  pack:
    title: "🎁 Набор успешного искателя"
    pitch: "«Лучше этого набора для начинающего искателя ты не найдёшь — ни у меня, ни во всём Кинэте, — Фет ставит на прилавок перевязанный бечёвкой короб. — Сам собирал: оружие на любую руку, склянки на чёрный день, серебро на первые расходы. А сверху договорился с Храмом — Азат приглядит за тобой пять дней. Один такой на искателя, второго не соберу.»\n\nВ наборе:\n• 📦 Живая вода ×5\n• 📦 Шнапс из красавки ×5\n• 📦 Костоправный отвар ×5\n• фиолетовые 5 уровня: двуручное оружие, одноручное оружие, лук и щит\n• 🪙 25 000 серебра\n• 🎖 500 репутации искателей\n• +7 мест в сумке — навсегда\n• ✨ благословение Азата на 5 дней\n\nНабор продаётся один раз."
    confirm: "Взять «Набор успешного искателя» за 🟡 {price}?"
    done: "🎁 Фет пододвигает к вам короб: «Носи с толком.» Оружие и стопки — в сумке, в ней прибавилось 7 мест; 🪙 25 000 серебра — у вас, гильдия записала вам 🎖 500 репутации искателей, а Азат благословил вас на 5 дней."
  # Беспроигрышная лотерея: большие руны случайных узоров (см. FetShopState.drawRunes).
  runes:
    title: "🎲 Беспроигрышная лотерея"
    pitch: "«Беспроигрышная лотерея, — Фет встряхивает холщовый мешок, и внутри глухо стукаются друг о друга рунные камни. — Тянешь три — и все три твои. Какие попадутся, решает мешок, но с пустыми руками от меня ещё никто не уходил.»\n\n🎲 {count} большие руны за 🟡 {price}: узор каждой — случайный, из всех, что бывают. На каждую игру в сумке нужно {count} свободных места. Играть можно до {limit} раз в сутки (по Москве)."
    left: "Сегодня ещё можно сыграть: {left} из {limit}."
    buyLabel: "Тянуть за 🟡 {price}"
    # Все игры, что остались на сегодня, разом.
    buyAllLabel: "Купить до лимита"
    limit: "«На сегодня хватит, — Фет завязывает мешок. — {limit} раз за день, больше не дам: мешку тоже нужен отдых.» Новые игры — после полуночи по Москве."
    noRoom: "Фет придерживает мешок: «Сначала освободи сумку — руны в неё не влезут». Нужно свободных мест: {need}, сейчас: {free}."
    done: "🎲 Вы запускаете руку в мешок и вытягиваете рунные камни:\n{runes}\n\n«Я же говорил — беспроигрышная», — ухмыляется Фет. Руны — в сумке."
  potions:
    expStop:
      title: "🧪 Зелье застоя"
      pitch: "«Выпьешь — и опыт встанет, — Фет постукивает ногтем по склянке. — Ни из боя, ни из задания не прибавится ни капли. Кому-то так и надо: задержаться там, где он есть.» Пока зелье действует, опыт не идёт ниоткуда — пока не выпьете Зелье движения."
      useless: "Опыт у вас и так стоит — второй раз его не остановить."
      done: "❄ Вы выпиваете Зелье застоя. Опыт остановлен: пока не выпьете Зелье движения, он не прибавится."
    expStart:
      title: "🧪 Зелье движения"
      pitch: "«А это — чтобы снова пошло, — Фет ставит склянку рядом с первой. — Застоялся — выпей, и всё вернётся на круги своя.» Снова запускает опыт после Зелья застоя."
      useless: "Опыт у вас и так идёт — запускать нечего."
      done: "🔥 Вы выпиваете Зелье движения. Опыт снова идёт."
    respec:
      title: "🧪 Зелье забвения"
      pitch: "«Забудешь, чему учил своё тело, — и выучишь заново, — Фет щурится. — Что дали зелья и что заслужено делом, останется. Уйдёт только то, что ты вкладывал сам.» Все вложенные очки характеристик возвращаются в свободные — распределите их заново."
      state: "Вложено очков: {points} — все вернутся в свободные."
      useless: "Сбрасывать нечего: вы ещё не вкладывали очки в характеристики."
      done: "🌀 Вы выпиваете Зелье забвения. Свободных очков прибавилось: {points}. Распределить их можно в «Персонаже»."
  # Зелье исчезновения: прячет из рейтингов, по неделе за склянку; склянок —
  # сколько угодно разом, числом в чате (см. FetShopState.showVanish).
  vanish:
    title: "🧪 Зелье исчезновения"
    pitch: "«Любимое зелье королей, — Фет поднимает склянку к свету, и внутри лениво клубится серая муть. — Да и всяких вождей. Проиграл войну, провалил реформу, обещал хлеба, а привёз налоги — выпил, и для толпы под окнами будто исчез: она уже не может вспомнить, чьё имя собиралась выкрикивать.\n\nТолько туман этот недолгий: неделя — и рассеялся. И чем громче имя, тем он жиже. Потому короли берут не склянку, а ящик. Иные — целый обоз.»\n\nОдна склянка прячет вас из всех рейтингов на {days} дней, каждая следующая добавляет ещё {days}. Можно взять сразу партию: напишите, сколько склянок."
    state: "🌫 Туман ещё держится: рейтинги не видят вас ещё {left}."
    confirmOne:  "Выпить «{title}» за 🟡 {price}? Туман продержится {left}."
    confirmMany: "Выпить «{title}» ×{count} за 🟡 {price}? Туман продержится {left}."
    done: "🌫 Склянок выпито: {count}. Имя ваше подёргивается туманом — рейтинги не увидят вас {left}."
    badCount: "«Сколько склянок? — переспрашивает Фет. — Числом, и хотя бы одну.»"
    # Развеять туман раньше срока — даром, но выпитое не возвращается.
    liftLabel: "🌤 Развеять туман"
    liftConfirm: "«Передумал прятаться? — Фет достаёт пузырёк с прозрачной жидкостью. — Капля этого — и туман сойдёт. Денег не возьму, но и за выпитое не верну.» Туман продержался бы ещё {left}. Развеять?"
    liftYes: "🌤 Развеять"
    lifted: "🌤 Туман рассеялся: рейтинги снова вас видят."
  upgraded: "Фет колдует над артефактом добрую минуту. {title}: ступень {tier}/{maxTier}, мест внутри: {capacity}."

