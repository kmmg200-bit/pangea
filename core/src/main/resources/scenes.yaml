    # Травы в Живой сумке — своим списком и своей кнопкой (отвары остаются в ней).
    # Когда трава есть и там, и в сумке, обычная кнопка подписана «из сумки».
    livingHeader: "Из Живой сумки:"
    sellBag: "Сдать из сумки за {total} 🪙"
    sellLiving: "Сдать из Живой сумки за {total} 🪙"
