  returnedSilver: "И серебро — 🪙 {silver}."
  reworked: "Гоблины успели поработать: вещи из наборов перешиты на их лад — шипы, ремешки, лишние карманы. Теперь это вещи набора «Пройдоха»: {items}."
  reward: "В мешке у банды нашлось и чужое серебро: 🪙 +{silver}."

# Побочная линия Барти — дурачка-осведомителя, которого герой знает по прошлой
# жизни (см. HotGoodsQuest, BigDealQuest).
barti:
  taken: "📜 Новое задание: «{title}»\n{step}"
  # «Ходовой товар» (задание 3-го уровня): встреча у изгороди — наугад, с 4-го уровня героя.
  meet:
    text: |
      Из-за поворота доносится крик — не предсмертный, скорее обиженный:

      «Эй! Это мой шалфей! Я первый его нашёл!»

      У изгороди, вцепившись в мешок с травой, пятится тощий человек в кафтане не по размеру. На него наступают два зверя — им, похоже, всё равно, кто первым нашёл шалфей.

      Я знаю этот кафтан. И эту привычку спорить с теми, с кем спорить нельзя. Барти.
    fightLabel: "Спасти Барти"
    passLabel: "Пройти мимо"
    passed: "Не сегодня. Барти всегда выкручивался сам — выкрутится и теперь."
    fightStart: "Барти ныряет мне за спину с проворством, которого от него не ждёшь: «Вот! Вот это я понимаю — деловой подход!»"
    death: "Вы приходите в себя у изгороди. Ни зверей, ни Барти — только рассыпанный шалфей. Такие, как он, в лабиринте не пропадают: ещё встретитесь."
    talk: |
      Барти вытирает лоб рукавом и пересчитывает в мешке травинки — все ли целы.

      «Бартоломью, — он протягивает мне руку, липкую от шалфея. — Для друзей — Барти. А мы ведь подружимся! Вот это удар — сразу видно человека с головой и с руками. Слушай, ты ведь недавно в Кинэте? Не спорь, по глазам вижу: смотришь на город, как на чужой кошелёк. И правильно!

      Запомни, что я скажу: в Кинэте любой грамотный и способный человек раскрутится быстрее, чем Трактирщик разбавит пиво. Я вот, например, раскручиваюсь. Который год уже.»

      Он меня не узнаёт: того лица больше нет. Мы ходили с ним на дела — он болтал, я делал. Он и тогда был не из Братства, и все это знали. В Братстве про Барти говорили одно: уберём, когда захотим. И ни разу не захотели — на него было жалко ножа.
    plan: |
      «Так вот. Ходовой товар — живая вода и шнапс из красавки. Живую воду искатели берут ящиками: заправить флягу посреди лабиринта — это тебе не к жрецу бегать. А шнапс Трактирщик берёт по четыреста серебра за бутылку и не спрашивает, из чего гнали.

      Живая вода — шалфей, ромашка, крапива. Шнапс — красавка, полынь, календула. Три травы в куб — и готово.

      Только куб нужен свой, как у настоящих алхимиков. Без своего куба ты не делец, а покупатель. Обзаведись — и сразу вари. А потом я тебя сам найду: я всех нахожу.»

      Он суёт мне листок, исписанный так, будто перо удирало от погони.

      Дурак он, конечно. Но в Кинэте дураки иногда знают, где лежат деньги.
    onwardLabel: "Дальше"
    gone: "У изгороди тихо — только ветер шевелит листья."
  # Вторая встреча: куб есть и по склянке товара в сумке — Барти сам находит героя.
  again:
    text: |
      «Эй! Делец!» — Барти машет мне из-за поворота так, будто мы договорились о встрече. Мешок у него за плечом пустой, кафтан новый — и опять не по размеру.

      Он заглядывает в мою сумку без спроса, как в свою.

      «Живая вода! Шнапс! Я же говорил — человек с головой. Я в людях не ошибаюсь. Ну, почти.

      Вот что: заходи ко мне на Торговую площадь. У меня там дом. Есть дело на двоих — а нас с тобой как раз двое.»

