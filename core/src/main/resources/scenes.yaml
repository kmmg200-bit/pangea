  noCharges: "Магия кончилась. Жрец Азата пополнит заряды за {cost} серебра."
  casket:
    title: "💠 Ларец Азата"
    pitch: "Один из самых ходовых моих товаров. Летает вокруг хозяина и глотает драгоценные камни сам, без просьб — только успевай подбирать добычу. Понадобился камень? Поймал, залез ему в пасть и забрал обратно.\n\nА надавишь на камень в крышке — Магия Азата возьмёт три одинаковых камня и сплавит их в один, категорией выше. В странствиях штука дюже полезная: и руки свободны, и сумка не трещит по швам.\n\nКстати, артефакт сборный. Будут ещё дублоны — с радостью улучшу, станет вместительнее. И цепче: с каждым улучшением на 3% меньше шанс, что, если тебя убьют, камни из него растащат."
    notOwned: "Ларца у вас нет — его держит Фет в Торговом доме."
    empty: "Ларец пуст: ни камешка."
    full: "Ларец полон — больше не проглотит."
    nothingToPut: "В сумке нет камней, которые ларец взял бы себе."
    magicLabel: "Камень на крышке"
    magicDone: "Ларец вздрагивает, и камни внутри оплывают друг в друга. Превращений: {count}."
    magicNothing: "Камень на крышке тускло мигает: трёх одинаковых камней внутри не нашлось."
  bag:
    title: "🌿 Живая сумка"
    pitch: "Очень удобная сумка травника, сшитая из «живой» плоти. Места почти не занимает, а держит в себе целые охапки трав и хранит отвары такими же тёплыми и свежими, какими их сварили. Оттого ею и не брезгуют ни травники, ни аптекари.\n\nИз минусов: ощущения, когда лезешь внутрь, приятными не назовёшь, да иные впечатлительные особы отказываются брать травы и отвары «вот из этого».\n\nНа лбу у сумки кристалл. Надавишь — Магия Азата попробует сварить отвар из того, что внутри. А если кормить её особым раствором, сумка подрастёт и станет вместительнее; будут дублоны — сделаю это за тебя. Подросшая и держит своё крепче: с каждым ростом на 3% меньше шанс, что, если тебя убьют, из неё что-то пропадёт."
    notOwned: "Живой сумки у вас нет — её держит Фет в Торговом доме."
    empty: "Внутри пусто и, кажется, немного обиженно."
    full: "Сумка раздулась и больше не принимает."
    nothingToPut: "В сумке нет ни трав, ни отваров, которые она взяла бы себе."
    magicLabel: "Кристалл на лбу"
    magicDone: "Сумка тихо булькает. Сварено отваров: {count}."
    magicNothing: "Кристалл мигает и гаснет: трав на целый отвар внутри не набралось."
  wardrobe:
    title: "🚪 Миниатюрный шкаф"
    pitch: "Маленький шкаф на серебряной цепочке. Сожми его пальцами — начнёт расти; отпустишь — снова брелок. Вещица с виду совершенно непримечательная, а в странствиях цены ей нет.\n\nВо-первых, всё, что внутри, уменьшается вместе с ним и качеств своих не теряет. Во-вторых, ни один человек, не знающий про такие шкафы, не подумает отбирать у тебя брелок — что бы с тобой ни случилось, добро останется при тебе.\n\nОдна беда: вместимость у этой магической приблуды никудышная, а чтобы её раздвинуть, уходит уйма магического дерева. Будут дублоны — найду и дерево."
    notOwned: "Шкафа у вас нет — его держит Фет в Торговом доме."
    empty: "В шкафу пусто: одни пустые полки."
    full: "Полки заняты — больше в шкаф не влезет."
    nothingToPut: "В сумке нет вещей, которые шкаф взял бы себе: он держит только то, что занимает место."

