# «Деревня Мурлоков»: после двухсотого убитого к герою выходит старейшина Мрачноглаз,
# карта в сумке ведёт к развилке — налёт на деревню или помощь снаряжением.
# Ключи с хвостом Kin — реплики для героя-мурлока (см. MurlocQuest.key).
murlocVillage:
  questDone: "📜 Квест «Деревня Мурлоков» завершён."
  toCity: "В город"
  elder:
    meet: "Из-за поворота, шлёпая по луже, к вам выходит мурлок. Старый: чешуя на морде выцвела до цвета мокрого пепла, левый глаз затянут мутной плёнкой, тёмной, как вода в омуте, на шее — ожерелье из рыбьих позвонков и одной столовой ложки. Но главное — штаны. Штаны на нём причудливые: сшиты из лоскутов парусины и чьего-то знамени, штанины разной длины, на каждой по колокольчику, а подпоясаны обрывком якорной цепи. Он смотрит на вас так, будто это вы здесь странно одеты.\n\n«Мрргл. Ты — тот, кто убил сотню. Я считал. Мы все считаем.»"
    meetKin: "Из-за поворота, шлёпая по луже, к вам выходит мурлок. Старый: чешуя на морде выцвела до цвета мокрого пепла, левый глаз затянут мутной плёнкой, тёмной, как вода в омуте, на шее — ожерелье из рыбьих позвонков и одной столовой ложки. Но главное — штаны. Штаны на нём причудливые: сшиты из лоскутов парусины и чьего-то знамени, штанины разной длины, на каждой по колокольчику, а подпоясаны обрывком якорной цепи. Он смотрит на вас — и мутный глаз вдруг светлеет.\n\n«Мрргл! Свой! Чешуя наша, глаза наши — а ходишь с сухими и бьёшь, как сухой. Сотню положил. Я считал. Мы все считаем — и гордимся, хоть ты о нас и не знал.»"
    whoLabel: "Кто ты такой?"
    whoLabelKin: "Кто ты?"
    who: "«Мрачноглаз. Старейшина. Мои живут за городом, у воды, там, где дорога кончается. Раньше нас не трогали: мурлок бедный, у мурлока только рыба. Теперь приходят. С той стороны, из-за холмов, с железом. Забирают сети, забирают молодых. Мы бьёмся чем есть — острогами и злостью. Злости много. Железа нет.»"
    whoKin: "«Мрачноглаз. Старейшина. Твоей крови — даже если портал вынес тебя без памяти. Мои живут за городом, у воды, там, где дорога кончается. Раньше нас не трогали: мурлок бедный, у мурлока только рыба. Теперь приходят. С той стороны, из-за холмов, с железом. Забирают сети, забирают молодых. Мы бьёмся чем есть — острогами и злостью. Злости много. Железа нет.»"
    whatLabel: "Чего ты хочешь от меня?"
    whatLabelKin: "Чего ты хочешь от меня?"
    what: "«Ты убиваешь много. После каждого у тебя остаётся железо — мечи, кирасы, чем там сухие друг друга бьют. Тебе оно — продать за пригоршню серебра. Нам — жить. Принеси снаряжение в деревню. Двадцати хватит, чтобы каждый, кто стоит в первом ряду, стоял в железе.»"
    whatKin: "«Ты убиваешь много. После каждого у тебя остаётся железо — мечи, кирасы, чем там сухие друг друга бьют. Принеси его в деревню — не как чужой, как свой. Двадцати хватит, чтобы у каждого в первом ряду было то, чего не было у твоих отцов.»"
    whereLabel: "Как вас найти?"
    whereLabelKin: "Как вас найти?"
    where: "«Просто. Выйдешь из ворот Кинэта — иди по дороге на закат, пока не увидишь сломанный столб с гнездом наверху. У столба сверни к реке. Дальше вниз по течению, до трёх камней, что торчат из воды, как зубы. За камнями тростник, за тростником — мы. Если из тростника на тебя глядит сорок глаз — дошёл. Скажи, что от меня.»"
    whereKin: "«Просто. Выйдешь из ворот Кинэта — иди по дороге на закат, пока не увидишь сломанный столб с гнездом наверху. У столба сверни к реке. Дальше вниз по течению, до трёх камней, что торчат из воды, как зубы. За камнями тростник, за тростником — мы. Если из тростника на тебя глядит сорок глаз — дошёл. Они тебя и так узнают.»"
    agreeLabel: "Ну… может, занесу."
    agreeLabelKin: "Ну… занесу, наверное."
    agree: "«Ну… если буду в тех краях — занесу. Обещать не стану.»\n\n«Мрргл. „Если“ — это уже больше, чем нам давали за всю жизнь.»\n\nОн суёт вам в руку кусок рыбьей кожи с нацарапанными каракулями и, звеня колокольчиками, уходит обратно в темноту."
    agreeKin: "«Ну… занесу, наверное. Если по пути.»\n\n«Мрргл. Свои так и говорят — „наверное“. А потом приходят.»\n\nОн суёт вам в лапу кусок рыбьей кожи с нацарапанными каракулями и, звеня колокольчиками, уходит обратно в темноту."
