    label: "Уйти"
    color: "negative"
  ratKingLoreNoSilver: "Столько серебра у тебя нет. Возвращайся, когда наскребёшь."
  ratKingLoreDone: "Надеюсь это стоило моего серебра."
  ratKingLoreText: |
    Крысиный король.
    Портовые грузчики клянутся, что первый такой завёлся в трюме зерновоза: пока корабль шёл к Кинэту, он съел всё зерно, а заодно и половину команды. Байки, конечно. Но то, что сидит сейчас под городом, — уже не байка.
    Это не одна крыса. Когда в одной норе крыс становится слишком много, а еды слишком мало, они сплетаются хвостами в один узел и больше не могут разойтись. Так и живут — одним комом, с одним голодом на всех. Чем больше ком, тем он хитрее и тем больше у него глаз.
    Сам он бьёт слабо. Беда в другом: на его писк из всех труб лезет мелочь, а когда его прижмут, он пожирает своих же и растёт прямо у тебя на глазах. Не давай ему собирать стаю — бей тех, кого он позвал, раньше, чем он успеет их проглотить.
    И не надейся свалить его одним ударом. Ком теряет крыс по одной: сколько ни вкладывай в удар, больше пятой части себя за раз он не отдаст. Тут нужно терпение, а не сила.
    Каждая рана от его зубов гноится, так что возьми с собой то, что снимает яд. Огонь его берёт, как и всякую шерсть, а вот какой стихией ни бей — ему всё одно.
    Если одолеешь — собери его кровь. Она не растекается, а сворачивается в шар, будто хочет снова стать одним целым. Ришелье платит за неё золотом, а хороший мастер, говорят, сделает из неё такое, что крысы начнут выскакивать у тебя из-под ног — и считать тебя своим.
  necroLoreLabel: "Что ты знаешь о Некроманте?"
  necroLoreText: |
    Трактирщик перестаёт тереть кружку и какое-то время молча смотрит в стол.
    — Некромант… Злая это сила и нечистая. Про волков да элементалей я тебе за серебро расскажу, а тут мало чем помогу — и денег с тебя не возьму. Сходи-ка ты с этим к жрецу в храм Азата. Мёртвые — это по его части, не по моей.
  necroLoreDone: "Схожу к жрецу"
  sellSchnappsLabel: "Продать выпивку ({count} шт)"
  schnappsSold: "Трактирщик пробует, крякает и лезет за кошелём. Сдано бутылок: {count} — получено 🪙 {silver} серебра."
  wolfLoreNoSilver: "Столько серебра у тебя нет. Возвращайся, когда наскребёшь."
  wolfLoreDone: "Надеюсь это стоило моего серебра."
  wolfLoreText: |
    Белые волки.
    Здесь их зовут по-разному: кто «снежными тенями», кто «белой смертью», а старики из гильдии — просто «хозяевами». Ашалдарон писал, что волки жили в лабиринте задолго до того, как в него стали попадать искатели. Для нас он ловушка, для них — дом и угодья.
    Шкура у них белая, как первый снег. Казалось бы, на сером камне такого зверя видно за сотню шагов. Но нет. Шерсть белого волка гасит свет, и в полумраке лабиринта он растворяется уже в нескольких шагах от тебя. Не один искатель клялся, что стоял на пустой поляне — а через миг чувствовал дыхание на затылке.
    Они не караулят у входа и не рыщут по коридорам. Они ждут. Поляны с цветами — их любимые места: там тихо, там пахнет травой, и там искатель наклоняется за цветком и на миг перестаёт смотреть по сторонам. Этого мига волку хватает.
    Если он всё-таки достал тебя — не ищи в нём слабого места. Стихии ему безразличны. Зато он зверь из плоти и крови, и кровь эта течёт охотно: яд и рваные раны берут его лучше любого клинка. Помни, что первый его укус — самый страшный, и берегись его пасти, когда сам уже еле стоишь: он чует слабость и смыкает челюсти там, где ты слабее всего.
    А если тебе повезёт снять с него шкуру целой — не продавай её. Хороший мастер сошьёт из неё то, что сделает тебя охотником, а не добычей.

