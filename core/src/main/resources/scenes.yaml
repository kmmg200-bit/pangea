# «Письмо Марисе»: письмо с семьдесят пятого убитого, поиски адресата, тайник
# Кельвина и коллектор. Сцены: инвентарь (письмо, карта), Трактирщик, Жрец,
# MarisaSearchState (Долорес и Мариса), MarisaHuntState (тайник и коллектор).
marisa:
  letterFound: "Вы заметили старое заляпанное кровью письмо. На нём восковая печать с символом монеты, а также адресат — некая Мариса Кальдера, проживающая в городе Кинэт. Письмо очень лёгкое и пожелтевшее, однако удивительно, что его никто не вскрыл. Возможно, стоит поискать адресата или же вскрыть самому?"
  questItemAdded: "📜 Добавлен квестовый предмет «{item}»."
  questDone: "📜 Квест «Письмо Марисе» завершён."
  achievement: "🏆 Вы получили достижение «{title}». {bonus}."
  difficulty: "Сложность: {difficulty}"
  letterHint: "Возможно, Трактирщик знает её?"
  openLetterLabel: "Вскрыть письмо"
  readLetterLabel: "Перечитать письмо"
  letterText: |
    Моя дорогая Мариса,

    Пишу тебе с сердца, наполненного надеждой и любовью, чтобы поведать о своих намерениях. Оставил я часть своих сокровищ для погашения моих долгов — прошу простить за мои тревоги и заботы, но я верю, что это шаг к нашему светлому будущему. Путь к этому сокровищу я написал на обратной стороне письма. Используй его, если меня долго не будет, дабы погасить долг перед Ришелье.

    Я отправляюсь в морское плавание, которое обещает быть выгодным и надёжным. Надеюсь, что волны и ветры приведут меня к богатствам, достойным наших мечтаний. Верю, что вскоре вернусь с достатком, чтобы обеспечить нам дом, о котором мы так долго мечтали, и заложить основу для нашей счастливой и долгой жизни.

    Представляю, как мы купим уютный дом на холме, где в вине и смехе будет звучать наш с тобой смех, а дети будут играть на светлом дворе. Всё, о чём мы мечтали, станет реальностью — лишь немного терпения и веры.

    Держи меня в своих мыслях, моя любовь, а я обещаю вернуться к тебе богаче, чем когда-либо мечтал. Пусть наши сердца плывут по морю, как корабли под парусами, ведущие нас к светлому будущему.

    Со всей любовью и верой, твой навеки,
    Кельвин
  mapUseLabel: "Отправиться по карте"
  mapOnlyInCity: "По этой карте можно отправиться только из города."
  mapTakeMarisa:
    text: "Мариса ждёт вас в доме Долорес. Взять её с собой?"
    choices:
      MapWithMarisa:
        label: "Да, зайти за ней"
        color: "positive"
      MapAlone:
        label: "Нет, пойти одному"
        color: "negative"
  innkeeper:
    askLabel: "Спросить о Марисе"
    answer:
      text: "«Мариса уже два года почти не появляется в городе. После известия о гибели мужа она будто исчезла, избегая людских глаз. Однако её имя до сих пор на слуху, и некоторые мужчины продолжают ей интересоваться. Можно было бы подумать, что она занялась чем-то непристойным и потому скрывается, но я уверен: Мариса была благочестивой, много времени проводила в храме, а потому едва ли может быть в таком замешана.»"
      choices:
        ContinueSearch: "Нужно продолжать поиски."
    farewell: "«Ну, удачи тебе!»"
  priest:
    askLabel: "Спросить о Марисе"
    answer:
      text: "«Мариса Кальдера давно покинула город, лишь изредка появляясь в нём, и даже не заходит ко мне. Всего пару лет назад она была у меня чуть ли не ежедневно, молясь о здоровье своего мужа. Видимо, его смерть подкосила её веру. Однако в городе есть её подруга, Долорес Моньо, возможно, она сможет тебе помочь. Её дом находится в Портовом квартале.»"
      choices:
        SearchDolores: "Отправиться на поиски Долорес Моньо"
  search:
    dolores:
      text: "Поспрашивав местных, вы вышли на дом Долорес. Однако она встретила вас холодно, не открывая дверь с защёлки.\n\n«Кто вы такой и что вам нужно?»"
      choices:
        FoundLetter: "Я нашёл письмо…"
    letter:
      text: "«Я нашёл письмо, адресованное Марисе Кальдере. Говорят, вы её подруга, не могли бы вы передать ей?»\n\nОна протягивает руку и берёт письмо, дверь закрывается.\n\nСпустя примерно пять минут дверь открывается, приглашая вас пройти внутрь. Внутри вы видите ещё одну женщину в рваной и грязной одежде."
      choices:
        AskMarisa: "Мариса?"
    marisa:
      text: "Вы замечаете, как эта женщина плачет.\n\n«Вы… вы нашли письмо от моего покойного мужа, который умер два года назад… Оказывается, он не бросил меня с долгами, как я думала всё это время, а, похоже, погиб в морском походе… У него всё это время был тайник рядом с городом, и в этом письме есть его карта, однако сама я, боюсь, дотуда не дойду. Не могли бы вы сопроводить меня?»"
      choices:
        Agree: "Да."
    agree:
      text: "«Хорошо, в таком случае я буду ждать вас в этом доме. Как соберётесь, пожалуйста, можете зайти за мной. В письме карта… я, пожалуй, оставлю её вам, а то если меня найдут, я никогда не узнаю, что там оставил мне мой муж…»"
      choices:
        Promise: "Хорошо, я зайду за вами."
    alone: "Я могу пойти один и забрать всё себе, а могу пойти вместе с ней — так было бы честнее…"
  hunt:
    enter: "Вы идёте за город по карте Кельвина. До тайника примерно {duration}."
    wait: "До тайника ещё {remaining}."
    thanksForHonesty: "«Благодарю, что не обманули меня… Надеюсь, всё будет хорошо.»"
    cache: "Кельвин не соврал: вы действительно нашли старый склад с 17 000 серебра и 120 дублонами, а также камнями — повреждённые рубин, изумруд, топаз, сапфир и череп — и кое-чем из снаряжения. Карта Кельвина своё отслужила — больше она не нужна."
    collector: "Однако прямо после этого на вас вышел вооружённый мужчина.\n\n«А вот и тайник, приятель! Я знал, что этот хрыч спрятал тут деньги, но не знал, где именно. Когда я увидел, как ты шёл сюда по карте, то сразу всё понял! Кельвин должен моему нанимателю с учётом прошедшего времени 14 644 серебра и 105 дублонов! Давай их сюда по-хорошему, иначе я заберу всё с твоего бездыханного тела!»"
    collectorWithMarisa: "Однако прямо после этого на вас вышел вооружённый мужчина.\n\n«А вот и тайник, Мариса! Я как увидел тебя в городе с этим хрычом, решил проследить за тобой — и, видимо, не зря! Я знал, что твой покойный муж спрятал тут деньги, но не знал, где именно. Ты должна Ришелье с учётом прошедшего времени 14 644 серебра и 105 дублонов! Давай их сюда по-хорошему, иначе я заберу всё с твоего бездыханного тела!»"
    marisaAdvice: "Мариса: «Отдай ему эти деньги, всё равно я хотела избавиться от долга.»"
    cantPay: "Столько у вас нет — остаётся драться."
    payLabel: "Заплатить 14 644 серебра и 105 дублонов"
    fightLabel:
