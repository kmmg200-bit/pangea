# Задание «Встать на ноги» (см. FirstSteps): пункты и сообщение о том, что оно получено.
firstSteps:
  title: "Встать на ноги"
  taken: "📜 Новое задание: «{title}»\n{objectives}"
  strong: "Окрепнуть — дойти до {lvl} уровня"
  house: "Обзавестись логовом — купить дом"
  city: "Разведать город — выполнить вступительные задания горожан ({done}/{total})"
  # Все пункты выполнены, а дома герой ещё не был (см. FirstStepsQuest).
  goHome: "🏠 Всё сделано — осталось вернуться домой и перевести дух."
  # Задание засчитывается дома: сцена по дому (House.key) и строка doneLine.
  doneLine: "📜 Задание «Встать на ноги» выполнено."
  done:
    cottage: |
      Я закрываю за собой дверь и задвигаю засов. Движение простое, но руки делают его с удовольствием — будто давно этого ждали.

      Две комнаты, печь, стол, кровать с продавленным матрасом. В углах ещё пыль прежнего хозяина, в дальней комнате тлеет рунический алтарь, который мне продали «по ошибке». Немного. Но в Братстве у меня не было и этого: койка в казарме, сундук под койкой и сосед, который считал мои шаги.

      Тело больше не новобранец. Оно держит удар, помнит, куда бить, и не спорит, когда я веду его туда, куда ему не хочется. Город я тоже понял. Горн ведёт учёт всему, что выносят из-за изгороди. Ришелье покупает снятое и не спрашивает, с кого. Густаво поит людей пылью и записывает, у кого вырос хвост. Жрец говорит от имени бога, который может оказаться кем угодно. А Трактирщик продаёт истории — и, похоже, знает больше, чем продаёт.

      Братство молчит. Ни метки на двери, ни знакомого лица в толпе. Это ничего не значит: тишина — их любимый звук. Я сам когда-то её устраивал.

      Я сажусь на скрипучую кровать и впервые за много дней позволяю себе не прислушиваться. Я встал на ноги. Теперь можно оглядеться всерьёз.
    townhouse: |
      Каменный низ, крепкая дверь, свой двор. Я обхожу дом по кругу — привычка: окна, второй выход, место, где удобно стоять тому, кто захочет подойти незаметно. Подойти незаметно здесь неудобно. Хорошо.

      В зале ровно гудит алтарь Азата, как печь зимой. За дверью — маленькая библиотека с пустыми полками. Странная вещь — пустые полки для того, у кого всю жизнь были только ножи. Их хочется чем-нибудь заполнить. Может, однажды заполню.

      Тело окрепло. Я больше не гадаю, выдержит ли оно удар, — выдержит. Теперь гадаю о другом: кто первым захочет это проверить. И город перестал быть толпой. Горн держит учёт, Ришелье скупает снятое, Густаво варит из пыли то, от чего у людей растут когти, жрец служит богу многих имён, а Трактирщик торгует историями и знает больше, чем продаёт. Каждый здесь кому-то платит. Теперь я знаю, кто кому.

      От Братства — ни звука. Ни метки на воротах, ни знакомой походки на улице. Тишина — их любимый звук; я сам учил новобранцев её выдерживать. Но под тишиной всегда кто-то ждёт.

      Я запираю дверь на два оборота и сажусь у холодного камина. Я встал на ноги. Пора смотреть дальше собственного порога.
    island: |
      Ключ поворачивается в замке — и за дверью вместо улицы облака. Остров висит в небе так спокойно, будто так и надо. Внизу ни крыш, ни улиц, ни Кинэта — только облака, а под ними ещё облака. Город отсюда приходится помнить, а не видеть.

      Дом огромный и тихий. Ковры такие толстые, что шаги в них тонут. В камине сам собой занимается огонь, на столе — фрукты, которых я не знаю даже по названию. Кровать под шёлковым пологом, простыни пахнут лавандой, а вода в купальне всегда тёплая, сколько ни жди. Я трогаю всё это осторожно, как чужое оружие: не верится, что оно моё.

      Я никогда не думал, что дойду до такого. Тень Братства спала на голых досках, ела стоя и не помнила, когда в последний раз снимала сапоги. А теперь — шёлк, тишина и окна, в которые некому заглянуть.

      «Вдали от чужих глаз и убийц», — сказала Юнона. Забавно. Убийца теперь живёт здесь сам, а соседи — богачи и легенды из разных гильдий — даже не знают, кого пустили к себе за ограду.

      На мгновение я ловлю себя на мысли: а что, если хватит? Остаться здесь. Забыть Элиаса, Элорина, порох под двором. Пусть Братство ищет того, кого больше нет. Просто жить — впервые в жизни.

      Мысль тёплая, как вода в купальне. И такая же обманчивая. Цитадель тоже стояла высоко, на скале, и там тоже считали, что до них никто не дотянется. Потом под двором вспыхнул порох. Высота не защищает — с неё просто дольше падать. А те, кто воткнул мне нож между рёбер, не станут ждать, пока я налюбуюсь облаками.

      Тело стало сильным — сильнее, чем я был когда-либо в Братстве. Город я понял. Горн ведёт учёт, Ришелье скупает снятое, Густаво мешает стихии в крови подопытных, жрец служит богу, который может оказаться любым ремесленником, а Трактирщик продаёт истории и знает больше, чем говорит. Каждый там, под облаками, кому-то платит. Теперь я знаю, кто кому.

      Братство молчит. Тишина — их любимый звук, и здесь её особенно много. Тем лучше: тишину я слушать умею.

      Я встал на ноги — даже слишком высоко. Месть подождёт до утра. Но только до утра.

# Основная линия (см. StoryLine): главы после «Встать на ноги». Главу ведёт
# предмет в сумке — что делать сейчас, написано на его карточке; первую
# зацепку герой находит сам, каждую следующую — в развязке прежней главы.
story:
  taken: "📜 Новое задание: «{title}»\n{step}"

  # Глава 1 (с 5-го уровня), см. StoryMarkQuest. Ведёт её чёрный плащ.
  storyMark:
    # Первая зацепка: находка у изгороди (StoryCloakState).
    cloak:
      found: |
        У корней изгороди лежит чёрный плащ — сложенный аккуратно, как на прилавке. Лабиринт всегда так поступает с вещами тех, кто не вернулся: не хоронит, а раскладывает.

        Сукно хорошее, подкладка шёлковая. На плече — гильдейская метка с номером: плащ уже проходил через учёт. А под меткой, если провести пальцем, прощупывается что-то ещё — пришитое мелким, очень знакомым стежком.

        Плащ я забираю.
      nothing: "У изгороди пусто — только ветер шевелит листья."
      onwardLabel: "Дальше"
    # Карточка плаща: что делать сейчас — по шагу главы.
    card:
      steps:
        - "Гильдейскую метку пришили намертво, поверх чего-то ещё. Спороть её, не испортив того, что под ней, умеет тот, кто делает это каждый день, — Ришелье."
        - "Под споротой меткой — круг, перечёркнутый клинком: так Братство метит снаряжение своих курьеров. А номер на гильдейской метке — чей-то учёт. Чей — скажет Мастер Горн."
        - "Плащ носил Ульф Сорока — его нашли без вещей на пятом повороте. Сорока прятал добычу в тайники у изгороди, и его тайника так никто и не нашёл."
      searchLabel: "🧭 Искать тайник Сороки"
      onlyInLabyrinth: "Тайник Сороки — у изгороди, а не в городе. Искать его можно только в лабиринте."
      tooShallow: "Сорока не прятал добычу ближе {level}-го поворота. Здесь его тайника нет."
    richelieu:
      label: "📌 Показать чёрный плащ"
      text: |
        Ришелье берёт плащ двумя пальцами, переворачивает и хмыкает.

        «Гильдейская. Спорю за минуту — по привычке.» Нож проходит под стежками, метка падает на прилавок. Ришелье замирает. «А вот это интересно. Под ней — вторая. Пришита изнутри, мелким стежком, чтобы снаружи было не видно. Я знаю все метки в Кинэте. Эту — нет.»

        На подкладке — круг, перечёркнутый клинком.

        Я её знаю. Так Братство метит снаряжение своих курьеров: снаружи — чужая метка, для чужих глаз, внутри — своя. Я сам пришивал такие. Не раз.

        «Ты смотришь на неё так, будто она тебе должна, — Ришелье щурится и возвращает плащ вместе с меткой. — Я не спрашиваю. Но номер на гильдейской метке — чей-то учёт. Кто носил этот плащ, записано у Горна.»
    horn:
      label: "📌 Показать гильдейскую метку"
      text: |
        Горн берёт споротую метку и, не поднимая глаз, сверяет номер с толстой книгой учёта.

        «Ульф Сорока. Внёс этот плащ в учёт шесть дней назад — снял с кого-то на пятом повороте и носил сам. А позавчера я закрыл и его учёт. Нашли там же, у изгороди. Без вещей.»

        Он захлопывает книгу.

        «Сорока не любил таскать. Прятал добычу в тайники у изгороди и возвращался за ней потом. Его тайника никто не нашёл. Найдёшь — не обижусь. Только помни: то, что встретило Сороку, никуда оттуда не делось.»
    cache:
      lair: |
        Сорока прятал хорошо: не будь у корней изгороди примятой травы, вы прошли бы мимо. Под дёрном — ящик, крышка цела.

        Но вы здесь не первый. Из-за поворота выходят трое зверей, и на каждом тускло тлеет метка — та, которой тьма метит своих. Похоже, Сороку встретили именно они. И уходить от ящика они не собираются.
      fightLabel: "Отбить тайник"
      leaveLabel: "Уйти"
      onwardLabel: "Дальше"
      fightStart: "Меченые не торгуются. Они просто идут на вас."
      gone: "Тайник Сороки пуст: вы его уже нашли. У изгороди тихо."
      opened: |
        Под крышкой — заначка Сороки: монеты, завязанные в тряпицу. И то, из-за чего его, похоже, и не стало, — вощёный футляр курьера. Сорока снял его с того, кто лёг на пятом повороте раньше него, вместе с плащом — и вряд ли понял, что взял.

        Плащ своё отслужил — остаётся в ящике. А в футляре — листок. Шифр, которому меня учили, когда я был моложе этого тела.
      # Мысль над подписью «Э.» — о том, кто из двоих пережил пролог (StoryLine.survivors).
      signedElorin: |
        Э. — значит, Элорин. Элиаса нет: я стёр его сам, когда проснулся в его теле. Пишет казначей — ровно, без единой кляксы, как в ведомости.

        «Нужен живым». В прошлый раз я был им нужен мёртвым. Что-то изменилось, и это нравится мне меньше, чем нож между рёбер.
      signedElias: |
        Э. — значит, Элиас. Элорина нет: его кабинет я занял сам. Пишет напарник — тот, что сказал «прости, брат». Буквы пляшут, будто писал на колене.

        «Нужен живым». В прошлый раз я был им нужен мёртвым. Что-то изменилось, и это нравится мне меньше, чем нож между рёбер.
      signedBoth: |
        Э. Элиас или Элорин? Взрыв пережили оба, и подписываются оба одной буквой. Только пишут по-разному: один — как бухгалтер, другой — как мясник. А этот листок будто писали вдвоём.

        «Нужен живым». В прошлый раз я был им нужен мёртвым. Что-то изменилось, и это нравится мне меньше, чем нож между рёбер.
      reward: "🪙 +{silver} — заначка Сороки. {exp}"
      death: "Вы приходите в себя у изгороди. Тайник Сороки так и лежит под дёрном — и меченые звери никуда от него не ушли. Плащ при вас: он выведет к тайнику снова."
    # Шифровка, прочитанная: в сцене тайника и на карточке шифровки — зацепке следующей главы.
    cipher: |
      «Груз пойдёт через порт: склад у причала, где пахнет дёгтем. Смотритель проверит печать.
      Если в городе объявится отмеченный — не трогать. Нужен живым.
      — Э.»
    questDone: "📜 Квест «Метка под меткой» завершён."

  # Глава 2 (задание 9-го уровня), см. StoryPowderQuest. Ведёт шифровка; берётся в конце главы 1.
  storyPowder:
    wardenName: "Смотритель"
    # Карточка шифровки — после главы 1. «Рано» не говорим: сложность — на карточке.
    card:
      ready: "Пора наведаться в порт. Печать на воске футляра цела — для Смотрителя сойдёт. А что будет, когда он посмотрит мне в лицо, — увидим."
      goLabel: "⚓ Идти в порт"
      onlyInCity: "В порт — из города. Отсюда до причала не дойти."
    warehouse:
      door: |
        Портовый квартал ночью пахнет рыбой, смолой и чужими делами. Дёготь я нахожу по запаху, как и думал: низкий склад у самого причала, на двери — ни метки, ни замка, только щель для глаз.

        — Печать, — говорят из щели.

        Я подношу к ней футляр. Воск с оттиском Братства — пропуск надёжнее любого слова. Дверь открывается.

        Внутри — бочки. Ряд за рядом, до самой крыши, и все пахнут одинаково. Порох. Столько, что хватит поднять на воздух полпорта — или одну цитадель на скале.

        Смотритель — сухой старик в кожаном фартуке — разглядывает меня дольше, чем следует.

        — Печать та, — говорит он. — Курьер не тот. Того я знал в лицо.

        Из-за бочек выходят трое. Не новобранцы: эти держат ножи так, как когда-то учил держать я.
      fightLabel: "Драться"
      leaveLabel: "Уйти"
      fightStart: "Смотритель отступает к бочкам и свистит. Драка будет тихой: шуметь среди пороха не любит никто."
      gone: "Дегтярный склад пуст и заперт. Здесь вам больше нечего делать."
      death: "Вы приходите в себя в Портовом квартале, у причала. Склад заперт, Смотритель на месте. Шифровка с печатью при вас — можно вернуться."
    # Судьба Смотрителя — развилка главы (исход идёт в подсчёт «как и вы»).
    fate:
      text: |
        Люди Смотрителя лежат между бочек. Сам он сидит на полу, прижимая к груди разбитую руку, и смотрит не на меня, а на мою грудь — туда, где под рубахой тлеет Клеймо.

        — Значит, это ты, — шепчет он. — Нам велели ждать отмеченного. Не трогать. Живым… Я старик. Порох не мой, я его только стерегу. Для кого — не знаю, клянусь.

        Врёт он или нет, а бумаги в фартуке он прижимает локтем так, будто они могут его спасти.
      killLabel: "🗡 Добить"
      releaseLabel: "🚪 Отпустить"
      handLabel: "⚖ Сдать совету"
      killed: |
        Я делаю то, чему учил других: тихо, быстро, без лишней крови на бумагах. Смотритель не успевает понять, что разговор кончился.

        Братство учило не оставлять свидетелей. Похоже, я всё ещё хороший ученик. Не знаю, радоваться этому или нет.
      released: |
        — Уходи, — говорю я. — Сегодня же. Первым кораблём.

        Он не верит, потом верит — и уходит, придерживая руку, не оглядываясь.

        Братство не прощает тех, кто проговорился. Если он умный — его больше никто не увидит. Если нет — увидят, но уже не живым. Это теперь его забота, а не моя.
      handed: |
        Я отвожу его к посту стражи у ратуши. Через час приходит человек из совета: ничего не спрашивает, только записывает — имя, склад, число бочек.

        Смотритель на прощание смотрит на меня так, будто я сделал с ним что-то хуже смерти. Может, и сделал: Братство достанет его и за решёткой — если совет не успеет раньше.
    # Следующая зацепка — набросок узора; одна на все три исхода.
    sketch: |
      В бумагах из фартука — накладные, счета, ничего интересного. Кроме одного листа.

      Углём, торопливо, кто-то срисовал узор. Мой узор — тот, что горит у меня на груди. Внизу приписка: «Отмеченный. Брать живым».

      Значит, они знают не только лицо, которого у меня больше нет. Они знают то, что не меняется вместе с лицами.
    reward: "🪙 +{silver} — касса Смотрителя. {exp}"
    questDone: "📜 Квест «Порох у причала» завершён."

  # Глава 3 (задание 13-го уровня), см. StoryBrandQuest. Ведёт набросок узора.
  storyBrand:
    card:
      ready: "Узоры читает Казимир в Гильдии искателей. Покажу лист ему."
      steps:
        - "Узоры читает Казимир в Гильдии искателей. Покажу лист ему."
        - "Казимир сказал: это не руна — это по части богов. Спросить жреца в храме Азата."
        - "Жрец назвал таких, как я, отмеченными и послал к Юноне: совет записывает всех, кто попадает в Кинэт не по-людски."
        - "Юнона назвала имя — Сойка. Сидит в таверне за дальним столом, среди наёмников. Если она меня ещё не нашла, значит, ждёт, пока я найду её."
      # Шаги 1–3, когда собеседник уже назвал цену разговора (StoryBrandQuest.priced).
      priced:
        - "Казимир прочтёт узор, но не даром: просит два куска вечно огненного железа и два магических камня."
        - "Казимир сказал: это не руна — это по части богов. Жрец в храме Азата расскажет об отмеченных, но просит две проклятые кости."
        - "Жрец назвал таких, как я, отмеченными и послал к Юноне: совет записывает всех, кто попадает в Кинэт не по-людски. За выписку из книг совета Юнона просит две шкуры Белого волка."
      goLabel: "🕯 Идти на встречу"
      onlyInCity: "Сойка ждёт в таверне — туда из города."
    kazimir:
      label: "📌 Показать набросок узора"
      # Цена разговора (StoryBrandQuest.KazimirPrice) — до того, как он прочтёт.
      ask: |
        Казимир переворачивает лист, присвистывает — и кладёт его на стол рисунком вниз.

        «Ого! Прочту, прочту. Только задаром Казимир читает одни вывески, ха-ха! Руны я жгу огнём, который не гаснет, а правлю на камне, который держит форму. Принеси два куска вечно огненного железа и два магических камня — тогда и потолкуем.»
      payLabel: "Отдать железо и камни"
      paid: "Казимир взвешивает на ладони кусок железа — тот всё ещё тлеет — и убирает плату под стол. «Вот теперь потолкуем.»"
      text: |
        Казимир долго смотрит на лист, потом — на меня.

        «Покажи.»

        Я распахиваю ворот. Он не трогает Клеймо — водит пальцем в воздухе над узором, будто боится обжечься.

        «Это не руна. Руну держит вещь: снимешь доспех — снимешь и узор. А этот держится сам. Не на коже даже — глубже.

        И смотри: открыт едва краешек. Узор один, а глубина разная — чем больше открывается, тем больше он может. Что именно может — не спрашивай. Это не по моей части. Это по части богов. Иди к жрецу.»
    priest:
      label: "📌 Спросить об отмеченных"
      # Цена разговора (StoryBrandQuest.PriestPrice).
      ask: |
        Жрец не берёт набросок.

        — Храм не торгует знанием, искатель. Но в лабиринте лежат кости, что зовут живых, — им место в освящённой земле, а не в чужих сумках. Принеси мне две — я их упокою, а ты спросишь, о чём пришёл.
      payLabel: "Отдать проклятые кости"
      paid: "Жрец заворачивает кости в белое полотно и шепчет над ними короткую молитву. Кости затихают."
      text: |
        Жрец смотрит на набросок и долго молчит.

        — В старых книгах храма есть такие слова: «Отмеченным не место среди мёртвых». Земля их не принимает. Падают — и встают, раз за разом, будто смерть для них — просто дверь, через которую выходят обратно.

        Азат никого не метит. Он творит, а не клеймит. Кто ставит такие знаки — я не знаю. Тьма в лабиринте метит тварей, ты видел. Но это не её работа: её метка гниёт, а твоя горит.

        Хочешь узнать, кто ещё в Кинэте носит такое, — спроси Юнону Кинтслев. Совет записывает всех, кто попадает в город не по-людски.
    junona:
      label: "📌 Спросить, кого ещё записал совет"
      # Цена разговора (StoryBrandQuest.JunonaPrice).
      ask: |
        Юнона не поднимает глаз от книги.

        «Совет даром ничего не делает, искатель, — даже на вопросы не отвечает. Выписка из книг стоит пошлину: две шкуры Белого волка, и чтобы целые. Принесёшь — поговорим.»
      payLabel: "Отдать шкуры Белого волка"
      paid: "Юнона проводит ладонью по меху, кивает и делает пометку в книге: «Пошлина принята»."
      # Про Смотрителя — по тому, что с ним сделал герой (StoryPowderQuest.WardenFate).
      warden:
        killed: "«Смотрителя с дегтярного склада нашли с перерезанным горлом. Не морщись: я не спрашиваю, я записываю.»"
        released: "«Смотритель с дегтярного склада ушёл первым кораблём. Ты его отпустил — зря или нет, увидим.»"
        handed: "«Спасибо за Смотрителя. Совет любит, когда ему приносят людей, а не трупы. Порох со склада мы вывезли — двадцать бочек, представь.»"
      text: |
        Юнона откладывает перо.

        «Ты про крышу? Я же сказала: видеть было некому. Почти. Совет записывает тех, кто попадает в Кинэт не по-людски: падает с неба, выходит из воды сухим, встаёт там, где положено лежать. Таких немного. Ты — не первый в этом году.

        Есть ещё одна. Зовут Сойкой. Записана три зимы назад: упала в канал у рыбного рынка — и вышла сухой. Ищет таких, как ты. Обычно сидит в таверне за дальним столом, среди наёмников.

        И ещё, искатель: если Сойка тебе что-то предложит — сначала посчитай, сколько это будет стоить. Она всегда считает первой.»
    meeting:
      text: |
        За дальним столом, среди наёмников, сидит женщина, которую не замечаешь, пока она сама не посмотрит на тебя. Худая, в сером, с птичьим пером за ухом.

        «Сел наконец. Я тебя чую с самого порта: Клеймо к Клейму тянет, как железо к магниту. Ты тоже чуешь — просто думаешь, что это изжога.»

        Она оттягивает ворот. Тот же огненный узор — только глубже, будто его выжигали дольше.

        «Нас мало. Обычно Клеймо возвращает тебя в твоё же тело: встал, отряхнулся, пошёл. А иногда ему хочется другого, и ты просыпаешься в том, кто тебя убил. Почему — не знает никто. Я знаю одно: в такие дни лучше не умирать.

        Братство нас ищет. Не убить — нас не убьёшь. Собрать. Для чего — не знаю. Но у меня есть вот это.»

        Она кладёт на стол страницу, вырванную из чужой книги учёта.
      takeLabel: "Взять страницу"
      leaveLabel: "Уйти"
      gone: "За дальним столом пусто. Сойка ушла — она не любит сидеть на одном месте дольше одного разговора."
      # Следующая зацепка — страница списка; {name} — новое имя героя.
      page: |
        Столбик имён, против каждого — пометка. Против «Сойки» — «ушла, искать». А третья строка сверху — моё новое имя: «{name}». Против него — «Кинэт. Ждать».

        «Ты здесь меньше года, а они уже знают, как тебя зовут, — Сойка улыбается без тепла. — Я не люблю, когда меня ждут. Ты, думаю, тоже. Найдёшь, откуда вырвана страница, — найдём и того, кто её писал.

        Только не обольщайся: я помогаю не тебе. Я помогаю себе. Просто пока нам по пути.»
    questDone: "📜 Квест «Что горит на груди» завершён."

  # Глава 4 (задание 17-го уровня), см. StoryListQuest. Ведёт страница списка.
  storyList:
    leaderName: "Чистильщик"
    # Карточка страницы — после главы 3, по шагам главы 4.
    card:
      ready: "По бумаге можно узнать, из какой она книги. Бумагу в Кинэте знает Рахадим — Торговый дом верит вещам, а не людям."
      steps:
        - "По бумаге можно узнать, из какой она книги. Бумагу в Кинэте знает Рахадим — Торговый дом верит вещам, а не людям."
        - "Бумага — гербовая, из книг канцелярии совета. Список отмеченных ведёт совет — Юнона сама сказала. Значит, кто-то в канцелярии переписывает имена для Братства. Идти к Юноне рано: я не знаю, кому там можно верить. Сойка обещала помочь найти того, кто писал."
        - "Сойка знает, кто носит бумаги из канцелярии. Встреча — ночью, у Мельничного моста."
        - "На главаре чистильщиков — приказ: отмеченного к мосту приведёт «птица». Сойка. Надо её найти — и спросить."
      tellLabel: "🕯 Рассказать Сойке"
      bridgeLabel: "🌉 Идти к Мельничному мосту"
      confrontLabel: "🕯 Найти Сойку"
      onlyInCity: "Это — в городе. Отсюда туда не дойти."
    rakhadim:
      label: "📌 Показать страницу списка"
      text: |
        Рахадим проводит пальцем по краю страницы и подносит её к лампе.

        «Наша бумага. Гербовая: видишь водяной знак — весы и ключ? Такие книги Торговый дом поставляет одному покупателю — канцелярии совета. По договору: сто листов в год, каждый на счету.

        Если отсюда вырвана страница, то кто-то в канцелярии остался должен совету лист. А совет, поверь мне, таких долгов не прощает.»

        Он возвращает страницу и не задаёт ни одного вопроса. Банкиры не спрашивают, откуда вещь, — только сколько она стоит.
    sojka:
      talk: |
        Сойка слушает, не перебивая, и крутит перо за ухом.

        «Канцелярия, значит. Тогда я знаю, кто носит оттуда бумаги: человек без лица и без имени, раз в неделю, ночью. Его можно перехватить у Мельничного моста — там он сворачивает к реке.

        Приходи сегодня ночью. И не шуми: такие, как он, слышат шаги за квартал.»

        Она улыбается — впервые по-настоящему тепло. Это должно было меня насторожить.
      agreeLabel: "Договорились"
      agreed: "«Ночью, у моста», — повторяет Сойка и исчезает в толпе раньше, чем вы успеваете встать."
      confront: |
        Сойка сидит на своём месте, будто ничего не случилось. Увидев меня, она даже не делает вид, что удивлена.

        «Жив. Я знала, что ты выберешься: нас не убьёшь.

        Да, это я. Они обещали вычеркнуть моё имя из списка — совсем, навсегда. Три зимы я живу оглядываясь, а тут предложили просто перестать. За одного тебя.

        Ты бы на моём месте сделал так же. Не ври — сделал бы. Ты всю жизнь так делал.»

        Хуже всего — она права.
      forgiveLabel: "🤝 Простить"
      breakLabel: "✂ Порвать с ней"
      forgave: |
        — Ты права, — говорю я. — Сделал бы. Поэтому живи.

        Сойка долго смотрит на меня, будто ищет подвох. Не находит.

        «Я тебе должна. А я не люблю быть должной», — говорит она.
      broke: |
        — Больше ко мне не подходи.

        «Как знаешь», — Сойка пожимает плечами и встаёт. Уходя, она не оборачивается. Мы оба знаем: в этом городе мы ещё встретимся — и не факт, что на одной стороне.
      leaveLabel: "Уйти"
      gone: "За дальним столом пусто. Сойки здесь нет."
    # Следующая зацепка — ключ от архива канцелярии; одна на оба исхода.
    key: |
      На столе, где она сидела, остаётся медный ключ на кожаном шнурке. Бирка совета: «Архив. Не выносить».

      Сойка украла его для Братства — им нужен был доступ к записям совета. А оставила мне. Может, это извинение. Может, приманка. С Сойкой не угадаешь.

      Но архив канцелярии — то самое место, где кто-то переписывает имена отмеченных. И теперь у меня есть от него ключ.
    bridge:
      ambush: |
        Мельничный мост ночью пустой. Вода шумит под колесом мельницы, на перилах — роса. Сойки нет.

        Зато есть другие. Они выходят с двух концов моста разом, без спешки, как люди, которые делали это много раз: сети с крючьями, короткие дубинки, ни одного меча. Таким убивать не нужно — нужно, чтобы ты не встал.

        Чистильщики Братства. Я сам когда-то водил таких на «тихую работу».

        Клеймо под рубахой вспыхивает, будто узнало старых знакомых.
      fightLabel: "Драться"
      leaveLabel: "Уйти"
      fightStart: "«Брать живым», — бросает главарь своим. Значит, бить будут больно, но не насмерть. Мне можно не стесняться."
      order: |
        Главарь чистильщиков лежит у перил. В его поясе — свёрнутый приказ. Подпись — та же буква:

        «Отмеченного к Мельничному мосту приведёт птица. Брать живым, Клеймо не трогать. Птицу за это из списка вычеркнуть. — Э.»

        Птица. Сойка.

        Она не опоздала на встречу. Она её устроила.
      gone: "У Мельничного моста тихо. Засады больше нет."
      death: "Вы приходите в себя в канаве у Мельничного моста. Чистильщики ушли, не найдя того, за кем пришли: Клеймо подняло вас раньше, чем они вернулись. Страница при вас."
    reward: "🪙 +{silver} — из кошелька главаря чистильщиков. {exp}"
    questDone: "📜 Квест «Список» завершён."

  # Глава 5 (задание 21-го уровня), см. StoryFaceQuest. Ведёт ключ от архива канцелярии.
  storyFace:
    leaderName: "Старший ячейки"
    # Карточка ключа (и копий списка) — после главы 4, по шагам главы 5. «Рано» не говорим.
    card:
      ready: "Архив канцелярии — в подвале совета, под кабинетом Юноны. Днём там писари, ночью — только замок. А от замка у меня есть ключ."
      steps:
        - "Архив канцелярии — в подвале совета, под кабинетом Юноны. Днём там писари, ночью — только замок. А от замка у меня есть ключ."
        - "Книгу отмеченных перешивали в переплётной у рыбного рынка, а руку на её полях я узнал. Надо увидеть того, кто там работает, — своими глазами."
        - "Ударить днём — выйти из переплётной в кандалах. Копии списка лежат в задней комнате, за прессом. Ночью их стерегут люди ячейки."
        - "Против многих имён в копиях — гильдейские номера учёта. Показать их Мастеру Горну: пусть скажет, откуда они у Братства."
        - "Горн дал слово Гильдии. Теперь — Юноне: бумага у копий — совета, и переплётчик — тоже совета."
      archiveLabel: "🗝 Открыть архив"
      faceLabel: "🕯 Зайти в переплётную"
      raidLabel: "🌙 Пробраться в переплётную ночью"
      onlyInCity: "Это — в городе. Отсюда туда не дойти."
    archive:
      text: |
        Ключ входит в замок туго, будто им давно не пользовались по назначению. За дверью — сухой запах бумаги и мышей. Полки до самого свода, на корешках — годы, кварталы, имена.

        Книгу отмеченных я нахожу не по надписи, а по полке: на ней нет пыли. Эту книгу берут часто.

        Переплёт свежий, кожа ещё пахнет клеем. Изнутри к крышке приклеен ярлычок: «Переплётная Брея, у рыбного рынка. Перешито по заказу совета». На форзаце — заметки мастера, обычные для переплётчика: «лист третий — заменить», «шить в пять стежков». Обычные. Кроме руки, которой они написаны.
      # Чья рука на форзаце — по тому, кто пережил пролог (StoryLine.survivors).
      handElorin: |
        Почерк ровный, буква к букве, без единой кляксы. Так пишут ведомости. Так писал Элорин, когда вычёркивал меня из жалования.

        Мастер Брей. Значит, теперь его зовут так.
      handElias: |
        Буквы пляшут и налезают друг на друга, в «заменить» — две ошибки. Так писал Элиас — когда вообще брался за перо.

        Мастер Брей. Значит, теперь его зовут так.
      handBoth: |
        Руки две. Одна ровная, бухгалтерская, без единой кляксы — Элорин. Другая пляшет и ошибается через слово — Элиас. Они и здесь вдвоём, как тогда, в кабинете.

        Переплётная Брея. Осталось узнать, кто из них теперь Брей.
      end: "Я ставлю книгу на место — так же, чуть наискось, как она стояла. Утром кто-то придёт её проверить. Пусть найдёт всё как было."
      leaveLabel: "Уйти"
      gone: "В архиве тихо. Всё, что здесь было для меня, я уже нашёл."
    bindery:
      # Днём — лицо из прошлого: по тому, кто пережил пролог.
      faceElorin: |
        Переплётная у рыбного рынка — узкая, тёплая, пахнет клеем и кожей. Над дверью звякает колокольчик, и человек за конторкой поднимает голову.

        Нарукавники поверх рукавов — он всегда берёг манжеты. Тонкие губы, бровь, поднятая ровно настолько, чтобы ты понял, что тебе здесь не рады. Элорин. Живой. Постаревший на одну зиму и на одно имя.

        «Чем могу служить?» Голос тот же — сухой, как бухгалтерский отчёт.

        Он смотрит мне в лицо — и не узнаёт. Того лица, которое он вычеркнул, больше нет. Я заказываю переплёт для книги, которой у меня нет, плачу задаток и выхожу. Руки начинают дрожать только на улице.
      faceElias: |
        Переплётная у рыбного рынка — узкая, тёплая, пахнет клеем и кожей. В глубине ухает пресс, и человек у пресса оборачивается на колокольчик.

        Широкие плечи, кулаки, которыми проще ломать, чем переплетать. Элиас. Живой. Фартук на нём кожаный, как у мясника, и руки он вытирает о него так же — не глядя.

        «Чего надо?»

        Он смотрит мне в лицо — и не узнаёт. Он бил того, другого: под рёбра, со спины. Того больше нет. Я спрашиваю цену переплёта, киваю и выхожу. Руки начинают дрожать только на улице.
      faceBoth: |
        Переплётная у рыбного рынка — узкая, тёплая, пахнет клеем и кожей. Над дверью звякает колокольчик.

        За конторкой — человек в нарукавниках поверх рукавов: он всегда берёг манжеты. Элорин. В глубине, у пресса, — широкая спина и кулаки, которыми проще ломать, чем переплетать. Элиас. Живы оба. Мастер Брей и его подмастерье.

        «Чем могу служить?» — сухо спрашивает Элорин. Элиас даже не оборачивается.

        Они смотрят мне в лицо — и не узнают. Того лица, которое они вычеркнули, больше нет. Я заказываю переплёт для книги, которой у меня нет, плачу задаток и выхожу. Руки начинают дрожать только на улице.
      faceEnd: |
        Ударить сейчас — значит выйти отсюда в кандалах: мастер совета, свидетели, стража за углом. Слово простого искателя против слова того, кто шьёт совету книги, не стоит ничего.

        Нужны бумаги, которые не оспоришь, и те, кто за меня встанет. Копии списка — где-то здесь, в задней комнате, за прессом. Значит, ночью.
      # Ночью — чёрный ход и ячейка; между ними — знак Сойки по тому, как с ней кончилось в «Списке».
      door: |
        Ночью рыбный рынок пахнет так, что даже воры обходят его стороной. Ставни переплётной закрыты, но в задней комнате горит свет: там не спят.

        Чёрный ход — со двора, мимо бочек с клеем.
      sojka:
        forgave: "В щели чёрного хода торчит серое птичье перо. Сойка была здесь раньше меня и оставила знак: открыто. Похоже, она возвращает долг."
        broke: "Свет наверху гаснет, едва я ступаю во двор: меня ждали. На пороге лежит серое птичье перо. Сойка продала меня снова — или просто напомнила, что может."
      doorEnd: "Их четверо, и это не подмастерья. Старший встаёт из-за стола с листами, остальные молча расходятся по углам — привычно, как их учили. Ячейка Братства. Мастера среди них нет."
      fightLabel: "Драться"
      leaveLabel: "Уйти"
      fightStart: "«Живым», — шепчет старший. Свет никто не трогает: драка будет в полутьме, среди станков и кож."
      copies: |
        Старший ячейки лежит у пресса, остальные — там, где их застала драка. На столе в задней комнате — лампа и стопка листов, ещё пахнущих чернилами.

        Копии списка отмеченных. Лист за листом — имена, пометки, и против многих — номера: гильдейские номера учёта, как на метке Сороки. Против Сойки — «ушла, искать». Против меня — новое: «Видели у моста. Жив».

        Я забираю всё. Утром в переплётной найдут пустой стол. Пусть знают: за ними пришли.
      gone: "Переплётная заперта, на ставнях — «Закрыто». Мастер Брей здесь больше не принимает."
      death: "Вы приходите в себя у рыбного рынка, в куче мокрых сетей. Люди ячейки не стали вас добивать — им велено брать живым, — а унести не успели: Клеймо подняло раньше. Ключ при вас: можно вернуться."
    horn:
      label: "📌 Показать копии списка"
      text: |
        Горн сверяет номера с книгой учёта — медленно, один за другим. На десятом он перестаёт сверять.

        «Мои. Тех, кто ложился в лабиринте и вставал. Я записывал, чтобы знать, кого считать живым. А они по моим книгам считали вас.»

        Он закрывает книгу так тихо, что от этого становится холодно.

        «Кто-то носит им и мои книги. Найду — закрою его учёт сам. А это неси Юноне. Скажи: Гильдия своё слово скажет — и мои люди пойдут с её стражей, когда ты скажешь куда.»
    junona:
      label: "📌 Показать копии списка"
      text: |
        Юнона читает молча, лист за листом. Потом подносит один к окну: водяной знак — весы и ключ.

        «Наша бумага. А мастер Брей переплетает нам книги с прошлой осени — с тех пор, как старый переплётчик утонул в канале. Я ещё подумала: какая удача, такой аккуратный.

        Горн уже прислал человека: Гильдия подтверждает. Совет не любит слов одного искателя, но слово Гильдии — другое дело. Стража будет готова, когда скажешь куда.»

        Листы она убирает под замок — к другим бумагам, которых совет не прощает. Ключ от архива — туда же: «Не выносить — значит не выносить». Перо, которое она берёт следом, ломается у неё в пальцах.
    # Записка — зацепка Рубежа I: на ступенях канцелярии, от того, кто пережил пролог.
    note:
      arrives: |
        На ступенях канцелярии в руку мне тычется мальчишка с рыбного рынка — чумазый, быстрый, с монетой в кулаке.

        «Велели передать. Сказали — вы поймёте.»

        Записка сложена вчетверо. Бумага гербовая, с водяным знаком.
      withElorin: |
        «Моих людей в переплётной уложили так, как умел только один человек — тот, кто их учил. Его я сам вычеркнул из ведомости. Видимо, ошибся в расчётах. Со мной это бывает редко.

        Старое кладбище за городской стеной. Полночь. Приходи, Лео: закроем этот счёт.
        — Э.»
      withElias: |
        «Ребят в переплётной уложили так, как умел только ты. Я эту руку знаю, Лео. Не знаю, как ты вылез. Знаю, что надо поговорить, пока не поздно, — тебе и мне.

        Старое кладбище за городской стеной. Полночь. Приходи.
        — Э.»
      withBoth: |
        «Наших людей в переплётной уложили так, как умел только ты. Мы эту руку знаем, Лео. Один из нас говорит, что ты в аду, другой — что в Кинэте. Похоже, прав второй.

        Старое кладбище за городской стеной. Полночь. Приходи — поговорим втроём, как раньше.
        — Э. и Э.»
      end: |
        Узнали не по лицу — по почерку. У моего ремесла он тоже есть.

        Что ж. Лицом к лицу — так лицом к лицу.
    reward: "🪙 +{silver} — совет платит за копии своих же книг. {exp}"
    questDone: "📜 Квест «Лицо из прошлого» завершён."

  # Рубеж I (задание 25-го уровня), см. StoryToolQuest. Ведёт записка «Э.».
  storyTool:
    # Имена в бою на кладбище.
    names:
      elorin: "Элорин"
      elias: "Элиас"
    card:
      ready: "Старое кладбище за городской стеной, в полночь. Ждать меня там будут, конечно, не одни. Стража совета и люди Горна встанут за стеной — если я подам знак."
      steps:
        - "Старое кладбище за городской стеной, в полночь. Ждать меня там будут, конечно, не одни. Стража совета и люди Горна встанут за стеной — если я подам знак."
        - "Люди ячейки лежат среди могил. Осталось главное — решить, чьё я орудие. Там же, на кладбище."
      goLabel: "🕯 Идти на кладбище"
      onlyInCity: "На кладбище — из города. Отсюда туда не дойти."
    graveyard:
      text: "Старое кладбище за городской стеной заросло так, что надгробия торчат из травы, как зубы. Луна, туман, тишина. Подходящее место для разговора с тем, кого земля не принимает."
      # Кто ждёт у склепа — по тому, кто пережил пролог.
      meetElorin: |
        Элорин ждёт у разбитого склепа — в плаще, с фонарём, в перчатках. Нарукавники он оставил в переплётной.

        «Лео. — Он не спрашивает, он ставит отметку. — Я записал тебя в расходы, а ты оказался долгом. Не люблю долги.

        Знаешь, почему ты жив? Не потому, что тебя трудно убить. Сверху пришёл приказ: отмеченных — живыми. Всех. Для чего — не моего ума дело: я веду счета, а не задаю вопросы. Мне велели ждать в Кинэте. Я ждал. Не знал только, кого дождусь.

        Предлагаю сделку. Ты входишь в Братство — сам, своими ногами, с этим своим новым лицом. Я докладываю наверх, что привёл отмеченного. Тебе — место, мне — жизнь. Все в прибыли.»

        Из-за надгробий поднимаются его люди. Сделки у Элорина всегда были такие: подпишешь сам — или подпишут за тебя.
      meetElias: |
        Элиас ждёт у разбитого склепа — без фонаря, с топором на плече. В темноте он всегда видел лучше, чем думал.

        «Лео. Чтоб меня. — Он сплёвывает в траву. — Я тебя в шахту тащил. Своими руками. А ты — вот.

        Слушай. Сверху пришёл приказ: отмеченных — живыми. Всех. Зачем — мне не говорят, мне говорят: жди в Кинэте. Я ждал. Дождался, выходит, тебя.

        Давай так. Ты идёшь в Братство сам, а я скажу, что это я тебя привёл. Тебе — место, мне — награда и голова на плечах. Мы же были напарниками, брат. Были ведь.»

        Из-за надгробий поднимаются его люди. Договариваться без них Элиас не умел никогда.
      meetBoth: |
        Они ждут у разбитого склепа вдвоём: Элорин с фонарём, Элиас с топором. Как тогда, в кабинете, — только теперь я стою, а не лежу.

        «Лео, — говорит Элорин, будто ставит отметку в ведомости. — Мы спорили, ты это или нет. Я проиграл.

        Ты жив не потому, что тебя трудно убить. Сверху пришёл приказ: отмеченных — живыми. Всех. Нам велели ждать в Кинэте. Мы ждали.»

        «Пойдём с нами, брат, — перебивает Элиас. — Сам, своими ногами. Мы скажем, что привели тебя. Тебе — место, нам — жизнь. Все довольны.»

        Из-за надгробий поднимаются их люди. Вдвоём они всегда договаривались так: подпишешь сам — или подпишут за тебя.
      answer: "Отвечать я не тороплюсь. Сначала — те, что за надгробиями: с ними разговор короче."
      fightLabel: "Драться"
      leaveLabel: "Уйти"
      fightStart: "«Живым его!» — летит над могилами. Им нельзя меня убивать. Мне их — можно."
      gone: "Старое кладбище за городской стеной молчит. Здесь всё уже решено."
      death: "Вы приходите в себя у кладбищенской стены, лицом в мокрой траве. Унести вас не успели — Клеймо подняло раньше. Записка при вас: встреча не отменяется."
    # После боя — вопрос рубежа: что видно над могилами (по тому, кто пережил пролог) и сам вопрос.
    choice:
      withElorin: |
        Его люди лежат между могил. Элорин стоит у склепа, и фонарь в его руке не дрожит. Бежать он не пытается: бегают те, кто не умеет считать.

        «Итак, — говорит он. — Предложение в силе. Других у меня нет.»
      withElias: |
        Его люди лежат между могил. Элиас сидит на надгробии, топор — в траве, дышит тяжело.

        «Ну? — хрипит он. — Решай давай. Я своё сказал.»
      withBoth: |
        Их люди лежат между могил. Элорин стоит у склепа с фонарём, Элиас тяжело дышит рядом, топор — в траве.

        «Предложение в силе», — говорит Элорин. «Решай, брат», — хрипит Элиас.
      question: "Чьё ты орудие, Лео? Братства, которое однажды тебя уже списало? Города, который тебя приютил? Или ничьё — только своё?"
      shadowLabel: "🌑 Тень: войти в Братство"
      shieldLabel: "🛡 Щит: сдать совету и Гильдии"
      aloneLabel: "🗡 Сам по себе: свести счёты"
    # Путь: как кончилось с тем, кто пережил пролог, — и что дальше (общее для всех).
    path:
      shadow:
        withElorin: |
          — Веди, — говорю я.

          Элорин кивает, будто сошёлся итог в ведомости. «Разумно. Наверху скажут, что я привёл отмеченного. А ты будешь помнить, кто привёл.»

          Он снимает перчатку и отдаёт мне перстень: круг, перечёркнутый клинком. Знак своего.
        withElias: |
          — Веди, — говорю я.

          Элиас хохочет на всё кладбище: «Знал! Знал, брат!» Он стаскивает с пальца перстень и суёт мне в ладонь: круг, перечёркнутый клинком. Знак своего.
        withBoth: |
          — Ведите, — говорю я.

          Элорин кивает, будто сошёлся итог в ведомости. Элиас хохочет и хлопает меня по плечу — там, где когда-то вошёл нож. Перстень мне отдаёт Элорин: круг, перечёркнутый клинком. Знак своего.
        end: |
          Я надеваю его. Клеймо под рубахой не жжёт — затаилось.

          Братство однажды сделало из меня Орудие и выбросило, когда я затупился. Теперь я вернусь сам — с лицом, которого они не знают, и с памятью, которую они не стёрли. Тот, кто отдал приказ меня вычеркнуть, сидит где-то наверху. Лучший путь наверх — изнутри.

          За стеной до рассвета прождут стража совета и люди Горна. Знака они не дождутся.
      shield:
        withElorin: |
          Я поднимаю руку — и из тумана выходит стража совета, а за ней люди Горна с фонарями. Они ждали за стеной с вечера: про записку я рассказал им ещё днём.

          Элорин смотрит на них, потом на меня. «Ты всегда плохо считал, Лео, — говорит он, протягивая руки под цепь. — Братство не забывает долгов.»

          — Я тоже, — отвечаю я.
        withElias: |
          Я поднимаю руку — и из тумана выходит стража совета, а за ней люди Горна с фонарями. Они ждали за стеной с вечера: про записку я рассказал им ещё днём.

          Элиас бросается на них с голыми руками, и валят его вчетвером. «Ты сдал своих, Лео! — орёт он, пока ему вяжут локти. — Своих!»

          — Свои не бьют ножом под рёбра, — отвечаю я.
        withBoth: |
          Я поднимаю руку — и из тумана выходит стража совета, а за ней люди Горна с фонарями. Они ждали за стеной с вечера: про записку я рассказал им ещё днём.

          Элиас бросается на них с голыми руками, и валят его вчетвером. Элорин молча протягивает руки под цепь. «Ты всегда плохо считал, Лео, — говорит он. — Братство не забывает долгов.»

          — Я тоже, — отвечаю я.
        end: |
          Наутро Юнона приносит грамоту с печатью совета, и Горн ставит рядом гильдейскую. Мастер Брей больше не переплетает совету книги. Ячейки у рыбного рынка больше нет.

          Кинэт приютил меня, когда я упал ему на крышу. Теперь я — его щит. Братство это запомнит и придёт. Пусть приходит: здесь есть кому встать рядом.
        # Снаряжение пути (StoryToolQuest.Path.Shield.gear) — откуда оно.
        gear: "Под вечер следующего дня по приказу Юноны к моему дому подвозят именные доспех и щит — роскошные, с гербом совета и моим новым именем на каждом. В приложенной бумаге сказано: «За помощь в уничтожении опасной гильдии в городе»."
      alone:
        withElorin: |
          — Счёт, — говорю я. — Ты сам его открыл.

          Элорин успевает понять — этого я и хотел. Удар быстрый и точный, как он любил. Чистая хирургия.

          Фонарь катится в траву и гаснет.
        withElias: |
          — Были, — говорю я. — Напарниками.

          Элиас успевает схватиться за топор. Поднять — не успевает. Я бью так, как он ударил меня тогда: под рёбра, на два пальца. Он оседает на надгробие, и оно впервые за сто лет кому-то пригодилось.
        withBoth: |
          — Счёт, — говорю я. — Вы сами его открыли.

          Элиас успевает схватиться за топор. Элорин успевает понять — этого я и хотел. Две мести, тихая и яростная, наконец закрывают свои счета на одном кладбище.
        end: |
          В склепе — тайник ячейки: серебро в мешках и книга в чёрной коже — имена, города, другие ячейки. Серебро я забираю. Книгу — тоже.

          Ни Братства, ни города. Ничьё — своё. Я слишком долго был чьим-то орудием, чтобы снова дать кому-то держать себя за рукоять.

          Стража и люди Горна за стеной так и не дождутся знака: этот счёт — мой. А месть оказалась ни сладкой, ни горькой. Просто — сделанной.
        # Снаряжение пути (StoryToolQuest.Path.Alone.gear) — откуда оно.
        gear: "На дне тайника, под мешками, лежит маска — гладкая, тёмная, без единой черты. Лицо, которого нет ни у кого. Её я тоже беру себе."
    reward:
      shadow: "🪙 +{silver} — задаток Братства. {exp}"
      shield: "🪙 +{silver} — награда совета. {exp}"
      alone: "🪙 +{silver} — тайник ячейки. {exp}"
    # Снаряжение пути, что легло в сумку, — строкой под наградой.
    gearLine: "🎁 {name}"
    # От кого посылка со снаряжением пути, если оно не влезло в сумку.
    gearFrom:
      shadow: "Братство"
      shield: "совет Кинэта"
      alone: "тайник ячейки"
    questDone: "📜 Рубеж «Чьё ты орудие» пройден."

  # Акт II «Глубина узора», глава 6 «Наутро» (задание 26-го уровня), см.
  # StoryMorningQuest. Начинается дома; у каждого пути Рубежа I своя история,
  # а кончаются все описью урожая.
  storyMorning:
    # Начало дома (StoryMorningQuest.atHome): у Тени — записка от того, кто
    # пережил пролог; у Щита — посыльный Юноны; у одиночки — книга ячейки.
    start:
      shadow: |
        Под дверью лежит записка, хотя засов задвинут изнутри. Я проверяю засов. Задвинут.
      noteElorin: |
        «Испытательный срок начинается сегодня.

        Писарь Гильдии Ян Пятак носил нам книги учёта Горна. Горн об этом узнал и ищет его. Найди писаря раньше Горна и вывези из города. Живым: он нам ещё должен.

        Расходы — из твоего задатка.
        — Э.»
      noteElias: |
        «Слышь. Писарь из Гильдии, Ян Пятак, таскал нам книги Горна. Горн прознал и теперь его ищет. Найди его раньше и вывези из города. Живым! Он нам ещё пригодится.

        С меня пиво.
        — Э.»
      noteBoth: |
        «Испытательный срок начинается сегодня.

        Писарь Гильдии Ян Пятак носил нам книги учёта Горна. Горн об этом узнал и ищет его. Найди писаря раньше Горна и вывези из города. Живым.

        Расходы — из твоего задатка.
        — Э.»

        Ниже другой рукой, вкривь: «И пиво с меня. — тоже Э.»
      shadowEnd: |
        Испытательный срок. Когда-то я сам их назначал. Новичку давали работу, на которой приходилось обмануть кого-нибудь из своих, и смотрели, как у него выйдет.

        Записку я убираю в сумку. Сжечь всегда успею.
      shield: |
        Утром в дверь стучит посыльный совета — мальчишка в форменной куртке на два размера больше. Он отдаёт записку и не уходит, пока не получит монету.

        Почерк у Юноны мелкий, с наклоном, без лишних слов: «Зайди в канцелярию, как проснёшься. Есть дело. Не про дома. — Ю. К.»

        «Как проснёшься» — это она так шутит. На улице ещё темно.
      alone: |
        Ночью мне не спится, и я читаю книгу ячейки при свечке, как счётную книгу чужой лавки. По сути, это она и есть: имена, города, суммы — кому платили, чем и за что.

        Кинэту отведена отдельная страница. Первая строка на ней:

        «Барти. Торговая площадь, дом с синей дверью. Болтает. Платить пивом. Не убирать — полезен».

        Барти, выходит, давно работает на Братство. Похоже, сам он об этом не знает.
    # Карточки ведущих предметов (поручение Э., грамота совета, книга ячейки) —
    # что делать сейчас, по шагу своего пути.
    card:
      shadow:
        - "Где прячется писарь, лучше всех знает сам Горн. Спросить у него — и не сказать зачем."
        - "Ян Пятак сидит в «Трёх костях», игорном доме у порта: задолжал, и его держат в счёт долга. Горн ищет его там же. Надо успеть раньше."
      shield:
        - "Юнона прислала посыльного: зайти в канцелярию. Есть дело, и не про дома."
        - "Юнона просит стеречь Брея три ночи в подвале совета. Горну она уже написала — зайти к нему за людьми."
        - "Ночь в подвале совета, у камеры Брея. Горн обещал прийти не с пустыми руками."
        - "Брей заговорил. Рассказать Юноне, что он сказал."
      alone:
        - "Первая строка по Кинэту в книге — Барти: «Болтает. Платить пивом». Зайти к нему, в дом с синей дверью на Торговой площади."
        - "За книгой пришли люди Братства — прямо к Барти."
      denLabel: "🎲 Идти в «Три кости»"
      cellarLabel: "🌙 Спуститься в подвал совета"
      bartiLabel: "🏠 Зайти к Барти"
      onlyInCity: "Это — в городе. Отсюда туда не дойти."
    # Путь Тени, шаг 1: Горн ищет писаря (MasterHornState).
    horn:
      label: "📌 Спросить про писаря"
      text: |
        Горн сидит над книгой учёта и не поднимает головы.

        — Пятак? — Он хмыкает. — Третий день не выходит. Сначала я думал — запил. Потом пересчитал книги. Двух нет, и в одной из них — те, кто ложился у изгороди и вставал.

        Он поднимает глаза.

        — Ты его не видел?

        — Нет, — говорю я. Голос ровный.

        — Увидишь — тащи сюда. Он мне с весны должен, а теперь ещё и это. — Горн макает перо в чернильницу. — Обычно он сидит в «Трёх костях», у порта. Если и там нет — значит, уже на дне залива.

        Я киваю и выхожу. Горн уже снова пишет.
    # Путь Тени, шаг 2: «Три кости» (StoryDenState).
    den:
      ownerName: "Бенно"
      text: |
        «Три кости» — подвал под лавкой канатчика у самого порта. Накурено так, что лампы горят жёлтым. За столами в кости играют докеры, матросы и пара искателей, которым сегодня явно не везёт.

        Ян Пятак сидит в задней комнате на табурете, без сапог: сапоги лежат на столе у хозяина, в залоге. Сам хозяин, {owner}, пересчитывает монеты и глаз не поднимает:

        «Писарь мне должен {debt} серебра. Заплатишь — забирай. Нет — пусть сидит, пока не придёт тот, кто заплатит. Горн, говорят, тоже интересовался».

        У двери стоят четверо, и держатся так, будто разнять любую драку им ничего не стоит. Скорее всего, так и есть.
      payLabel: "💰 Заплатить {debt} 🪙"
      fightLabel: "Драться"
      leaveLabel: "Уйти"
      notEnough: "Столько серебра у меня нет — ни на руках, ни в ячейке: нужно {debt}."
      paid: "Бенно пересчитывает серебро дважды и кидает Пятаку его сапоги. «Приятно иметь дело», — говорит он, так и не подняв глаз."
      fightStart: "Бенно вздыхает, будто его оторвали от счёта, и кивает своим. Игроки в зале даже не оборачиваются: здесь такое бывает по вторникам."
      won: "Бенно сидит под столом и прижимает к себе шкатулку с выручкой. Вышибалы лежат кто где. Сапоги Пятака я забираю со стола сам."
      out: |
        Пятак обувается на ходу и путается в шнурках. Я вывожу его через двор канатчика к воде. Там ждёт лодка до рыбачьих деревень, а её хозяин не задаёт вопросов, если заплатить вперёд. Я заплатил.

        У лодки Пятак хватает меня за рукав.

        «Вот. Это им — последнее, что я нёс. Отдай сам, ладно? Не хочу, чтобы они думали, будто я оставил это себе». Он суёт мне сложенный лист: гербовая бумага, водяной знак — весы и ключ.

        Лодка уходит в туман. Я разворачиваю лист прямо на причале.
      gone: "В «Трёх костях» всё как обычно: кости, дым, проигравшие. Писаря здесь больше нет."
      death: "Вы приходите в себя в портовом переулке, лицом в мокрых сетях: вышибалы вынесли вас аккуратно, как мусор. Писарь всё ещё сидит в «Трёх костях». Поручение при вас."
    # Путь Щита, шаги 1 и 4: канцелярия совета (HomeState).
    junona:
      label: "📌 Спросить, что за дело"
      text: |
        Юнона ставит передо мной чашку. Чай давно остыл, но, похоже, больше канцелярия ничем не угощает.

        «Брей сидит у нас в подвале. Суд через три дня, если совет не передумает, а совет передумывает каждую неделю. Братство знает, где он: стража у меня через одного продаётся. Я даже знаю, кто почём.

        Мне нужен человек, который не продаётся. Или продаётся, но не Братству. Посидишь в подвале три ночи?»

        Она смотрит на меня поверх чашки.

        «Да, я знаю, что у тебя к переплётной свой счёт. Поэтому и прошу тебя. Ты будешь стеречь его лучше всех — хотя бы чтобы потом рассчитаться самому. Не придётся, кстати».
      # Живы оба: подмастерье сидит отдельно.
      apprentice: "«Подмастерья держим отдельно, в городской тюрьме: он ничего не знает, это видно сразу. С ним даже разговаривать скучно»."
      end: "«Горну я уже написала, людей он даст. — Она отодвигает мою чашку обратно ко мне. — И допей чай. Он невкусный, но другого у совета нет»."
      testimonyLabel: "📌 Рассказать, что сказал Брей"
      testimony: |
        Юнона слушает и не перебивает. Горн сидит в углу на сундуке с делами и делает вид, что спит.

        «Совет уже знает, — говорит она, когда я заканчиваю. — Совет всегда узнаёт раньше меня, хотя бумаги пишу я. Решили так: Брей говорит — Брей живёт. Когда суд кончится, его вывезут из города под чужим именем».

        — Он человек Братства, — говорю я.

        «Он полезный человек Братства. Я сказала им то же, что ты, почти слово в слово. Меня поблагодарили за усердие». Она двигает ко мне лист. «Это опись, о которой он рассказал. Продиктовал по памяти — сам когда-то переписывал её набело. Отдавать её мне не положено. Поэтому я её и не отдаю, а ты её не берёшь».

        Горн открывает один глаз.

        — Я бы закрыл его учёт сам, — говорит он. — Бесплатно. — И закрывает глаз обратно.
    # Путь Щита, шаг 2: Горн даёт людей (MasterHornState).
    hornCellar:
      label: "📌 Про подвал совета"
      text: |
        Записка Юноны лежит у Горна под чернильницей.

        — Людей дам, — говорит он раньше, чем я успеваю спросить. — Свана и Хильду. Сван не пьёт, Хильда не болтает. Вдвоём выходит один хороший искатель.

        Он закрывает книгу учёта.

        — И сам приду. В подвалах совета я ещё не пил, а годы у меня такие, что пора пробовать всё подряд.
    # Путь Щита, шаг 3: ночь в подвале совета (StoryCellarState). Горн и
    # искатели — в строю героя.
    cellar:
      hornName: "Горн"
      seekers:
        - "Сван"
        - "Хильда"
      leaderName: "Сухарь"
      text: |
        Подвал совета — сухой, чистый и холодный, как всё, что принадлежит совету. В конце коридора решётка, за ней — Брей.

        Горн приносит бутылку, два кривых стакана и кусок сыра, завёрнутый в лист из книги учёта. Сван садится у лестницы, Хильда — у решётки. Пьём мы с Горном: Сван, как и было обещано, не пьёт.

        — Знаешь, сколько у меня в книге искателей, которых никто не стережёт? — Горн режет сыр ножом для бумаг. — Все. А тут за решёткой одна переплётная, и стерегут её вчетвером. Не обижайся, но скучнее работы в Кинэте нет.

        Около полуночи наверху хлопает дверь. Потом ещё одна. Потом становится тихо — тише, чем нужно.

        Горн ставит стакан, не допив.

        — Вот и не скучно.
      fightLabel: "Драться"
      leaveLabel: "Уйти"
      fightStart: "По лестнице спускаются люди в сером, с сетями и короткими дубинками. «Переплётчика — в расход, — говорит их главарь. — Остальных — как получится». Горн берёт со стола молот. Хильда — табурет."
      won: |
        Последний чистильщик лежит у лестницы. Хильда сидит на нём и вытирает разбитую губу. Горн разглядывает свой молот, будто видит его впервые.

        — Давно я так не разминался, — говорит он. — Колено мне это завтра припомнит.
      # Голос Брея — того, кто пережил пролог (живы оба — Элорин).
      breyElorin: |
        Брей стоит у решётки и держится за прутья. Манжеты у него в пыли, и, кажется, это беспокоит его больше всего.

        «Они пришли за мной, — говорит он ровно. — Свои. Значит, меня списали. — Он поправляет манжет. — Тогда я хочу продать то, что у меня осталось. Пусть совет даст слово, и я расскажу про Сборщика».
      breyElias: |
        Брей сидит на полу у решётки и трёт лицо ладонями.

        «Свои пришли, — говорит он глухо. — За мной. Понял? Свои. — Он поднимает голову. — Ладно. Чёрт с ними. Пусть совет даст слово — и я расскажу. Про Сборщика, про всё».
      end: "Утром я иду к Юноне. Горн — домой, парить колено."
      gone: "В подвале совета тихо. Брей своё уже рассказал."
      death: "Вы приходите в себя на ступенях совета. Чистильщики отступили, но недалеко: Брей жив, и они вернутся следующей ночью. Грамота при вас — можно снова спуститься в подвал."
    # Путь «Сам по себе»: дом Барти (BartiHouseState). Барти — в строю героя.
    barti:
      name: "Барти"
      leaderName: "Счетовод"
      # Встречались ли в этой жизни — по «Ходовому товару».
      met: |
        Барти открывает не сразу: за дверью что-то двигают, роняют и шёпотом ругаются. Наконец он выглядывает в щель.

        «А, это ты! Заходи. Я думал, опять из Торгового дома, насчёт процентов».
      stranger: |
        Барти открывает не сразу: за дверью что-то двигают, роняют и шёпотом ругаются. Наконец он выглядывает в щель и долго меня разглядывает.

        «Ты не из Торгового дома? Не насчёт процентов? Тогда заходи. Мы ведь знакомы? Нет? Ну, познакомимся. Бартоломью. Для друзей — Барти».
      talk: |
        Дома у него всё новое и всё не к месту: ковёр поверх соломы, подсвечник без свечей, кресло, в котором нельзя сидеть. Деньги у Барти долго не задерживаются.

        Я кладу перед ним книгу ячейки, открытую на нужной странице, и показываю пальцем.

        Барти читает, шевеля губами. Потом ещё раз.

        «Пивом, — говорит он наконец. — Пивом! Я им лучших сплетен на тысячу серебра натаскал. Про Густаво. Про жену Трактирщика. А они — пивом. И «не убирать — полезен». Это что, похвала?»

        — В Братстве — да.

        Барти долго молчит. Для Барти это очень долго.

        «Слушай. Я с тобой. Ты мне долю, я тебе — город. Я тут всех знаю, и все знают меня. — Он морщится. — Это, правда, не всегда хорошо».
      knock: |
        В дверь стучат. Не так, как стучат из Торгового дома: коротко, три раза, и сразу пробуют ручку.

        Барти бледнеет. «Это не проценты», — шепчет он.

        За дверью четверо, а с ними пятый — в очках, с конторской книгой под мышкой. Счетовод ячейки пришёл за своей книгой.
      fightLabel: "Драться"
      leaveLabel: "Уйти"
      fightStart: "Барти хватает со стола сковороду. «Только не по ковру! — кричит он. — Ковёр ещё не оплачен!»"
      won: |
        Счетовод лежит на ковре, и ковёр, похоже, уже не продать. Барти сидит в неудобном кресле, держит сковороду обеими руками и смотрит на неё с уважением.

        «Я одного достал, — говорит он. — Ты видел? По голове. Он, правда, потом встал. Но я его достал».

        В кармане у счетовода — сложенный лист гербовой бумаги. Барти читает через моё плечо.
      death: "Вы приходите в себя на полу у Барти. Счетовод и его люди ушли без книги: Барти успел сунуть её в печку — к счастью, холодную. «Они вернутся, — говорит он. — За своими книгами всегда возвращаются»."
    # Развязка всех путей — опись урожая ({name} — новое имя героя).
    harvest: |
      «Урожай к первому снегу. Принимает Сборщик, лично. Брать живыми, грузить по одному».

      Ниже идут имена, и против каждого — где искать. Новое имя третьим: «{name} — Кинэт. Не пугать раньше времени». Пятой стоит Сойка.
    # Что после описи — по пути.
    coda:
      shadow: "Я перечитываю третью строку — вдруг в первый раз ошибся. Не ошибся. Лист я складываю вчетверо и убираю в сумку. Отдавать его Э. я пока не тороплюсь."
      shield: "«Твоё имя там третье, — говорит Юнона. — Я подумала, тебе лучше знать до первого снега, а не после»."
      alone: "«Сойка, — читает Барти вслух. — Красивое имя. А Сборщик — это кто? Я это слово уже слышал. У Трактирщика. Ну и от жены его»."
    reward:
      shadow: "🪙 +{silver} — плата Братства за писаря. {exp}"
      shield: "🪙 +{silver} — совет платит за ночи в подвале. {exp}"
      alone: "🪙 +{silver} — кошелёк счетовода. {exp}"
    questDone: "📜 Квест «Наутро» завершён."

  # Глава 7 «Новенький» (задание 31-го уровня), см. StoryNewcomerQuest. Ведёт
  # опись урожая: на главную площадь падает новый отмеченный, и за ним приходят
  # раньше героя — у Тени стража совета, у остальных ловцы Братства с сетями.
  storyNewcomer:
    # Карточка описи — что делать сейчас, по шагу главы.
    card:
      steps:
        - "Урожай к первому снегу — значит, до снега на главную площадь кто-нибудь упадёт. Сходить посмотреть, кто успеет к нему первым."
        - "Мило ждёт у фонтана на главной площади. Решить, куда его девать."
      squareLabel: "🏛 На главную площадь"
      onlyInCity: "Главная площадь — в городе. Отсюда туда не дойти."
    square:
      sergeantName: "Сержант Корт"
      catcherName: "Грач"
      text: |
        С утра на главной площади толпа: из портала выпал человек. В Кинэте такое бывает, и смотрят на это как на пролитое пиво — неприятно, но не твоё.

        Этот сидит по пояс в фонтане, в одном сапоге, и спрашивает у всех, где здесь можно позавтракать. Под мокрой рубахой у него светится.
      # Кто успел к новенькому раньше героя — по пути Рубежа I.
      shadow: "Ночью под дверь подсунули записку: «Упадёт — твой. В ячейку. Тихо». Тихо не выйдет: у фонтана уже стоит стража совета — сержант и четверо. У сержанта бумага: новенького — в канцелярию, на запись."
      shield: "Юнона просила: если кто упадёт, вести к ней, пока не перехватили. Перехватывают уже: у края площади двое в сером кормят голубей. Хлеба у них нет. За ними ещё трое, и плащи у них подозрительно оттопыриваются."
      alone: |
        Барти хватает меня за рукав. «Видал? Свеженький! Таких покупают, и покупают дорого».

        У края площади двое в сером кормят голубей. Хлеба у них нет.

        — Ловцы, — говорю я.

        «Ага. — Барти мрачнеет. — Тогда я, пожалуй, постою за фонтаном».
      fightLabel: "Драться"
      leaveLabel: "Уйти"
      fightStartShadow: "Сержант кладёт руку на плечо новенького — и тут же её убирает: моя рука уже у него на запястье. «Именем совета», — говорит он. Совет здесь — это он и четверо."
      fightStart: "Двое в сером бросают кормить голубей. Голуби, похоже, этому рады. Из-под плащей появляются сети."
      # После боя — Мило, слова своего пути и вопрос.
      won: |
        Мило сидит на краю фонтана, мокрый, в одном сапоге, и смотрит на меня так, будто я тоже могу выпасть обратно в портал.

        «Меня зовут Мило. Я торгую сукном. Торговал. Вы не знаете, где мой тюк?»
      wonShadow: "Приказ Э. простой: в ячейку."
      wonShield: "Горн подходит, когда всё уже кончено, снимает с плеча чью-то сеть и достаёт книгу учёта. «Вписать? Своих Гильдия не отдаёт. А этот, похоже, уже свой»."
      wonAlone: "Барти выглядывает из-за фонтана. «Ну? Продаём? Шучу. Почти»."
      question: "Куда его?"
      brotherhoodLabel: "🌑 Отдать Братству"
      councilLabel: "⚖ Отдать совету"
      hedgeLabel: "🌿 Вывести через изгородь"
      gone: "На главной площади как обычно: голуби, лоточники, мокрые плиты у фонтана. Портал молчит."
      death: "Вы приходите в себя на мокрых плитах у фонтана. Новенький ещё здесь — его так и не успели увести. Те, кто за ним пришёл, тоже здесь. Опись при вас."
    # Что стало с Мило — по выбору; у Тени — ещё и как это видит Братство.
    fate:
      brotherhood:
        shadow: |
          Мило идёт со мной послушно — так идут те, кто ещё ничего не понял. У ячейки его забирают двое, вежливо, под локти. Он оборачивается и спрашивает про тюк. Я говорю, что найду.

          Э. потом передаёт одно слово: «Чисто».
        other: |
          За углом ждёт человек в сером: он видел драку и всё понял. Деньги он отсчитывает не торгуясь, будто покупает мешок муки. Мило уводят под локти. Он оборачивается и спрашивает про тюк.

          Человек в сером уходит, не попрощавшись. Кошель тяжёлый.
      council:
        main: "В канцелярии Мило записывают: имя, город, «упал в фонтан, вышел мокрым». Юнона ставит печать и обещает, что за ним присмотрят. Мило благодарит всех по очереди, даже стражника у двери."
        shadow: "Э. узнает об этом к вечеру. Не от меня."
      hedge:
        main: |
          Я вывожу его за город, к изгороди, и дальше — поворот за поворотом, пока Кинэт не остаётся где-то за спиной. Лабиринт выводит куда хочет, и на этот раз это кстати: где выйдет Мило, не знаю даже я.

          «Тюк, — говорит он на прощание. — Если найдёте…»

          Он кивает сам себе и уходит за поворот. Я жду, пока стихнут шаги.
    # Зацепка главы 8 — у главаря тех, кто пришёл за Мило.
    pass:
      guard: "За поясом у сержанта Корта — бирка из светлого дерева: расколотый пень, нашивка Чернолома, и выжжено: «Пропуск на просеку». На обороте — оттиск печати канцелярии совета. Странная бирка для стражника."
      catcher: "За поясом у Грача — бирка из светлого дерева: расколотый пень, нашивка Чернолома, и выжжено: «Пропуск на просеку». На обороте — оттиск печати канцелярии совета."
    reward:
      brotherhood: "🪙 +{silver} — Братство платит за новенького. {exp}"
      council: "🪙 +{silver} — совет платит за находку. {exp}"
      hedge: "🪙 +{silver} — в уцелевшем сапоге у Мило был кошелёк, и он отдал его не глядя. {exp}"
    questDone: "📜 Квест «Новенький» завершён."

  # Глава 8 «Просека» (задание 36-го уровня), см. StoryClearingQuest. Пока
