apiVersion: 1

providers:
  - name: pangea
    type: file
    disableDeletion: true
    # Правки в интерфейсе сохраняются, но при перезапуске файл из репозитория
    # их перезапишет: постоянные изменения — в docker/grafana/dashboards.
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
