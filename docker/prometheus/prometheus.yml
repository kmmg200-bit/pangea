# Prometheus собирает метрики бота (см. GameMetrics и MetricsServer).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: pangea
    # Время замера — по Prometheus: экспортёр ставит свои метки времени, а
    # при опросе реже его обновления это давало бы повторы.
    honor_timestamps: false
    # По имени контейнера, а не сервиса: при пересоздании контейнера (каждый
    # деплой) Docker 29 стирает из DNS имя сервиса «app» вместе со старым
    # контейнером, а имя контейнера живёт — его старый перед удалением
    # отдаёт. Имя постоянно: проект закреплён в docker-compose.yml (name).
    # Бот — ходы, таймеры, база; сборщик — доставка событий от ВК.
    static_configs:
      - targets: ["pangea-app-1:9464"]
        labels: { role: bot }
      - targets: ["pangea-collector-1:9464"]
        labels: { role: collector }
