# Имя проекта — явно: от него зависят имена контейнеров (pangea-app-1), а по
# имени контейнера бота опрашивает Prometheus (docker/prometheus).
name: pangea

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    ports:
      - "80:8080"
    environment:
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      VK_TOKEN: ${VK_TOKEN}
      VK_SECRET: ${VK_SECRET:-}
      VK_LONG_POLL: ${VK_LONG_POLL:-false}
      VK_APP_SECRET: ${VK_APP_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TBANK_TERMINAL_KEY: ${TBANK_TERMINAL_KEY:-}
      TBANK_PASSWORD: ${TBANK_PASSWORD:-}
      TBANK_NOTIFICATION_URL: ${TBANK_NOTIFICATION_URL:-}
      TBANK_SUCCESS_URL: ${TBANK_SUCCESS_URL:-}
      TBANK_FAIL_URL: ${TBANK_FAIL_URL:-}
      TBANK_OFFER_URL: ${TBANK_OFFER_URL:-}
      TBANK_TAXATION: ${TBANK_TAXATION:-usn_income}
      TBANK_TAX: ${TBANK_TAX:-none}
      TBANK_PAYMENT_OBJECT: ${TBANK_PAYMENT_OBJECT:-service}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # SIGTERM → SIGKILL. Остановке нужно до 5 с на HTTP-сервер и до 15 с на
    # фоновые дела (ServerLive.ShutdownTimeout, Background.Grace); по
    # умолчанию Docker даёт лишь 10.
    stop_grace_period: 30s

  # HTTPS спереди: VK Mini App (web/) и маршруты бота, которым нужен HTTPS
  # (/api, /pay, /logs), — по адресу DOMAIN из .env (см. docker/caddy/Caddyfile).
  # Сертификат Let's Encrypt Caddy получает и продлевает сам и хранит в
  # caddy_data. Порт 80 остаётся за ботом: на него по HTTP приходит Callback ВК.
  # Пока DOMAIN не задан, Caddy не запускается — контейнер просто ждёт.
  caddy:
    build: ./web
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$DOMAIN" ] || { echo "DOMAIN не задан в .env — HTTPS выключен"; exec sleep 2147483647; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

  # Метрики бота (GameMetrics): Prometheus раз в 15 секунд читает их с app:9464
  # — порт внутренний, наружу не открыт — и хранит 30 дней.
  prometheus:
    image: prom/prometheus:v2.53.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  # Графики: http://<IP сервера>:3000, вход admin / GRAFANA_PASSWORD из .env.
  # Порт открыт наружу, поэтому без пароля Grafana не запускается: вход
  # admin/admin на открытом порту первым сменил бы кто угодно. Это HTTP —
  # пароль идёт по сети открытым текстом, берите отдельный. Дашборд
  # «Пангея» — из docker/grafana/dashboards.
  grafana:
    image: grafana/grafana:11.2.0
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "GRAFANA_PASSWORD не задан в .env — без пароля на открытом порту не запускаюсь"; exit 1; }; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/pangea.json
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
