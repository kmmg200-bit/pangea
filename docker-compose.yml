# Имя проекта — явно: от него зависят имена контейнеров (pangea-app-1), а по
# имени контейнера бота опрашивает Prometheus (docker/prometheus).
name: pangea

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Бот (ROLE=bot): разбор очереди ВК — ходы игроков, — таймеры, фоновые
  # циклы, касса, Mini App, логи. Порта наружу нет: запросы к нему (/pay, /api,
  # /logs) приводит caddy. Схему базы ведёт он: миграции катятся при его старте.
  # Ботов может быть два разом — так его выкладывает scripts/deploy-bot.sh:
  # новый рядом со старым, старый гасится, когда новый готов (healthcheck).
  app:
    build: .
    image: pangea-app
    environment:
      ROLE: bot
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_LOCK_POOL_SIZE: ${POSTGRES_LOCK_POOL_SIZE:-20}
      VK_TOKEN: ${VK_TOKEN}
      VK_SECRET: ${VK_SECRET:-}
      VK_LONG_POLL: ${VK_LONG_POLL:-false}
      # Гильдейское сообщество: беседы гильдий (см. README). Пусто — его нет.
      VK_TOKEN_FOR_GROUP_CHATS: ${VK_TOKEN_FOR_GROUP_CHATS:-}
      VK_APP_SECRET: ${VK_APP_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TBANK_TERMINAL_KEY: ${TBANK_TERMINAL_KEY:-}
      TBANK_PASSWORD: ${TBANK_PASSWORD:-}
      TBANK_NOTIFICATION_URL: ${TBANK_NOTIFICATION_URL:-}
      TBANK_SUCCESS_URL: ${TBANK_SUCCESS_URL:-}
      TBANK_FAIL_URL: ${TBANK_FAIL_URL:-}
      TBANK_OFFER_URL: ${TBANK_OFFER_URL:-}
      TBANK_TAXATION: ${TBANK_TAXATION:-usn_income}
      TBANK_TAX: ${TBANK_TAX:-none}
      TBANK_PAYMENT_OBJECT: ${TBANK_PAYMENT_OBJECT:-service}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Готов — когда отвечает на GET /health: миграции прошли, слои поднялись
    # (база, локи, ведущий). По нему scripts/deploy-bot.sh решает, что старого
    # пора гасить. Запрос — настоящий: пустое соединение бот писал бы в лог
    # ошибкой.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 180s
    # SIGTERM → SIGKILL. Остановке нужно до 5 с на HTTP-сервер и до 15 с на
    # фоновые дела (ServerLive.ShutdownTimeout, Background.Grace); по
    # умолчанию Docker даёт лишь 10.
    stop_grace_period: 30s

  # Сборщик (ROLE=collector) — тот же образ, что у бота: колбэк ВК (через
  # caddy) и Long Poll кладут события в очередь vk_inbox, ход играет бот.
  # Выкладывается отдельно и редко: пока выкатывают бота, ВК отвечает он.
  # Образ собирает сервис app, здесь он только берётся — пересобрали бота, а
  # сборщик работает на прежнем, пока его не пересоздадут явно.
  collector:
    image: pangea-app
    pull_policy: never
    environment:
      ROLE: collector
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      VK_TOKEN: ${VK_TOKEN}
      VK_SECRET: ${VK_SECRET:-}
      VK_LONG_POLL: ${VK_LONG_POLL:-false}
      # Гильдейское сообщество: беседы гильдий (см. README). Пусто — его нет.
      VK_TOKEN_FOR_GROUP_CHATS: ${VK_TOKEN_FOR_GROUP_CHATS:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Жив ли — тот же GET /health, что у бота: видно в docker compose ps.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 120s
    stop_grace_period: 30s

  # Входная дверь: порты 80 и 443 — только у него (см. docker/caddy/Caddyfile).
  # По HTTP (80) — колбэк ВК на сборщика, вебхук кассы и логи на бота: адреса
  # прежние, их знают ВК и касса. По HTTPS (443, адрес DOMAIN из .env) — ещё и
  # VK Mini App (web/). Сертификат Let's Encrypt Caddy получает и продлевает
  # сам и хранит в caddy_data. Без DOMAIN не запускается: без него ни ВК, ни
  # касса до бота не дойдут.
  caddy:
    build: ./web
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$DOMAIN" ] || { echo "DOMAIN не задан в .env — без него не запускаюсь"; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - collector
    restart: unless-stopped

  # Метрики (GameMetrics): Prometheus раз в 15 секунд читает их с бота и
  # сборщика (:9464 — порт внутренний, наружу не открыт) и хранит 30 дней.
  prometheus:
    image: prom/prometheus:v2.53.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  # Графики: http://<IP сервера>:3000, вход admin / GRAFANA_PASSWORD из .env.
  # Порт открыт наружу, поэтому без пароля Grafana не запускается: вход
  # admin/admin на открытом порту первым сменил бы кто угодно. Это HTTP —
  # пароль идёт по сети открытым текстом, берите отдельный. Дашборд
  # «Пангея» — из docker/grafana/dashboards.
  grafana:
    image: grafana/grafana:11.2.0
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "GRAFANA_PASSWORD не задан в .env — без пароля на открытом порту не запускаюсь"; exit 1; }; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/pangea.json
      # Источник «База Пангеи» для дашборда «Донат» (provisioning/datasources/postgres.yml).
      POSTGRES_DB: ${POSTGRES_DB}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
