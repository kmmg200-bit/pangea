services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    ports:
      - "80:8080"
    environment:
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      VK_TOKEN: ${VK_TOKEN}
      VK_SECRET: ${VK_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TBANK_TERMINAL_KEY: ${TBANK_TERMINAL_KEY:-}
      TBANK_PASSWORD: ${TBANK_PASSWORD:-}
      TBANK_NOTIFICATION_URL: ${TBANK_NOTIFICATION_URL:-}
      TBANK_SUCCESS_URL: ${TBANK_SUCCESS_URL:-}
      TBANK_FAIL_URL: ${TBANK_FAIL_URL:-}
      TBANK_OFFER_URL: ${TBANK_OFFER_URL:-}
      TBANK_TAXATION: ${TBANK_TAXATION:-usn_income}
      TBANK_TAX: ${TBANK_TAX:-none}
      TBANK_PAYMENT_OBJECT: ${TBANK_PAYMENT_OBJECT:-service}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # SIGTERM → SIGKILL. Остановке нужно до 5 с на HTTP-сервер и до 15 с на
    # фоновые дела (ServerLive.ShutdownTimeout, Background.Grace); по
    # умолчанию Docker даёт лишь 10.
    stop_grace_period: 30s

  # Метрики бота (GameMetrics): Prometheus раз в 15 секунд читает их с app:9464
  # — порт внутренний, наружу не открыт — и хранит 30 дней.
  prometheus:
    image: prom/prometheus:v2.53.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  # Графики. Открыт только на localhost сервера — заходить через SSH-туннель:
  #   ssh -L 3000:localhost:3000 root@сервер  →  http://localhost:3000
  # Вход admin / GRAFANA_PASSWORD из .env (пусто — admin, Grafana попросит
  # сменить при первом входе). Дашборд «Пангея» — из docker/grafana/dashboards.
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/pangea.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
