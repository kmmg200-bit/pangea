server {
    host = "0.0.0.0"
    port = 8080
    port = ${?SERVER_PORT}
    # Секретный ключ из настроек Callback API группы. Пока пусто, события
    # конкурса активности (посты, лайки, комментарии) не принимаются.
    vk-secret = ${?VK_SECRET}
}

vk {
    token = "changeme"
    token = ${?VK_TOKEN}
    # peer_id of the common Pangea chat (2000000000 + chat_id): auction announcements go there.
    chat-peer-id = 2000000001
    chat-peer-id = ${?VK_CHAT_PEER_ID}
    # Слушать ВК ещё и по Long Poll — рядом с Callback API: сообщение идёт в
    # ход тем путём, которым пришло первым. Нужен и тумблер в настройках
    # сообщества: «Работа с API» → «Long Poll API» (см. README).
    long-poll = false
    long-poll = ${?VK_LONG_POLL}
}

# VK Mini App: инвентарь и аукцион вне чата (API /api/app/...). Защищённый
# ключ приложения — из его настроек в ВК. Пусто — API выключен.
mini-app {
    vk-secret = ${?VK_APP_SECRET}
}

# Касса Т-Банка: продажа дублонов за рубли.
#
# Пока terminal-key и password пусты, донат выключен целиком — у Рахадима
# остаётся заглушка «пока не работает». Так же он выключится, если прайс-лист
# не пройдёт проверку на старте (см. DonationSku.validate).
tbank {
    terminal-key = ""
    terminal-key = ${?TBANK_TERMINAL_KEY}
    password = ""
    password = ${?TBANK_PASSWORD}

    api-url = "https://securepay.tinkoff.ru/v2"
    api-url = ${?TBANK_API_URL}

    # Куда банк постит статусы платежей: POST /pay/tbank/notify этого приложения.
    # Нужен HTTPS и домен — ходит сюда сервер банка.
    notification-url = ""
    notification-url = ${?TBANK_NOTIFICATION_URL}

    # Куда банк возвращает БРАУЗЕР игрока после оплаты. Ведём в сообщество:
    # игрок попадает туда, где игра и продолжается, а бот через секунду пишет
    # ему о зачислении.
    # Можно точнее — сразу в диалог, но для этого нужен числовой id
    # сообщества: https://vk.ru/im?sel=-123456789
    success-url = "https://vk.ru/stigmapangeaproject"
    success-url = ${?TBANK_SUCCESS_URL}
    fail-url = "https://vk.ru/stigmapangeaproject"
    fail-url = ${?TBANK_FAIL_URL}

    # Налоговые поля кассового чека. Значения по умолчанию — для УСН «доходы»;
    # подтвердить с бухгалтерией, они уходят в фискальный документ.
    # taxation: osn | usn_income | usn_income_outcome | patent | envd | esn
    # tax: none | vat0 | vat5 | vat7 | vat10 | vat22 | vat105 | vat107 | vat110 | vat122
    # payment-object: признак предмета расчёта, тег ФФД 1212
    taxation = "usn_income"
    taxation = ${?TBANK_TAXATION}
    tax = "none"
    tax = ${?TBANK_TAX}
    payment-object = "service"
    payment-object = ${?TBANK_PAYMENT_OBJECT}

    # Ссылка на оферту — показывается на экране подтверждения покупки.
    offer-url = ""
    offer-url = ${?TBANK_OFFER_URL}

    # Срок жизни ссылки на оплату.
    link-minutes = 60
    link-minutes = ${?TBANK_LINK_MINUTES}

    # Сколько копеек игрок может оплатить за сутки. 0 — без ограничения
    # (с ноября 2026 лимита нет).
    daily-limit = 0
    daily-limit = ${?TBANK_DAILY_LIMIT}

    # Прайс-лист.
    # price — в КОПЕЙКАХ (как того требует Amount у банка), минимум 1000 (10 ₽, порог СБП).
    # receipt — наименование позиции в чеке: не длиннее 128 символов и без ' " & < >
    # id — ключ пакета; у уже продававшегося пакета его менять нельзя.
    # С ноября 2026 курс — 1 дублон за 1 ₽. Пакеты по прежнему курсу (d100, d250,
    # d550, d1200, d2500) из продажи сняты; их ключи больше не занимать: по ним
    # доплата за смену курса узнаёт старые заказы (RateBonus.OldRateSkus).
    packs = [
        { id = "d200",   doubloons = 200,   price = 20000,   label = "200 дублонов",   receipt = "200 дублонов (игровая валюта)" },
        { id = "d500",   doubloons = 500,   price = 50000,   label = "500 дублонов",   receipt = "500 дублонов (игровая валюта)" },
        { id = "d1100",  doubloons = 1100,  price = 100000,  label = "1100 дублонов",  receipt = "1100 дублонов (игровая валюта)" },
        { id = "d2400",  doubloons = 2400,  price = 200000,  label = "2400 дублонов",  receipt = "2400 дублонов (игровая валюта)" },
        { id = "d5000",  doubloons = 5000,  price = 400000,  label = "5000 дублонов",  receipt = "5000 дублонов (игровая валюта)" },
        { id = "d8000",  doubloons = 8000,  price = 600000,  label = "8000 дублонов",  receipt = "8000 дублонов (игровая валюта)" },
        { id = "d15000", doubloons = 15000, price = 1000000, label = "15000 дублонов", receipt = "15000 дублонов (игровая валюта)" }
    ]
}

postgres {
    jdbc-url = "jdbc:postgresql://localhost:5432/pangea"
    jdbc-url = ${?POSTGRES_JDBC_URL}
    username = "pangea"
    username = ${?POSTGRES_USER}
    password = "pangea"
    password = ${?POSTGRES_PASSWORD}
    # Пул соединений под локи игроков (AdvisoryLocks): лок держится на своём
    # соединении, пока идёт ход, — столько ходов разом, следующий ждёт. Занятость
    # — метрика pangea_lock_pool_connections. Два бота в выкладку держат по
    # столько же: следить, чтобы с основными пулами хватало max_connections (100).
    lock-pool-size = 20
    lock-pool-size = ${?POSTGRES_LOCK_POOL_SIZE}
}